name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  helm:
    name: helm lint + template
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: clavenar/clavenar-specs
          path: clavenar-specs

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.3

      - name: verify listener-matrix test dependency
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 13), sys.version'
          python3 -c 'import yaml; assert yaml.__version__ == "6.0.2", yaml.__version__'

      # Materialize subchart tarballs from Chart.lock (nats, vault).
      # Tarballs are gitignored; this step replaces the manual
      # `helm dep update` an operator would run before `helm install`.
      - name: helm dep update
        working-directory: charts/clavenar
        run: helm dep update .

      - name: helm lint
        working-directory: charts/clavenar
        run: helm lint .

      - name: helm template — default values
        working-directory: charts/clavenar
        run: helm template smoke . > /tmp/default.yaml

      - name: helm template — all-on combo
        working-directory: charts/clavenar
        run: |
          helm template smoke . \
            -f ../../tests/values-all-on.yaml \
            > /tmp/all-on.yaml

      - name: helm template — postgres ledger mode
        working-directory: charts/clavenar
        run: |
          helm template smoke . \
            --set persistence.ledger.enabled=false \
            --set services.ledger.postgres.enabled=true \
            --set services.ledger.postgres.dsnSecretName=ledger-postgres-dsn \
            --set services.ledger.postgres.tlsCaSecretName=ledger-postgres-ca \
            > /tmp/postgres.yaml

      # Bundled mode: nats + vault subcharts on, auto-mint TLS Job
      # emitted. The fixture lives outside the chart dir so it can
      # also drive a `kind` smoke test from a release tarball.
      - name: helm template — bundled mode
        working-directory: charts/clavenar
        run: |
          helm template smoke . -f ../../tests/values-bundled.yaml \
            > /tmp/bundled.yaml

      - name: helm template — optional listeners
        working-directory: charts/clavenar
        run: helm template smoke . -f ../../tests/values-optional.yaml > /tmp/optional.yaml

      - name: helm template — fail-closed production profile
        working-directory: charts/clavenar
        run: helm template smoke . -f ../../tests/values-production.yaml > /tmp/production.yaml

      - name: listener matrix + authorization policy checks
        run: |
          python3 scripts/check_dependency_readiness.py --source-root . --require-source
          python3 scripts/check-nats-authorization.py
          python3 scripts/check-listener-matrix.py --manifest /tmp/default.yaml
          python3 scripts/check-listener-matrix.py --manifest /tmp/all-on.yaml --values tests/values-all-on.yaml
          python3 scripts/check-listener-matrix.py --manifest /tmp/production.yaml --values tests/values-production.yaml
          python3 scripts/check-listener-matrix.py --manifest /tmp/optional.yaml --values tests/values-optional.yaml
          python3 scripts/check-listener-matrix.py --manifest /tmp/bundled.yaml --values tests/values-bundled.yaml
          python3 -m unittest discover -v -s tests -p 'test_*.py'

      - name: Prometheus rule syntax + console alert evaluation
        run: |
          docker run --rm --entrypoint=/bin/promtool \
            -v "$PWD:/workspace:ro" -w /workspace \
            prom/prometheus:v2.55.0 \
            check rules charts/clavenar/alerts/clavenar-alerts.yaml
          docker run --rm --entrypoint=/bin/promtool \
            -v "$PWD:/workspace:ro" -w /workspace \
            prom/prometheus:v2.55.0 \
            test rules tests/promtool-console-alerts.yml

      # Quick sanity: each render must produce at least the nine
      # Deployments. Catches a regression where a service template
      # silently stops emitting one.
      - name: smoke-check kind counts
        run: |
          for f in /tmp/default.yaml /tmp/all-on.yaml /tmp/postgres.yaml /tmp/production.yaml /tmp/optional.yaml /tmp/bundled.yaml; do
            n=$(grep -c '^kind: Deployment' "$f" || true)
            if [ "$n" -lt 9 ]; then
              echo "::error::$f rendered only $n Deployments (expected 9)"
              exit 1
            fi
          done

      # kubeconform validates the rendered manifests against the
      # upstream k8s schemas — catches typos like `protcol` or
      # missing required fields without a live cluster.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.13'
      - name: install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
      - name: kubeconform — default
        run: kubeconform -summary -strict -ignore-missing-schemas -kubernetes-version 1.30.0 /tmp/default.yaml
      - name: kubeconform — all-on
        run: kubeconform -summary -strict -ignore-missing-schemas -kubernetes-version 1.30.0 /tmp/all-on.yaml
      - name: kubeconform — postgres
        run: kubeconform -summary -strict -ignore-missing-schemas -kubernetes-version 1.30.0 /tmp/postgres.yaml
      - name: kubeconform — bundled
        run: kubeconform -summary -strict -ignore-missing-schemas -kubernetes-version 1.30.0 /tmp/bundled.yaml
      - name: kubeconform — optional
        run: kubeconform -summary -strict -ignore-missing-schemas -kubernetes-version 1.30.0 /tmp/optional.yaml
      - name: kubeconform — production
        run: kubeconform -summary -strict -ignore-missing-schemas -kubernetes-version 1.30.0 /tmp/production.yaml

  kind-environment:
    name: kind environment install — ${{ matrix.environment }}
    needs: helm
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: clavenar/clavenar-e2e
          path: clavenar-e2e
          token: ${{ secrets.WARDEN_REPO_TOKEN }}

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.13'

      - name: install pinned kind and kubectl
        env:
          KUBECTL_SHA256: 7f39bdcf768ce4b8c1428894c70c49c8b4d2eee52f3606eb02f5f7d10f66d692
        run: |
          mkdir -p "${RUNNER_TEMP}/clavenar-kind-bin"
          GOBIN="${RUNNER_TEMP}/clavenar-kind-bin" \
            go install sigs.k8s.io/kind@v0.26.0
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/clavenar-kind-bin/kubectl" \
            https://dl.k8s.io/release/v1.30.8/bin/linux/amd64/kubectl
          echo "${KUBECTL_SHA256}  ${RUNNER_TEMP}/clavenar-kind-bin/kubectl" \
            | sha256sum --check
          chmod 0755 "${RUNNER_TEMP}/clavenar-kind-bin/kubectl"
          echo "${RUNNER_TEMP}/clavenar-kind-bin" >> "${GITHUB_PATH}"

      - name: install ${{ matrix.environment }} posture
        run: scripts/kind-environment-install.sh "${{ matrix.environment }}" clavenar-e2e

  shellcheck:
    name: shellcheck
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: shellcheck governed shell scripts
        run: shellcheck -S warning scripts/*.sh charts/clavenar/files/tls-rotation/*.sh
