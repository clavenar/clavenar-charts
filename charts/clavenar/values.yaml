# Skeleton chart: 1 replica per service, no infra bundled, /health +
# /readyz probes on every service. Override per-service under
# `services.<svc>`.

# Deployment posture. `evaluation` preserves the backwards-compatible chart
# defaults. `production` activates render-time refusal unless workload TLS is
# externally managed, operator mTLS and NetworkPolicy are enabled, and the
# ledger trusts forwarded client addresses only from the canonical website
# workload over its mTLS listener. See tests/values-production.yaml.
deploymentProfile: evaluation

# Exact product-stack release represented by a protected digest values file.
# Protected publication sets this alongside every immutable image digest. The
# chart refuses digest-bound renders without it instead of misreporting the
# frozen legacy appVersion. Empty is supported only by the legacy tag-based
# chart path, where Chart.appVersion remains the fallback.
stackRelease: ""

# Historical signing-key and RFC 3161 verification for Ledger. It activates
# when workload TLS is configured: Ledger fetches the complete bounded-fresh
# signing-key lineage from Identity over exact workload mTLS and re-verifies
# stored timestamp responses against the pinned public trust files packaged by
# this chart. The same workload-TLS block requires regulatory-bundle signing:
# every export binds a fresh complete verification result and independently
# verifies Identity's response before emission. Evaluation records TSA evidence
# without making it a hard availability dependency; production validation
# requires tsaRequired=true.
ledgerCryptographicVerification:
  enabled: true
  tsaRequired: false
  tsaUrl: https://freetsa.org/tsr
  anchorIntervalSeconds: 3600

# Tag fallback chain: services.<svc>.image.tag → imageTag → appVersion.
imageRegistry: ghcr.io/clavenar
imageTag: ""
imagePullPolicy: IfNotPresent
imagePullSecrets: []

# Shared HIL authentication material. With the default empty
# existingSecretName, the chart creates `<release>-shared-tokens` and
# preserves its generated `hil-session-key`, `hil-decide-token`, one-use
# `hil-bootstrap-token`, and Brain `brain-cache-hmac-key` data across
# upgrades. Production operators can instead point every chart-managed
# secretKeyRef at a Secret populated by External Secrets, Secrets Store CSI,
# Sealed Secrets, or another secret manager. The existing Secret must contain
# all four keys; the chart deliberately does not copy or render their values.
authSecrets:
  existingSecretName: ""
  # Public, non-secret credential generation identifier. Change this only
  # after the referenced Secret has been atomically updated. Every chart
  # Deployment then rolls onto that generation. In chart-managed evaluation
  # mode, changing it also generates new HIL values; repeating the same value
  # is a no-op that preserves the current Secret data.
  rotationId: bootstrap-v1

# Dedicated HIL exact-payload encryption key. Production operators own this
# Secret and provide 64 hexadecimal characters (32 random bytes) at `key`;
# HIL rejects inline key material and fails before opening SQLite if the
# mounted file is absent or malformed. The public bundled evaluation recipe
# opts into a chart-managed, upgrade-stable key in `<release>-shared-tokens`.
# Advance authSecrets.rotationId when rotating either form so the HIL pod
# rolls.
hilPayloadProtection:
  managedEvaluation: false
  secretName: clavenar-hil-payload
  key: hil-payload-key

# Public Ed25519 cluster trust anchors consumed by Identity's production
# `k8s-key-bound` evidence verifier. The Secret contains public keys only;
# the evidence-signing private key remains with the cluster attester. Empty
# keeps the verifier fail-closed in evaluation. The production profile refuses
# to render without this public trust projection and an external Vault signer.
attestationTrustAnchors:
  secretName: ""
  key: k8s-trust-anchors.json
  # Optional public approval document used only to admit the separately
  # deployed Simulator's first key-bound workload enrollment. It must live in
  # the same public-trust Secret; private attestation keys remain absent.
  bootstrapApprovalKey: ""

# Optional public TPM 2.0 attestation-key registry consumed only by Identity.
# Supplying it selects the combined k8s-key-bound+tpm2-quote provider for
# Identity and Proxy; it never replaces the Kubernetes verifier. The Secret
# must contain only pinned public AK material and qualified names.
tpm2AttestationTrust:
  secretName: ""
  key: tpm2-trust-anchors.json

# Optional operator-supplied ConfigMap containing Identity's tenant/group
# capability map. The chart projects only the named key into Identity and
# leaves the ConfigMap lifecycle with the environment owner.
identityCapabilities:
  existingConfigMapName: ""
  key: capabilities.toml

# Public verification material for the self-contained evaluation quickstart.
# This contains no private key or signing authority. The packaged bundled
# values enable it so Identity can prove its fail-closed OIDC and attestation
# wiring on a clean cluster; production validation forbids it.
evaluationPublicTrust:
  enabled: false
  # Evaluation environments may project a deployment-specific, public
  # measurement approval beside the packaged trust anchors. The Secret must
  # contain public data only; Identity never receives the attestation signer.
  bootstrapApprovalSecretName: ""
  bootstrapApprovalKey: ""

# NATS + Vault default to BYO (bring-your-own). Flip `bundled.enabled`
# to have the chart install the upstream subcharts alongside the
# clavenar services in a single `helm install` — see Chart.yaml deps.
nats:
  # Injected as NATS_URL into every service when bundled.enabled is
  # false. When bundled.enabled is true, the helper overrides this
  # with the in-cluster service DNS (`nats://<release>-nats:4222`).
  url: nats://nats:4222
  # JetStream-aware monitoring endpoint used by bounded init gates. BYO
  # operators must publish this only inside the cluster.
  readinessUrl: http://nats:8222/healthz?js-enabled-only=true
  # BYO broker declarations are operator-owned evidence. Evaluation renders
  # may leave them empty but make no authorization/persistence claim;
  # production refuses external mode until all fields are explicit.
  external:
    operator: ""
    authorizationContract: ""
    jetstreamPersistence: false
  bundled:
    # Set true to install the upstream nats-io/nats subchart
    # alongside the clavenar services. Single-node JetStream is the
    # default shape; see tests/values-bundled.yaml for the canonical
    # bundled config (JetStream + PVC + mTLS). All other keys under
    # `nats:` pass through to the upstream subchart — see
    # https://github.com/nats-io/k8s/blob/main/helm/charts/nats/values.yaml
    # for the full surface.
    #
    # mTLS coupling: when `tlsBundle.secretName` is also set, the
    # clavenar services dial NATS over TLS (NATS_TLS_{CERT,KEY,CA}_PATH
    # → require_tls in async-nats). The subchart must terminate TLS to
    # match — set `nats.config.nats.tls.enabled: true` with
    # `merge.verify_and_map: true` and `nats.tlsCA.enabled: true` against
    # the same Secret. Identity-blind `verify` is rejected. The
    # clavenar.natsUrl helper render-fails if you enable one side without
    # the other (avoids the `InvalidContentType` crash).
    enabled: false
  # Bundled mode is always durable JetStream. The exact authorization users
  # below are generated from files/nats-authorization-v1.fixture.json and are
  # checked byte-for-byte/permission-for-permission in CI.
  config:
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 10Gi
    nats:
      tls:
        merge:
          verify_and_map: true
    merge:
