# Shared replica contract for mandatory distributed control projections.
# Identity owns the revocation/force-HIL/decoy buckets; Proxy owns grant-use
# CAS counters. Every participating binary must receive the same exact value.
controlState:
  replicas: 1

vault:
  # VAULT_ADDR for proxy + identity when bundled.enabled is false.
  # Empty disables Vault wiring. When bundled.enabled is true, the
  # helper overrides this with `http://<release>-vault:8200`.
  addr: ""
  # Active/unsealed endpoint used by Identity and Proxy startup gates.
  readinessUrl: http://vault:8200/v1/sys/health
  # k8s Secret holding separate scoped token keys for Identity and Proxy.
  # When bundled.enabled is true, autogenerated as
  # `<release>-vault-token` carrying the dev-mode root token.
  tokenSecretName: ""
  identityTokenKey: identity-token
  proxyTokenKey: proxy-token
  bundled:
    # Set true to install the upstream hashicorp/vault subchart
    # in dev mode (auto-unsealed, in-memory) and auto-provision the
    # transit engine + `clavenar-identity` key via a post-install Job.
    # Dev mode loses state on pod restart; the post-install hook
    # re-creates the transit key on every upgrade. Production
    # deployments should set this false and point `vault.addr` /
    # `vault.tokenSecretName` at an externally-managed Vault.
    enabled: false
  # Known dev-mode root token. Copied into the distinct evaluation-only
  # token keys; production refuses the bundled Vault path entirely.
    devToken: root
    transit:
      # Name of the transit key the bootstrap Job creates. Must match
      # `clavenar-identity`'s `CLAVENAR_IDENTITY_VAULT_KEY_NAME` env
      # (default `clavenar-identity`). Override only if you've changed
      # the identity-side env explicitly.
      keyName: clavenar-identity
  # Bundled Vault is internal infrastructure. External publication is
  # rejected by templates/validate.yaml.
  server:
    # Vault chart >=0.30 also applies server.extraLabels to its helm-test
    # Pod, allowing an exact NetworkPolicy peer instead of namespace-wide
    # test access.
    extraLabels:
      clavenar.io/network-client: vault-server-test
    service:
      type: ClusterIP

# Bundled lab-only echo MCP server. The clavenar-proxy forwards every
# approved tool call to CLAVENAR_UPSTREAM_URL; production deploys point
# this at a real MCP server (filesystem-MCP, GitHub-MCP, etc.). Setting
# `upstreamStub.enabled=true` instead deploys the `clavenar-upstream-stub`
# binary (shipped inside the clavenar-simulator image) as a sidecar
# Deployment + Service in the release and auto-wires
# `CLAVENAR_UPSTREAM_URL=http://<release>-upstream-stub:9000/mcp` on the
# proxy. The stub echoes every MCP frame back verbatim — handy for
# proving the Brain + Policy + HIL + ledger path end-to-end without
# bringing up a real MCP server. Not for production use.
#
# Pairs with `agentVaultSeed.enabled` (below) so the chart-deployed
# Vault carries the `agent-001` stub credential the proxy gates on.
upstreamStub:
  enabled: false
  # Uniform readiness endpoint for a BYO upstream. Bundled mode replaces this
  # with the release-local upstream-stub Service.
  readinessUrl: http://upstream-stub:9000/readyz
  image:
    # The simulator image ships `clavenar-upstream-stub` as a secondary
    # binary alongside the main simulator. Same image, command override
    # in templates/upstream-stub.yaml selects the stub binary.
    repository: ghcr.io/clavenar/clavenar-simulator
    digest: ""
    # Empty → falls back to .Values.imageTag → Chart.appVersion. Safe
    # to track appVersion now that every published clavenar-simulator
    # image ships the MCP-protocol-compliant upstream-stub binary
    # (real initialize + tools/list + tools/call shapes). The earlier
    # 0.1.1 echo-only stub is the only ancestor that couldn't satisfy
    # an MCP client.
    tag: ""
    pullPolicy: IfNotPresent
  port: 9000

# Execution-gateway MCP server. When `exec.enabled=true`, the chart
# emits a Deployment + Service + workspace PVC for `clavenar-exec` and
# the proxy points CLAVENAR_UPSTREAM_URL at it instead of the
# upstream-stub. clavenar-exec implements structured `execute_command`
# plus read_file, write_file, edit_file, list_directory, search_files,
# and fetch_url, and forwards everything
# else to the upstream-stub via CLAVENAR_EXEC_FALLBACK_URL — tools/list
# returns the union of both catalogs.
#
# Pairs with the lab pod's `permissions.deny` posture (see lab/) so the only
# process surface an agent can reach flows through the clavenar security
# pipeline. The structured-command policy is mounted immutable and read-only.
#
# `fetchAllowlist` is a list of normalized HTTP(S) origin + path boundaries.
# Credentials, fragments, sibling domains, local-use names, and non-public IP
# literals reject at Exec startup. NetworkPolicy still denies external egress;
# WP-13.5 must land before external fetch can be enabled.
exec:
  enabled: false
  image:
    repository: clavenar-exec
    # Exact protected artifact identity; takes precedence over tag.
    digest: ""
    # Evaluation/dev fallback for locally built images. Use a unique
    # build-derived value; `latest` is rejected. Production forbids Exec.
    tag: ""
    pullPolicy: IfNotPresent
  port: 9001
  # Plain health-only listener. It never serves MCP or tool routes.
  healthPort: 9002
  # Shared workspace PVC mounted at /workspace inside clavenar-exec and
  # (when the lab pod is enabled) inside the agent pod RW so
  # `kubectl exec -- ls /workspace` works for operators.
  workspaceSize: 2Gi
  # The exact structured-execution/v1 bounded ephemeral mount.
  scratchSizeLimit: 64Mi
  fetchAllowlist: []
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 250m, memory: 256Mi }

# One-shot Job that seeds Vault with a stub api_key for agent-001 (the
# CN baked into the auto-mint starter `client.crt`). The proxy refuses
# every request with `403 No credentials found for agent <id>` until a
# Vault entry exists at `secret/data/agents/<tenant>/<id>`. The Job is opt-in;
# operators using BYO Vault must seed the entry themselves (see
# `lab/README.md` for the curl).
#
# Gated on BOTH `agentVaultSeed.enabled` AND `vault.bundled.enabled` —
# without the bundled Vault, there's nothing for the Job to talk to.
agentVaultSeed:
  enabled: false
  # Tenant-qualified state partition. The auto-mint starter certificate
  # is still CN-only, so its explicit compatibility partition is the
  # reserved legacy sentinel until tenant-bearing lab SVIDs ship.
  tenant: _legacy_unqualified
  # The agent_id the proxy will see on inbound mTLS connections. Matches
  # the CN in the auto-mint starter client cert. Change only if you've
  # supplied a custom tlsBundle Secret with a different starter CN.
  agentId: agent-001
  # The opaque value stored under
  # `secret/data/agents/<tenant>/<agentId>`. The
  # proxy only checks for *presence*, not value, so the literal here is
  # a marker. Production deployments source real per-agent credentials
  # from their own Vault policies — this Job is lab-only.
  stubApiKey: stub-key

# Bare-name DNS alias from `proxy` to the actual `<release>-proxy`
# Service. In-cluster clients need to dial `proxy` (not
# `<release>-proxy`) because the auto-mint script stamps the proxy
# server cert SAN as `DNS:proxy, DNS:proxy.clavenar.local,
# DNS:localhost` — the TLS handshake validates SNI against the SAN.
#
# Enable whenever agents or the Assurance workload speak directly to the
# proxy's Service IP. It is required for Assurance with managed workload TLS.
# Skip only when no in-cluster client needs the alias (for example, an
# Ingress/Gateway is the sole mTLS caller), or when another `proxy` Service
# already exists in the namespace.
proxyAlias:
  enabled: false

# Bare-name authority DNS alias from `identity` to
# `<release>-identity.<namespace>.svc.cluster.local`. Managed workload SVIDs
# carry the stable `DNS:identity` name so their renewed server certificate
# remains valid across Helm release names. Required whenever workloadIdentity
# and workload TLS are both enabled.
identityAlias:
  enabled: true

# Drain cap in seconds. Set as CLAVENAR_GRACEFUL_DRAIN_SECS;
# terminationGracePeriodSeconds = drainCapSecs + 5 so kubelet SIGKILL
# fires after the in-process watchdog has had its window.
drainCapSecs: 30

# Grafana dashboard ConfigMaps. Bundles clavenar-overview + clavenar-cost
# (the two dashboards shipped under charts/clavenar/dashboards/). The
# kube-prometheus-stack Grafana sidecar discovers them via the
# `grafana_dashboard: "1"` label. Disable if your Grafana isn't running
# the sidecar — operators can still import the JSON manually from
# the chart source.
dashboards:
  enabled: true

# Prometheus Operator alerting rules. The chart emits a standard
# PrometheusRule; labels must match the owning Prometheus ruleSelector.
alerting:
  enabled: true
  prometheusRuleLabels:
    release: kube-prometheus-stack

# Prometheus Operator Alertmanager routing. The chart emits an
# AlertmanagerConfig and accepts only references to operator-owned Secrets.
# The URL must identify a durable operator-backed receiver; the bearer token
# must authenticate Alertmanager delivery. Inline credentials and discard
# receivers are intentionally unsupported.
alertmanager:
  enabled: false
  configLabels:
    alertmanagerConfig: clavenar
  receiver:
    urlSecretName: ""
    urlSecretKey: webhook-url
    bearerSecretName: ""
    bearerSecretKey: token

# Every service Dockerfile ships USER 65532 (Google distroless nonroot).
# fsGroup remounts PVCs so SQLite writes work on ledger/hil/identity.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  # Preserve the helper's owner-only 0700 subdirectory after its first mount;
  # repeated recursive fsGroup permission changes would broaden it and make
  # the service fail closed on restart.
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# Prometheus scrape: pod-level annotations only (no ServiceMonitor/
# PodMonitor CRD) so this works with vanilla Prometheus + the
# de-facto `prometheus.io/scrape` discovery rule. Cardinality is
# bounded in-process — no per-agent labels. Disable per-service via
# `services.<svc>.metrics.enabled: false`; layer extra annotations
# via `services.<svc>.metrics.extraAnnotations`.

probeDefaults:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

services:
  proxy:
    enabled: true
    replicas: 1
    # Delegation grants are accepted only against a bounded-fresh identity
    # JWKS snapshot. These chart-governed values are emitted together with
    # the in-release identity public endpoint; proxy+identity is a required
    # deployment pair. maxStalenessSeconds must exceed refreshSeconds.
    grantJwksRefreshSeconds: 30      # valid range 1..300
    grantJwksMaxStalenessSeconds: 120 # valid range 2..900
    grantJwksFetchTimeoutSeconds: 5  # valid range 1..30
    image:
      repository: clavenar-proxy
      digest: ""
      tag: ""
    port: 8443        # mTLS surface — Service exposes this for agents
    healthPort: 8080  # plain-HTTP /health + /readyz — kubelet probes this
    serviceType: ClusterIP
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 512Mi }
    probes:
      type: httpGet
      health: /health
      ready: /readyz
      # Proxy's main port is mTLS-gated; probes target healthPort.
      port: 8080
    # Listener binding is chart-governed; use extraEnv only for settings the
    # chart does not emit (for example CLAVENAR_UPSTREAM_URL in BYO mode).
    extraEnv: []
    # Metrics on the plain-HTTP port so vanilla Prometheus pods can
    # scrape without a client cert.
    metrics:
      enabled: true
      port: 8080

  brain:
    enabled: true
    replicas: 1
    image:
      repository: clavenar-brain
      digest: ""
      tag: ""
    # Application port. Without tlsBundle.secretName the binary keeps its
    # compatibility listener on pod loopback, so the Service cannot turn it
    # into a plaintext provider path. With a bundle this port is rustls plus
    # route-aware SPIFFE authorization. CLAVENAR_BRAIN_TLS_DIR and the
    # inspect-only ALLOWED_CALLERS env are injected in that mode.
    port: 8081
    # Plain-HTTP /, /health, /readyz, and /metrics under TLS mode so kubelet
    # probes and Prometheus scrapes don't need a client cert. No model or
    # provider operation is installed here. Probes auto-aim at healthPort
    # under TLS; the render-only compatibility profile falls back to `port`.
    healthPort: 9081
    # Provider-backed auxiliary operations are always configured in strict
    # mode by the official chart. Explain is authorized only for the exact
    # policy-engine workload; narrate and model-snapshot are authorized only
    # for the exact console workload. These are complete SPIFFE URIs, never
    # prefixes or comma-separated lists.
    explainCallerSpiffe: spiffe://clavenar.local/service/policy-engine
    narrateCallerSpiffe: spiffe://clavenar.local/service/console
    # Independent fixed-minute request gates plus one shared fixed-hour
    # provider-spend reservation. Values must be positive. The whole-call
    # timeout and JSON body limit carry the same upper bounds enforced by
    # clavenar-brain before either listener binds.
    explainRateLimitPerMinute: 20
    narrateRateLimitPerMinute: 60
    auxSpendBudgetMicroUsdPerHour: 5000000
    auxTimeoutMillis: 5000       # valid range 1..30000
    auxBodyLimitBytes: 16384     # valid range 1..1048576
    # Provider routing contains no credential bytes. `mock` is the
    # credential-free deterministic default; hosted providers must reference
    # an existing Secret through providerCredentials below. `external` mounts
    # an operator-owned v2 models file instead of generating the single-target
    # routing file.
    providerRouting:
      provider: mock             # mock, anthropic, openai, google, bedrock, vertex, ollama, external
      fastModel: claude-haiku-4-5
      deepModel: claude-opus-4-7
      # Lowest-cost current hosted choice: provider google with both models
      # set to gemini-3.5-flash-lite and providerCredentials.google selected.
      baseUrl: ""                 # optional HTTPS override; Ollama also permits HTTP
      timeoutMillis: 30000       # valid range 100..120000
      awsRegion: us-east-1       # required for bedrock
      vertexProject: ""          # required for vertex
      vertexLocation: us-central1
      existingConfigMapName: ""  # required only for provider: external
      existingConfigMapKey: models.yaml
      # Advance after changing an external ConfigMap or referenced provider
      # Secret so the Brain Deployment rolls without exposing secret bytes.
      rotationId: initial-v1
    # Static, least-privilege environment projections. Set only the providers
    # selected by managed routing/embeddings, or those referenced by an
    # external routing ConfigMap. Inline API-key values are rejected through
    # extraEnv.
    providerCredentials:
      anthropic: { secretName: "", secretKey: anthropic-api-key }
      openai: { secretName: "", secretKey: openai-api-key }
      google: { secretName: "", secretKey: google-api-key }
      voyage: { secretName: "", secretKey: voyage-api-key }
    # Embeddings are configured independently from generation and never fall
    # back. Hosted providers use the matching providerCredentials entry.
    embedding:
      provider: disabled         # disabled, voyage, openai, ollama
      model: ""
      dimensions: 0              # required when enabled; valid range 1..8192
      baseUrl: ""                 # optional HTTP(S) origin override; no path
      timeoutSeconds: 30         # valid range 1..300
      maxConcurrency: 8          # valid range 1..1024
    serviceType: ClusterIP
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 512Mi }
    probes:
      type: httpGet
      health: /health
      ready: /readyz
    # Provider, model, and credential environment variables are chart-owned;
    # extraEnv remains available only for unrelated Brain settings.
    extraEnv: []
    metrics:
      enabled: true

  policyEngine:
    enabled: true
    replicas: 1
    image:
      repository: clavenar-policy-engine
      digest: ""
      tag: ""
    # Application port. Plain HTTP without tlsBundle.secretName set;
    # rustls + SPIFFE-allowlist on the same port when the bundle is
    # mounted. CLAVENAR_POLICY_TLS_DIR + ALLOWED_CALLERS env vars are
    # auto-injected by `clavenar.backendEnvs` when tlsBundle is set
    # (B7 v1.x+2 session 4).
    port: 8082
    # Plain-HTTP /health + /readyz + /metrics under TLS mode (kubelet
    # probes + Prometheus scrapes don't carry a client cert). Under
    # plain HTTP mode the engine serves everything on `port`; the
    # chart's probe helper falls back to `port` when healthPort is
    # unused.
    healthPort: 9082
    serviceType: ClusterIP
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 250m, memory: 256Mi }
    probes:
      type: httpGet
      health: /health
      ready: /readyz
    extraEnv: []
    metrics:
      enabled: true

  ledger:
    enabled: true
    # SQLite mode (the default) is pinned to replicas: 1.
    # Concurrent writers across replicas corrupt the SQLite file even
    # on a shared RWX PVC, and SQLite's WAL doesn't help across hosts.
    #
    # The staged PostgreSQL topology also remains replicas: 1 until the
    # WP-12.8 failure-model contract is delivered. It moves only the Ledger
    # chain store to external PostgreSQL; this is not whole-stack HA.
    replicas: 1
    image:
      repository: clavenar-ledger
      digest: ""
      tag: ""
    # Plain HTTP listener — serves Caddy / Ingress for the public
    # `/verify` + `/audit/{agent_id}*` browser surface, kubelet probes
    # (`/health` + `/readyz`), and Prometheus scrapes (`/metrics`).
    port: 8083
    # mTLS application port under TLS mode (B7 v1.x+2 session 5).
    # `clavenar.backendEnvs` injects CLAVENAR_LEDGER_MTLS_ADDR pointing
    # here when tlsBundle is set; the internal write + console-only
    # read surface lives behind rustls + SPIFFE-allowlist. Exposed as
    # a second Service port (`name: mtls`) when tlsBundle.secretName
    # is non-empty, so console / deep-review can dial it by Service
    # DNS without any per-release manifest tweak.
    mtlsPort: 8183
    # The public website may forward the original client address only after
    # authenticating to ledger's mTLS listener as this exact workload. Empty
    # keeps legacy evaluation behavior; the production profile requires the
    # canonical website URI and requireTrustedProxy=true.
    trustedProxySpiffe: ""
    requireTrustedProxy: false
    serviceType: ClusterIP
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 500m, memory: 512Mi }
    probes:
      type: httpGet
      health: /health
      ready: /readyz
    # Staged, non-promoted PostgreSQL evaluation. The DSN (including
    # credentials) and private CA are projected from existing Secrets.
    # The DSN host is the verified TLS server name. Enabling this requires
    # persistence.ledger.enabled=false and still requires replicas: 1.
    postgres:
      enabled: false
      dsnSecretName: ""
      dsnSecretKey: url
      tlsCaSecretName: ""
      tlsCaSecretKey: ca.crt
      # Advance after rotating either existing Secret to roll the Pod (Secret
      # values are intentionally never copied into Deployment annotations).
      rotationId: initial
    # Backend, DSN, CA, and SQLite-path variables are chart-governed.
    extraEnv: []
    metrics:
      enabled: true

  hil:
    enabled: true
    # Machine decisions are synthesized by HIL from the simulator workload
    # certificate and confined to this exact tenant.
    simulatorTenant: simulator
    # SQLite-backed; pin replicas to 1. No Postgres backend planned
    # for hil in v1 — multi-replica HIL is gated on the storage
    # trait migration spreading from ledger to hil + identity.
    replicas: 1
    image:
      repository: clavenar-hil
      digest: ""
      tag: ""
    port: 8084
    # Plain-HTTP /health + /readyz + /metrics under mTLS receive
    # (session 6). Kubelet + Prometheus scrape here; the application
    # port (8084) is rustls-gated when tlsBundle.secretName is set.
    healthPort: 9084
    serviceType: ClusterIP
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 250m, memory: 256Mi }
    probes:
      type: httpGet
      health: /health
      ready: /readyz
    # Restart-safe WebAuthn ceremony governance. HIL enforces all dimensions
    # transactionally in the same SQLite database as the credential roster.
    webauthnCeremony:
      ttlSeconds: 300
      attemptLimit: 10
      rateWindowSeconds: 60
      startLimits:
        subject: 5
        tenant: 100
        source: 20
        deployment: 500
      pendingLimits:
        subject: 3
        tenant: 64
        source: 12
        deployment: 256
    # Outbound trigger/update/resolve lifecycle. `enforce` makes /readyz fail
    # until at least one complete channel is configured; `warn` keeps the
    # default chart usable without assuming an operator's provider.
    notifications:
      mode: warn
      timeoutSeconds: 5
      webhook:
        url: ""
        # Operator-owned Secret containing a 32+ byte bearer token. Required
        # when url is non-empty; the token is mounted as a file.
        tokenSecretName: ""
        tokenSecretKey: token
    extraEnv:
      - name: CLAVENAR_HIL_DB
        value: /var/lib/clavenar/hil.db
    metrics:
      enabled: true

  identity:
    enabled: true
    # SQLite-backed (agents table + agent_ledger lifecycle chain).
    # Pin replicas to 1 — same SQLite-on-shared-PVC constraint as
    # ledger and hil.
    replicas: 1
    # Exact JetStream KV replica count for the durable actor-token replay
    # bucket. Identity validates the live bucket against this value and fails
    # closed when the store is absent, partitioned, or configured differently.
    # Choose 1..5 to match the number of NATS servers available to JetStream.
    replayReplicas: 1
    image:
      repository: clavenar-identity
      digest: ""
      tag: ""
    port: 8086
    # Dual-listener under mTLS receive (session 6). Plain HTTP on
    # `port` serves the public subset + /stats + JWKS + health; mTLS
    # on `mtlsPort` carries the internal /svid + /grant + /sign +
    # /actor-token + /agents surface. Agent /svid accepts only a
    # self-signed CSR (≤16 KiB) whose DER digest binds the attestation;
    # no agent private key is accepted or returned. Exposed as a second Service
    # port (`name: mtls`) when tlsBundle.secretName is non-empty.
    mtlsPort: 8186
    serviceType: ClusterIP
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 250m, memory: 256Mi }
    probes:
      type: httpGet
      health: /health
      ready: /readyz
    extraEnv:
      - name: CLAVENAR_IDENTITY_DB
        value: /var/lib/clavenar/identity.db
    # Optional operator-owned projections, for example an IdP's public RS256
    # JWKS reconciled by External Secrets or Secrets Store CSI. extraEnv should
    # carry only the file path; key bytes stay in the read-only volume.
    extraVolumeMounts: []
    extraVolumes: []
    metrics:
      enabled: true

  # Forensic-tier async auditor. Subscribes to clavenar.forensic, samples,
  # runs the configured LLM against the bundle. Pairs with brain (fast,
  # in-band) as the slow-but-deep tier. Spec §"Forensic-tier deep review".
  # Review jobs, delivery state, alerts, and daily budgets are persisted in
  # the deep-review-owned JetStream KV bucket; no pod-local PVC is required.
  deepReview:
    enabled: true
    replicas: 1
    image:
      repository: clavenar-deep-review
      digest: ""
      tag: ""
    # /metrics + /health scrape port. 8087 because identity owns 8086.
    port: 8087
    serviceType: ClusterIP
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 512Mi }
    # Liveness proves the diagnostics process; readiness additionally proves
    # NATS, the durable consumer, and provider configuration.
    probes:
      type: httpGet
      health: /health
      ready: /readyz
    # Provider selection is explicit. Mock keeps the chart usable without an
    # Anthropic account and is prohibited from containment enforcement.
    extraEnv:
      - name: CLAVENAR_DEEP_REVIEW_PROVIDER
        value: mock
      - name: CLAVENAR_DEEP_REVIEW_CONTAINMENT
        value: shadow
      - name: CLAVENAR_DEEP_REVIEW_DAILY_TOKEN_CAP
        value: "200000"
      - name: CLAVENAR_DEEP_REVIEW_SAMPLE_RATE_GREEN
        value: "0.01"
    metrics:
      enabled: true

  # Continuous-assurance daemon (built from clavenar-chaos-monkey).
  # Fires the attack catalog at the proxy on a cadence and publishes
  # assurance_run results the console's /assurance page reads. Boots
  # paused — arm through the Admin console. Attack runs authenticate
  # with the generic agent client cert from tlsBundle; control requires
  # exact-console workload mTLS and never falls back to plaintext.
  assurance:
    enabled: true
    replicas: 1
    image:
      repository: clavenar-chaos-monkey
      digest: ""
      tag: ""
    # mTLS control plane (/status, /running, /run-now).
    port: 8088
    # Plain, side-effect-free /health + /readyz diagnostics. No control
    # or status route is installed on this listener.
    healthPort: 9088
    serviceType: ClusterIP
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 250m, memory: 256Mi }
    # Probes use the separate plaintext diagnostics listener.
    probes:
      type: httpGet
      health: /health
      ready: /readyz
      port: 9088
    # Durable completion is acknowledged only by this exact JetStream
    # stream. The publish subject must be captured by the named stream;
    # changing either value requires a matching broker-side contract.
    forensicSubject: clavenar.forensic
    forensicStream: clavenar-forensic
    # Independent request, whole-run, and publish/ack deadlines. The run
    # deadline must be at least as long as each nested deadline. Bounds are
    # enforced by values.schema.json and templates/validate.yaml.
    requestTimeoutSecs: 30
    runTimeoutSecs: 900
    publishTimeoutSecs: 10
    extraEnv:
      # Paused at boot; the daily cadence starts once un-paused.
      - name: CLAVENAR_ASSURANCE_START_RUNNING
        value: "false"
      - name: CLAVENAR_ASSURANCE_INTERVAL_SECS
        value: "86400"
    # The diagnostics listener serves no /metrics.
    metrics:
      enabled: false

  # Operator console. The safe raw-chart default is `demo-only`: the primary
  # port serves the curated demo router. A valid signed demo cookie is
  # a prefix-scoped demo Viewer and can never create operator or Admin
  # authority. Enabling operatorMtls converts that
  # same primary port to native end-to-end mTLS and requires a dedicated
  # public operator trust Secret. The operator CA private key and every
  # operator leaf private key stay outside Kubernetes and are never
  # projected into this pod.
  console:
    enabled: true
    replicas: 1
    image:
      repository: clavenar-console
      digest: ""
      tag: ""
    # Primary listener. In the default demo-only posture this is plain
    # HTTP with the curated demo surface. In `webauthn` mode it serves the
    # complete role-gated router on the exact localhost WebAuthn origin. In
    # `operator-mtls` mode it is HTTPS with mandatory operator client
    # certificates.
    port: 8085
    # Optional second plain-HTTP demo listener. It is meaningful only
    # beside the operator-mTLS primary listener, so the chart rejects
    # demo.enabled=true unless operatorMtls is enabled.
    demoPort: 9085
    # Plain HTTP operational listener. Only /health, /readyz, and
    # /metrics are served here; it is never published by the Service.
    diagnosticsPort: 9185
    # Optional only because Simulator belongs to the Compose topology. Empty
    # makes Console report the explicit `simulator: skipped` Helm check.
    simulatorReadinessUrl: ""
    serviceType: ClusterIP
    auth:
      # `demo-only` keeps the raw chart useful for evaluation. Customer
      # installation overlays select `webauthn`, which exposes the full
      # role-gated Console over a localhost port-forward and creates the first
      # Admin through HIL's one lifetime deployment bootstrap. `operator-mtls`
      # is the explicit hardened alternative and must agree with
      # operatorMtls.enabled below.
      mode: demo-only
    operatorMtls:
      # Disabled by default so a fresh install needs no operator PKI and
      # cannot accidentally mint synthetic Admin authority. Enable only
      # after provisioning both tlsBundle.secretName (console server
      # certificate/key + public workload CA) and publicTrustSecretName.
      enabled: false
      # Existing Secret containing exactly the public operator trust
      # inputs `ca.crt` and `operators.json`. The registry binds an exact
      # leaf SHA-256 fingerprint + SPIFFE URI to viewer/approver/admin.
      # No operator CA or leaf private key belongs in this Secret.
      publicTrustSecretName: ""
    # Exact browser origins allowed to submit simulator/assurance mutations.
    # HTTPS is required except for the single WebAuthn port-forward origin
    # http://localhost:8085. Each value is compared as a complete Origin,
    # never by suffix/prefix.
    mutationOrigins: []
    demo:
      # Adds the curated demo router on demoPort while operator mTLS owns
      # the primary port. Disabled by default; NetworkPolicy peers must
      # still be selected explicitly before another pod can reach it.
      enabled: false
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 250m, memory: 256Mi }
    probes:
      type: httpGet
      health: /health
      ready: /readyz
      port: 9185
    # Backend URLs are derived from .Release.Name + service names via the
    # helper. Backend, listener, auth, and TLS env names cannot be duplicated
    # through extraEnv. The release marker returned from /version.json is
    # likewise fixed to Chart.appVersion. This keeps rendered ports,
    # NetworkPolicy, release evidence, and the in-process trust boundary in
    # lockstep.
    extraEnv: []
    metrics:
      # Console diagnostics annotations are chart-governed; unlike other
      # services, this block deliberately accepts no extraAnnotations that
      # could redirect a scraper to the operator or demo listener.
      enabled: true
      port: 9185
      path: /metrics

# Persistence — SQLite-backed services only. Mounts at /var/lib/clavenar
# (matches CLAVENAR_*_DB defaults). Disable only for disposable data.
persistence:
  # Required for the Proxy's durable server-execution intent, result, and
  # forensic-outbox contract. The chart rejects replicas >1 while this
  # SQLite volume is enabled.
  proxy:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  ledger:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  hil:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  identity:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # The Policy database contains tenant-qualified active versions, immutable
  # version history, mutation audit metadata, and its forensic outbox. It is
  # governance state, not a cache, and is retained across upgrades/rollbacks.
  policyEngine:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
    # Set to a pre-provisioned claim to make storage lifecycle operator-owned.
    # When non-empty, the chart mounts it and does not emit its own PVC.
    existingClaim: ""

# Required SQLite upgrade transaction. The pre-upgrade hook takes and verifies
# one online backup per persistence-enabled workload before patching the live
# Deployment to Recreate. The pre-rollback hook stops the candidate writer and
# atomically restores that exact verified generation before the source
# Deployment returns. Both hooks use the same PVC and need no provider secret.
statefulUpgrade:
  enabled: true
  verifierImage: "python@sha256:37b14db89f587f9eaa890e4a442a3fe55db452b69cca1403cc730bd0fbdc8aaf"
  backupMethod: sqlite-online-backup
  backupRoot: .clavenar-upgrade-backups
  rollbackMode: verified-backup-restore
  activeDeadlineSeconds: 600

# Operator-owned scheduled backup contract. The chart deliberately does not
# embed provider credentials or pretend a generic CronJob can take
# application-consistent snapshots of arbitrary CSI, external NATS, and
# external Vault backends. Enabling this boundary requires an external backup
# operator to consume the immutable plan, use the referenced Secret, and
# publish a sanitized clavenar.backup-set-manifest/v1 receipt.
scheduledBackup:
  enabled: false
  operator: ""
  schedule: "0 8 * * 0"
  maximumAgeSeconds: 612000
  repositorySecretName: ""
  receiptSecretName: ""
  encryptionFormat: restic-repository-v2
  offsiteClass: content-addressed-or-versioned

# Persistent caller-held workload SVID/key state. When workload TLS is
# enabled, each managed service receives its own PVC and owner-only 0700
# subdirectory at /var/lib/clavenar-workload-identity. Normal upgrades and pod
# rescheduling therefore renew with the exact current generation; bootstrap is
# never restored merely because a pod restarted.
workloadIdentity:
  enabled: true
  size: 64Mi
  storageClass: ""
  accessMode: ReadWriteOnce

# Cert bundle mount. Single k8s Secret carries the clavenar CA + per-service
# workload certs (B7 v1.x+2). Generate with
# `clavenar-proxy/scripts/gen_certs.sh --env prod` then
# `kubectl create secret generic clavenar-tls --from-file=clavenar-proxy/certs/`.
#
# Files expected in the Secret:
#   ca.crt                       — CA root, mounted on every pod
#   server.crt + server.key      — proxy's agent-facing server cert (proxy only)
#   client.crt + client.key      — agent client cert (legacy / starter agent)
#   service-<name>.crt + .key    — per-service workload identity with SAN URI
#                                  spiffe://clavenar.local/service/<name>;
#                                  one pair per backend service.
#
# Per-pod projection: each Deployment mounts only ca.crt + its own
# service-<name>.{crt,key} (proxy also gets server.{crt,key} + client.*).
# No pod can read another service's private key.
#
# Empty → no mount; proxy + identity pods will panic at boot
# (recurring-gotchas: tls.rs panics on missing cert file). Required for
# any non-trivial deploy.
#
# `proxyTls.secretName` was the v0.2.0 spelling; renamed to
# `tlsBundle.secretName` in v0.3.0 as part of the B7 v1.x+2 scaffold.
tlsBundle:
  secretName: ""
  mountPath: /certs
  # Auto-mint the bundle into `secretName` via a pre-install +
  # pre-upgrade Helm hook Job. Generates a self-signed CA root,
  # proxy server cert + client cert, and per-service workload certs
  # (one pair per name in `bundleServices`, with SPIFFE URI SANs).
  # Ordinary upgrades validate and preserve an existing stable bundle exactly.
  # A fresh generation is staged only through the explicit rotation policy.
  # Production deployments should leave this off
  # and supply the bundle from a managed PKI instead.
  autoMint: false
  rotation:
    # reconcile initializes an absent Secret or preserves/migrates a valid
    # existing one. rotate requires a new generation plus membership, expiry,
    # an exact DNS SAN contract change, or an actual certificate-profile fix.
    operation: reconcile
    generation: bootstrap-v1
    reason: none
    expiryWindowSeconds: 2592000
    overlapSeconds: 900
    rolloutTimeoutSeconds: 300
  # Nonroot, shell-capable image used only to copy the exact per-pod Secret
  # items into an owner-bound memory volume and chmod private keys 0600 before
  # the application starts. It receives no Kubernetes API credential.
  projectorImage:
    repository: alpine/openssl
    tag: "3.3.2"
    pullPolicy: IfNotPresent
  # Workload names that get a per-service cert. The 9 chart-managed services
  # plus the website, demo-mint, and simulator peer identities live here;
  # "nats" is auto-appended by `clavenar.bundleServices` when bundled, and
  # "exec" is appended when that evaluation workload is enabled.
  bundleServices:
    - proxy
    - brain
    - policy-engine
    - ledger
    - hil
    - identity
    - deep-review
    - console
    - assurance
    - website
    - demo-mint
    - simulator
  # Exact DNS names appended to the two externally published server
  # identities and to Identity's cross-namespace Simulator endpoint. Internal
  # names remain generated by the chart. Environment overlays must bind every
  # TLS-passthrough HostSNI name to this contract.
  additionalDnsNames:
    proxyServer: []
    console: []
    identity: []
    nats: []
  # SPIFFE trust domain stamped into each workload cert's SAN URI
  # (URI:spiffe://<domain>/service/<name>). The official chart fixes this to
  # `clavenar.local` so the exact Brain auxiliary callers and every generated
  # workload identity remain in one canonical trust domain.
  spiffeTrustDomain: clavenar.local
  # Auto-mint Job runs two containers sharing an emptyDir:
  #   mintImage  — openssl-only, generates CA + per-service certs
  #                into /work. alpine/openssl is ~10MB.
  #   applyImage — kubectl-only, writes /work to a k8s Secret.
  # Splitting lets both run under the chart-wide nonroot
  # podSecurityContext (UID 65532) — neither container needs root,
  # and there is no apk-at-runtime install.
  mintImage:
    repository: alpine/openssl
    tag: "3.3.2"
    pullPolicy: IfNotPresent
  applyImage:
    repository: alpine/k8s
    tag: "1.30.0"
    pullPolicy: IfNotPresent

# NetworkPolicy gating. The chart emits an ingress-isolating policy for
# every enabled workload by default. Rules are destination/port exact:
# proxy is reachable from arbitrary sources only on 8443, internal
# listeners name caller selectors, and console has no ingress until
# allowedPeers explicitly selects an ingress/operator workload.
networkPolicy:
  # Default-deny ingress is part of the chart's baseline. A CNI must
  # implement networking.k8s.io/v1 NetworkPolicy for this to take effect.
  enabled: true
  # Optional external website path to ledger's mTLS listener. This selector is
  # never applied to ledger's public HTTP port. The peer must select the
  # canonical app.kubernetes.io/name=clavenar-website pod in an explicit
  # namespace distinct from both the release and Prometheus namespaces.
  # Production requires exactly one such separately deployed website peer.
  ledger:
    trustedProxy:
      allowedPeers: []
  # Optional separately deployed demo-mint path to bundled NATS. The broker's
  # certificate-to-user map already grants only the exact demo-mint identity;
  # this independent network edge admits that pod only on the NATS client
  # port. It never widens the unauthenticated monitoring listener.
  nats:
    demoMint:
      # Every peer must select app.kubernetes.io/name=clavenar-demo-mint in an
      # explicit namespace distinct from the chart release and Prometheus
      # namespaces. Peers are rejected when bundled NATS is disabled.
      allowedPeers: []
  # Optional separately deployed Simulator peer. The modern k3s topology
  # installs Simulator in clavenar-demo, so its application and readiness
  # calls plus its bundled-Vault seed must cross the namespace boundary
  # without admitting arbitrary workloads. The Vault edge remains limited to
  # the token-authenticated API port. When empty, the legacy same-namespace
  # simulator selectors remain in force.
  simulator:
    allowedPeers: []
  # Optional same-namespace weekly reset Job. It carries only the Console
  # workload certificate because the cleanup routes are capability-bound to
  # that identity, while this selector keeps the transient pod distinct from
  # the Console Deployment.
  demoReset:
    allowedPeers: []
  # Console trust classes are isolated by listener and port. Both peer
  # lists are empty by default, preserving an exact default-deny ingress
  # policy. Add explicit NetworkPolicyPeer objects only for the workload
  # that owns the corresponding trust boundary. Every peer requires
  # non-empty podSelector.matchLabels; an optional namespaceSelector must
  # also use non-empty matchLabels. Expressions, empty selectors, and
  # ipBlock peers are rejected because they can admit arbitrary pods.
  console:
    passkey:
      # Optional private ingress or tunnel helper for the full WebAuthn
      # Console. `kubectl port-forward` remains the standard customer path and
      # does not require a pod selector here.
      allowedPeers: []
    operatorMtls:
      # TLS-passthrough private ingress, SSH-tunnel helper, or other
      # explicitly selected operator access pod. TLS must terminate in
      # clavenar-console; forwarded client-certificate headers are not
      # an identity source.
      allowedPeers: []
    demo:
      # Public/demo reverse proxy. This peer can reach only the curated
      # demo router, never the operator listener or diagnostics.
      allowedPeers: []
  # Allow Prometheus to scrape /metrics on every pod. Set to the
  # namespace label selector your scraper runs in. Empty → no
  # additional ingress allowance beyond the proxy/console/deep-review
  # mesh.
  prometheusNamespaceLabel: ""

# PodDisruptionBudget. Only emitted for services where replicas > 1
# (SQLite-pinned services skip this naturally). minAvailable defaults
# to ceil(replicas/2) so a rolling node drain takes at most half a
# service down.
podDisruptionBudget:
  enabled: true

# Vault token Secret. When .vault.addr is set, the proxy and identity pods
# receive only their own key from .vault.tokenSecretName as a mode-0440 file.
# Keep identityTokenKey and proxyTokenKey distinct; production rendering
# rejects empty or shared keys. No runtime workload receives an inline token.
