  - { id: proxy, selectorOwner: core, enabledWhen: "services.proxy.enabled", name: "{release}-proxy", type: ClusterIP, ports: [{ name: http, port: 8443, targetPort: http, protocol: TCP }, { name: health, port: 8080, targetPort: health, protocol: TCP, appProtocol: http }] }
  - { id: brain, selectorOwner: core, enabledWhen: "services.brain.enabled", name: "{release}-brain", type: ClusterIP, ports: [{ name: http, port: 8081, targetPort: http, protocol: TCP }, { name: health, port: 9081, targetPort: health, protocol: TCP, appProtocol: http }] }
  - { id: policy-engine, selectorOwner: core, enabledWhen: "services.policyEngine.enabled", name: "{release}-policy-engine", type: ClusterIP, ports: [{ name: http, port: 8082, targetPort: http, protocol: TCP }, { name: health, port: 9082, targetPort: health, protocol: TCP, appProtocol: http }] }
  - { id: ledger, selectorOwner: core, enabledWhen: "services.ledger.enabled", name: "{release}-ledger", type: ClusterIP, ports: [{ name: http, port: 8083, targetPort: http, protocol: TCP }], tlsPorts: [{ name: mtls, port: 8183, targetPort: mtls, protocol: TCP }] }
  - { id: hil, selectorOwner: core, enabledWhen: "services.hil.enabled", name: "{release}-hil", type: ClusterIP, ports: [{ name: http, port: 8084, targetPort: http, protocol: TCP }, { name: health, port: 9084, targetPort: health, protocol: TCP, appProtocol: http }] }
  - { id: identity, selectorOwner: core, enabledWhen: "services.identity.enabled", name: "{release}-identity", type: ClusterIP, publishNotReadyAddressesWhen: "tlsBundle.secretName and workloadIdentity.enabled", ports: [{ name: http, port: 8086, targetPort: http, protocol: TCP }], tlsPorts: [{ name: mtls, port: 8186, targetPort: mtls, protocol: TCP }] }
  - { id: deep-review, selectorOwner: core, enabledWhen: "services.deepReview.enabled", name: "{release}-deep-review", type: ClusterIP, ports: [{ name: http, port: 8087, targetPort: http, protocol: TCP }] }
  - { id: assurance, selectorOwner: core, enabledWhen: "services.assurance.enabled", name: "{release}-assurance", type: ClusterIP, ports: [{ name: control-mtls, port: 8088, targetPort: control-mtls, protocol: TCP, appProtocol: https }, { name: diagnostics, port: 9088, targetPort: diagnostics, protocol: TCP, appProtocol: http }] }
  - id: console
    selectorOwner: core
    enabledWhen: "services.console.enabled"
    name: "{release}-console"
    type: ClusterIP
