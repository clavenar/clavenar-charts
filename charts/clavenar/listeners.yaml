# Governed listener and Service publication inventory. Keep this file in
# lockstep with templates and run scripts/check-listener-matrix.py after edits.
schemaVersion: "1.0"
reviewedContractSha256: "1336924ece3d51f6c0a797d6673f40b830e7f266aae70a8bfb058fdbb2b25f6b"
ownership:
  core: "clavenar chart templates/services.yaml"
  optional: "clavenar chart optional templates"
  nats-subchart: "nats dependency 1.2.5; parent chart owns exposure policy"
  vault-subchart: "vault dependency 0.30.0; parent chart owns exposure policy"

# Exact selectors for non-component callers. The Vault chart applies
# server.extraLabels to both the server and its helm-test Pod, so the
# DoesNotExist expressions are required to exclude server self-access;
# Vault 0.30 currently stamps the server discriminator as `component`.
peerSelectors:
  vault-server-test:
    podSelector:
      matchLabels:
        clavenar.io/network-client: vault-server-test
      matchExpressions:
        - { key: app.kubernetes.io/component, operator: DoesNotExist }
        - { key: component, operator: DoesNotExist }

# Canonical NetworkPolicy contract. Rules resolve their destination port from
# the named listener above/below; peers are release-scoped component selectors
# unless they are a dynamic or exact peer token. The checker derives its
# complete expected NetworkPolicy set from this section.
# `allowedPeers` on each listener is the exact union of its peer tokens here.
# Optional egress rules are exact peer/port lists; `cluster-dns` resolves to the
# kube-system namespace while component tokens remain release-scoped selectors.
# Kubelet/node traffic is authorized metadata but is omitted from policy tokens
# because Kubernetes NetworkPolicy does not block traffic to/from a pod's node.
networkPolicies:
  - service: proxy
    owner: core
    enabledWhen: "services.proxy.enabled"
    rules:
      - { listenerId: agent-mcp, peers: [any] }
      - { listenerId: health, peers: [assurance, simulator] }
      - { listenerId: health, peers: [prometheus], enabledWhen: "networkPolicy.prometheusNamespaceLabel" }
  - service: brain
    owner: core
    enabledWhen: "services.brain.enabled"
    rules:
      - { listenerId: application, peers: [proxy, policy-engine, console] }
      - { listenerId: health, peers: [proxy, console] }
      - { listenerId: health, peers: [prometheus], enabledWhen: "networkPolicy.prometheusNamespaceLabel" }
  - service: policy-engine
    owner: core
    enabledWhen: "services.policyEngine.enabled"
    rules:
      - { listenerId: application, peers: [proxy, console] }
      - { listenerId: health, peers: [proxy, console] }
      - { listenerId: health, peers: [prometheus], enabledWhen: "networkPolicy.prometheusNamespaceLabel" }
  - service: ledger
    owner: core
    enabledWhen: "services.ledger.enabled"
    rules:
      - { listenerId: public-read, peers: [console, deep-review] }
      - { listenerId: public-read, peers: [proxy, simulator], disabledWhen: "tlsBundle.secretName" }
      - { listenerId: internal-mtls, peers: [proxy, console, deep-review, simulator], enabledWhen: "tlsBundle.secretName" }
      - { listenerId: internal-mtls, peers: [configured-ledger-trusted-proxy-peers], enabledWhen: "tlsBundle.secretName and networkPolicy.ledger.trustedProxy.allowedPeers" }
      - { listenerId: internal-mtls, peers: [configured-demo-reset-peers], enabledWhen: "tlsBundle.secretName and networkPolicy.demoReset.allowedPeers" }
      - { listenerId: public-read, peers: [proxy, console] }
      - { listenerId: public-read, peers: [prometheus], enabledWhen: "networkPolicy.prometheusNamespaceLabel" }
  - service: hil
    owner: core
    enabledWhen: "services.hil.enabled"
    rules:
      - { listenerId: application, peers: [proxy, console, simulator] }
      - { listenerId: application, peers: [configured-demo-reset-peers], enabledWhen: "tlsBundle.secretName and networkPolicy.demoReset.allowedPeers" }
      - { listenerId: health, peers: [proxy, console, simulator] }
      - { listenerId: health, peers: [prometheus], enabledWhen: "networkPolicy.prometheusNamespaceLabel" }
  - service: identity
    owner: core
    enabledWhen: "services.identity.enabled"
    rules:
      - { listenerId: public, peers: [proxy, console, simulator], disabledWhen: "tlsBundle.secretName" }
      - { listenerId: internal-mtls, peers: [proxy, brain, policy-engine, ledger, hil, identity, console, simulator], enabledWhen: "tlsBundle.secretName" }
      - { listenerId: public, peers: [brain, policy-engine, ledger, hil, proxy, console, simulator] }
      - { listenerId: public, peers: [prometheus], enabledWhen: "networkPolicy.prometheusNamespaceLabel" }
  - service: deep-review
    owner: core
    enabledWhen: "services.deepReview.enabled"
    rules:
      - { listenerId: operational, peers: [prometheus], enabledWhen: "networkPolicy.prometheusNamespaceLabel" }
  - service: assurance
    owner: core
    enabledWhen: "services.assurance.enabled"
    rules:
      - { listenerId: control-mtls, peers: [console] }
      - { listenerId: diagnostics, peers: [console] }
  - service: console
    owner: core
    enabledWhen: "services.console.enabled"
    rules:
      - { listenerId: operator-ui, peers: [configured-console-operator-peers], enabledWhen: "services.console.operatorMtls.enabled and networkPolicy.console.operatorMtls.allowedPeers" }
      - { listenerId: primary-demo, peers: [configured-console-demo-peers], enabledWhen: "networkPolicy.console.demo.allowedPeers", disabledWhen: "services.console.operatorMtls.enabled" }
      - { listenerId: demo, peers: [configured-console-demo-peers], enabledWhen: "services.console.demo.enabled and networkPolicy.console.demo.allowedPeers" }
      - { listenerId: diagnostics, peers: [prometheus], enabledWhen: "networkPolicy.prometheusNamespaceLabel" }
  - service: exec
    owner: optional
    enabledWhen: "exec.enabled"
    rules:
      - { listenerId: mcp, peers: [proxy] }
    egressRules:
      - { peers: [cluster-dns], ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }] }
      - { peers: [upstream-stub], ports: [{ protocol: TCP, port: 9000 }] }
  - service: upstream-stub
    owner: optional
    enabledWhen: "upstreamStub.enabled"
    rules:
      - { listenerId: mcp, peers: [proxy, simulator], disabledWhen: "exec.enabled" }
      - { listenerId: mcp, peers: [proxy, exec, simulator], enabledWhen: "exec.enabled" }
  - service: nats
    owner: nats-subchart
    enabledWhen: "nats.bundled.enabled"
    rules:
      - { listenerId: client, peers: [proxy, policy-engine, ledger, hil, identity, deep-review, assurance] }
      - { listenerId: client, peers: [configured-nats-demo-mint-peers], enabledWhen: "networkPolicy.nats.demoMint.allowedPeers" }
      - { listenerId: monitor, peers: [proxy, policy-engine, ledger, hil, identity, deep-review, assurance] }
      - { listenerId: monitor, peers: [prometheus], enabledWhen: "networkPolicy.prometheusNamespaceLabel" }
  - service: vault
    owner: vault-subchart
    enabledWhen: "vault.bundled.enabled"
    rules:
      - { listenerId: api, peers: [proxy, identity, vault-bootstrap, vault-agent-seed, vault-server-test] }
      - { listenerId: cluster, peers: [vault] }

