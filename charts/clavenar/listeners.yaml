  - { id: nats-headless, selectorOwner: nats, enabledWhen: "nats.bundled.enabled", name: "{release}-nats-headless", type: ClusterIP, headless: true, publishNotReadyAddresses: true, ports: [{ name: nats, port: 4222, targetPort: nats, protocol: TCP, appProtocol: tlsWhenTlsElseTcp }, { name: monitor, port: 8222, targetPort: monitor, protocol: TCP, appProtocol: http }] }
  - { id: vault, selectorOwner: vault, enabledWhen: "vault.bundled.enabled", name: "{release}-vault", type: ClusterIP, publishNotReadyAddresses: true, ports: [{ name: http, port: 8200, targetPort: 8200, protocol: TCP }, { name: https-internal, port: 8201, targetPort: 8201, protocol: TCP }] }
