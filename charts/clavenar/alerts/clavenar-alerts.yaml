groups:
  - name: clavenar.synthetic-delivery
    interval: 5s
    rules:
      - alert: ClavenarSyntheticProductionPage
        expr: clavenar_alert_drill_active == 1
        labels:
          severity: critical
          component: alert-delivery
        annotations:
          summary: "Synthetic production alert delivery drill"
          description: |
            Operator-confirmed synthetic page used only to prove firing,
            authenticated durable delivery, acknowledgement, and resolution.

  - name: clavenar.critical
    interval: 30s
    rules:
      - alert: LedgerChainCorrupted
        expr: clavenar_ledger_chain_valid == 0
        for: 1m
        labels:
          severity: critical
          component: ledger
        annotations:
          summary: "Ledger hash-chain failed verification"
          description: |
            clavenar_ledger_chain_valid is 0 — the most recent /verify walk
            detected a chain break. Investigate immediately:
              1. Curl GET /verify on the ledger pod for the failing seq.
              2. Inspect the last successful R2 snapshot for the gap.
              3. Quarantine the ledger volume before any chain-mutating ops.

      - alert: BrainMockModeInProd
        expr: clavenar_brain_mock_mode == 1
        for: 5m
        labels:
          severity: critical
          component: brain
        annotations:
          summary: "Brain is running in mock mode in prod"
          description: |
            clavenar_brain_mock_mode=1 means every detector returns the
            heuristic fallback verdict — no LLM dispatch happens. In prod
            this almost certainly means the API key env var was lost on
            redeploy. Fix CLAVENAR_BRAIN_MOCK_MODE=false +
            CLAVENAR_BRAIN_ANTHROPIC_API_KEY then restart brain.

      - alert: ProxyDown
        expr: up{job="proxy"} == 0
        for: 2m
        labels:
          severity: critical
          component: proxy
        annotations:
          summary: "Proxy is not responding to scrapes"
          description: |
            Prometheus has been unable to scrape clavenar-proxy for 2m.
            Agents are likely seeing connection refused — the proxy is
            the only agent-facing surface.

      - alert: ProxyMandatoryControlDegraded
        expr: |
          max(clavenar_proxy_revocation_cache_degraded) == 1
          or
          max(clavenar_proxy_decoy_cache_degraded) == 1
        for: 1m
        labels:
          severity: critical
          component: proxy
        annotations:
          summary: "Proxy mandatory control projection is unavailable"
          description: |
            Revocation, force-HIL, grant-revocation, or decoy-invocation state
            has not completed exact synchronization. Proxy readiness and
            applicable requests remain fail closed until a complete resync.

      - alert: LedgerDown
        expr: up{job="ledger"} == 0
        for: 2m
        labels:
          severity: critical
          component: ledger
        annotations:
          summary: "Ledger is not responding to scrapes"
          description: |
            Forensic writes are queueing on NATS but no consumer is
            draining them. Risk: NATS JetStream backlog hits its
            retention cap and drops events. Check ledger logs + the
            SQLite WAL state.

      - alert: ForensicStageMissing
        expr: clavenar_forensic_missing_stages > 0
        for: 5m
        labels:
          severity: critical
          component: forensic-delivery
        annotations:
          summary: "Required forensic terminal stage is missing"
          description: |
            A reconciliation-contract intent is more than five minutes old
            without its required terminal stage (family={{ $labels.family }},
            stage={{ $labels.stage }}). Inspect the owner outbox and retained
            reconciliation state. Never replay the governed effect to repair
            evidence.

      - alert: ForensicReconciliationUncertain
        expr: increase(clavenar_forensic_reconciliation_total{outcome="uncertain"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          component: forensic-delivery
        annotations:
          summary: "Governed effect outcome became uncertain"
          description: |
            At least one interrupted governed effect lacked authoritative
            evidence of success or failure. Preserve the durable uncertainty,
            investigate the bound operation, and do not automatically repeat
            the effect.

      - alert: ForensicTerminalDeliveryFailure
        expr: increase(clavenar_forensic_outbox_terminal_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          component: forensic-delivery
        annotations:
          summary: "Forensic delivery entered a terminal failure state"
          description: |
            A forensic outbox row exhausted its delivery policy. Preserve the
            row and its immutable bytes, restore broker/storage health, and
            re-drive delivery without repeating the governed effect.

      - alert: HilDown
        expr: up{job="hil"} == 0
        for: 2m
        labels:
          severity: critical
          component: hil
        annotations:
          summary: "HIL is not responding to scrapes"
          description: |
            Yellow-tier pendings cannot be created or polled. Proxy
            requests landing in the Review verdict will hang their
            long-poll until timeout and the agent will retry.

      - alert: ConsoleDiagnosticsDown
        expr: up{job="console"} == 0
        for: 2m
        labels:
          severity: critical
          component: console
        annotations:
          summary: "Console diagnostics are unavailable"
          description: |
            Prometheus cannot reach the console diagnostics listener.
            Operator mTLS refuses startup when its server certificate,
            client trust root, or exact identity registry is missing or
            invalid, so inspect the pod startup event and sanitized logs.
            Never copy private authority or operator leaf key material
            into the runtime Secret while recovering availability.

      - alert: ConsoleOperatorAuthFailureBurst
        expr: |
          sum(increase(clavenar_console_auth_attempts_total{outcome="failure"}[5m]))
          > 5
        for: 1m
        labels:
          severity: critical
          component: console
        annotations:
          summary: "Console operator authentication failures are bursting"
          description: |
            More than five operator-mTLS or supported login attempts failed in
            five minutes. Inspect the bounded reason label and, for mTLS,
            registry status/expiry; do not log or copy raw certificates or
            keys.

      - alert: ConsoleOperatorTrustNotReady
        expr: clavenar_console_operator_trust_ready != 1
        for: 1m
        labels:
          severity: critical
          component: console
        annotations:
          summary: "Console operator trust is not ready"
          description: |
            The diagnostics listener cannot prove a validated operator CA,
            exact registry, and native mTLS listener. Keep operator ingress
            closed and restore the last accepted public trust Secret.

      - alert: ConsoleOperatorServiceExposed
        expr: kube_service_spec_type{service=~".*-console",type=~"LoadBalancer|NodePort"} == 1
        for: 1m
        labels:
          severity: critical
          component: console
        annotations:
          summary: "Console operator Service is externally exposed"
          description: |
            The console Service carrying the operator-mTLS listener changed
            from ClusterIP to NodePort or LoadBalancer. Revert the Service and
            verify TLS passthrough plus the exact operator NetworkPolicy before
            restoring access.

      - alert: SvidIssuanceFailing
        expr: rate(clavenar_identity_svid_issue_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          component: identity
        annotations:
          summary: "SVID issuance is returning errors"
          description: |
            Identity service is failing to mint new SVIDs (label
            {{ $labels.reason }}). Agent rotation will stall and
            freshly-spawned agents cannot authenticate.

      - alert: ProxyErrorRateHigh
        expr: |
          sum(rate(clavenar_proxy_requests_total{outcome=~"server_error|timeout"}[5m]))
          /
          sum(rate(clavenar_proxy_requests_total[5m]))
          > 0.01
        for: 5m
        labels:
          severity: critical
          component: proxy
        annotations:
          summary: "Proxy server-side error rate > 1%"
          description: |
            More than 1% of /mcp requests have failed with 5xx or
            timeout for the last 5m. Pipeline failure or downstream
            (brain/policy/hil) outage likely.

      - alert: ProxyLatencyP95High
        expr: max(clavenar_proxy_request_duration_seconds{quantile="0.95"}) > 1
        for: 10m
        labels:
          severity: critical
          component: proxy
        annotations:
          summary: "Proxy p95 latency > 1s"
          description: |
            /mcp p95 has exceeded 1s for 10m. Agents will start
            timing out client-side.

      - alert: BrainDetectorFailing
        expr: |
          sum(rate(clavenar_brain_requests_total{outcome!="success"}[5m]))
          /
          sum(rate(clavenar_brain_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
          component: brain
        annotations:
          summary: "Brain detector failure rate > 5%"
          description: |
            More than 5% of provider calls are failing
            (transport_error/parse_error/empty). Likely an upstream
            LLM provider outage or expired credentials.

  - name: clavenar.warning
    interval: 1m
    rules:
      - alert: BrainCostRunaway
        expr: |
          (sum(rate(clavenar_brain_cost_estimated_usd_micros_total[5m])) * 3600)
          / 1e6
          > 50
        for: 15m
        labels:
          severity: warning
          component: brain
        annotations:
          summary: "Brain spend > $50/hour"
          description: |
            Estimated spend is exceeding $50/hr over the last 15m.
            Inspect the offending agent_id via the cost dashboard.

      # Soft daily inspection-spend budget. Distinct from the hourly
      # runaway above: this catches sustained spend creeping toward a
      # monthly bill, not a momentary spike. Monitor-only — it never
      # denies traffic. Edit the literal `> 200` to your daily budget
      # (this file is loaded verbatim; `tpl` is not applied, so the
      # threshold is intentionally fixed in the public PrometheusRule catalog).
      - alert: BrainInspectionBudgetSoftCap
        expr: |
          (sum(increase(clavenar_brain_cost_estimated_usd_micros_total[24h])) / 1e6)
          > 200
        for: 30m
        labels:
          severity: warning
          component: brain
        annotations:
          summary: "Brain inspection spend > $200/day (soft cap)"
          description: |
            Estimated inspection spend has crossed the soft daily budget
            over the trailing 24h. Monitor-only — no traffic is denied.
            Review the cache-economics + per-tenant panels on
            /stats/cost-latency, then either raise the budget or narrow
            scope on the heaviest agent.

      - alert: ProxyCertExpiringSoon
        expr: min(clavenar_proxy_cert_expiry_seconds) < 7 * 86400
        for: 5m
        labels:
          severity: warning
          component: proxy
        annotations:
          summary: "Proxy mTLS cert expires in < 7 days"
          description: |
            The agent-facing server cert at $CLAVENAR_CERT_DIR/server.crt
            expires soon. Run clavenar-proxy/scripts/gen_certs.sh and
            force-recreate the proxy container.

      - alert: LedgerDiskLow
        expr: |
          node_filesystem_avail_bytes{mountpoint=~".*ledger.*"}
          /
          node_filesystem_size_bytes{mountpoint=~".*ledger.*"}
          < 0.10
        for: 5m
        labels:
          severity: warning
          component: ledger
        annotations:
          summary: "Ledger volume < 10% free"
          description: |
            Ledger PVC is filling up. Cold-tier export to Parquet is
            the long-term mitigation; in the short term, free space
            by running the vacuum cursor.

      - alert: ForensicOutboxStalled
        expr: |
          clavenar_forensic_outbox_oldest_age_seconds > 300
          and on (job, instance)
          sum by (job, instance) (clavenar_forensic_outbox_depth{state=~"ready|retry"}) > 0
        for: 5m
        labels:
          severity: warning
          component: forensic-delivery
        annotations:
          summary: "Forensic outbox has not drained within five minutes"
          description: |
            The oldest undelivered forensic row has exceeded the reconciliation
            grace while ready or retry rows remain. Inspect retry counters,
            NATS JetStream health, and the Ledger consumer before backlog age
            approaches retention limits.

      - alert: HILNotificationDeliveryFailing
        expr: |
          sum by (channel) (
            increase(clavenar_hil_notification_deliveries_total{outcome="failure"}[10m])
          ) > 2
        for: 5m
        labels:
          severity: critical
          component: hil-notifications
        annotations:
          summary: "HIL notification channel has sustained delivery failures"
          description: |
            A configured HIL trigger/update/resolve channel failed more than
            twice in ten minutes. Readiness catches missing enforce-mode
            configuration; this alert catches runtime route or credential
            failure after startup. Inspect the channel label and the durable
            operator receiver before approval requests exceed their TTL.

      - alert: VerifySlow
        expr: |
          clavenar_ledger_verify_duration_seconds{quantile="0.95"}
          > 5
        for: 10m
        labels:
          severity: warning
          component: ledger
        annotations:
          summary: "/verify p95 > 5s in prod"
          description: |
            Chain verification is taking >5s at p95. Likely the chain
            has grown past the working-set ceiling; consider exporting
            the cold tier and resetting the vacuum cursor.

      - alert: SimulatorRunningTooLong
        expr: min_over_time(clavenar_simulator_running[24h]) == 1
        labels:
          severity: warning
          component: simulator
        annotations:
          summary: "Demo simulator has been running for >24h on prod"
          description: |
            The traffic simulator was un-paused on prod >24h ago and
            never paused. It is generating continuous LLM cost via
            brain. Pause it from console /sim or set
            SIM_START_RUNNING=false on the next redeploy.

      - alert: ConsoleOperatorAuthThrottled
        expr: |
          sum(increase(clavenar_console_auth_throttled_total[5m]))
          > 0
        labels:
          severity: warning
          component: console
        annotations:
          summary: "Console operator authentication was throttled"
          description: |
            At least one operator-mTLS source, identity, or supported login
            path crossed its bounded authentication-attempt limit in the last
            five minutes. Confirm expected operator activity and investigate
            repeated failures without recording certificate bodies or key
            bytes.
