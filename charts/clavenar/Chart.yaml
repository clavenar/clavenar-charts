apiVersion: v2
name: clavenar
description: |
  Clavenar — Rust security pipeline for AI agents. Deploys the
  nine-service stack (proxy, brain, policy-engine, ledger, hil,
  identity, deep-review, assurance, console) as Deployments + Services with
  /health + /readyz probes wired to the operational endpoints,
  PVCs for SQLite-backed services, default-on NetworkPolicy perimeter,
  and PodDisruptionBudgets when replicas > 1.

  NATS and Vault are not bundled by default — operators bring their
  own and set `nats.url` / `vault.addr`. Set `nats.bundled.enabled` or
  `vault.bundled.enabled` to true to have the chart install the
  upstream `nats-io/nats` and `hashicorp/vault` subcharts alongside
  the clavenar services in a single `helm install`. Images are pulled
  from ghcr.io/clavenar by default.
type: application
version: 0.13.0
# Mirrors clavenar-charts/VERSION — the latest image set published to
# ghcr.io/clavenar by scripts/push-images.sh. Independent of
# clavenar-internal-specs/VERSION (which tracks the demo VPS deploy, not GHCR).
appVersion: "0.1.12"
dependencies:
  - name: nats
    version: "1.2.5"
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.bundled.enabled
    alias: nats
  - name: vault
    version: "0.30.0"
    repository: https://helm.releases.hashicorp.com
    condition: vault.bundled.enabled
    alias: vault
keywords:
  - security
  - agent
  - mtls
  - mcp
  - audit
  - ai
  - llm
home: https://github.com/clavenar/clavenar-charts
sources:
  - https://github.com/clavenar/clavenar-proxy
  - https://github.com/clavenar/clavenar-brain
  - https://github.com/clavenar/clavenar-policy-engine
  - https://github.com/clavenar/clavenar-ledger
  - https://github.com/clavenar/clavenar-hil
  - https://github.com/clavenar/clavenar-identity
  - https://github.com/clavenar/clavenar-deep-review
  - https://github.com/clavenar/clavenar-console
maintainers:
  - name: VanteguardLabs
    url: https://github.com/clavenar
icon: https://clavenar.com/favicon.svg
