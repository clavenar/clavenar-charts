# Canonical bundled-mode evaluation values. This packaged file is
# byte-identical to the repository `tests/values-bundled.yaml`, so OCI chart
# consumers and source checkouts execute the same public quickstart.
#
# Mirrors the docker-compose stack shape: single-node NATS with JetStream,
# dev-mode Vault, mTLS wired through the auto-mint pre-install Job.

nats:
  bundled:
    enabled: true
  # Pass-through to the nats-io/nats subchart (v1.2.5). Enables
  # JetStream with a 5Gi PVC; single-replica matches the compose
  # default. HA (3-node Raft) flips `cluster.enabled` upstream.
  config:
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          size: 5Gi
    # mTLS certificate-to-user mapping on :4222. Reuses the auto-mint
    # smoke-tls Secret — the Job
    # appends "nats" to BUNDLE_SERVICES (see clavenar.bundleServices in
    # _helpers.tpl) so service-nats.{crt,key} land alongside ca.crt
    # inside the same Secret. `merge.verify_and_map: true` both requires a
    # CA-valid client certificate and maps its DNS SAN to one exact user in
    # the generated authorization contract. Identity-blind `verify` is not
    # sufficient and is rejected by the parent chart.
    nats:
      tls:
        enabled: true
        secretName: smoke-tls
        cert: service-nats.crt
        key: service-nats.key
        merge:
          verify_and_map: true
  # Mounts ca.crt from smoke-tls into every nats config tls block (the
  # generated nats.conf picks it up as `ca_file:`). Without this, the
  # NATS server has nothing to validate client certs against and mTLS
  # fails with `tls: bad certificate`.
  tlsCA:
    enabled: true
    secretName: smoke-tls
    key: ca.crt
  # nats-box is a debugging helper; not needed for the clavenar stack.
  natsBox:
    enabled: false

vault:
  bundled:
    enabled: true
  # Pass-through to the hashicorp/vault subchart (v0.28.1). Dev
  # server mode mirrors compose: in-memory, auto-unsealed, root
  # token = `root`.
  server:
    dev:
      enabled: true
      devRootToken: root
  # Agent-injector adds a cluster-wide MutatingWebhookConfiguration
  # and an extra Deployment to sidecar-inject Vault secrets into
  # arbitrary pods. We use a static-token Secret instead, so disable
  # the injector entirely.
  injector:
    enabled: false

# A fresh Kind cluster does not include the Prometheus Operator CRDs. The
# evaluation install therefore omits PrometheusRule; operators with the CRD
# enable it after selecting their rule labels.
alerting:
  enabled: false

# A clean evaluation cluster has no operator-managed Secrets. Generate the
# exact 32-byte lowercase-hex HIL payload key inside the upgrade-stable
# chart-managed shared Secret. Production validation forbids this mode.
hilPayloadProtection:
  managedEvaluation: true

# Public verification keys only; no private signing material is packaged.
# This makes Identity's fail-closed OIDC and attestation readiness explicit
# without granting any evaluation caller an operator identity.
evaluationPublicTrust:
  enabled: true

tlsBundle:
  # Pre-install Job mints CA + per-service workload certs into this
  # Secret. Ordinary reconcile upgrades validate and preserve stable bytes;
  # only an explicit advanced rotation generation replaces trust.
  secretName: smoke-tls
  autoMint: true

# Bundled echo-MCP target. Deploys clavenar-upstream-stub as a sidecar
# Deployment + Service and auto-wires CLAVENAR_UPSTREAM_URL on the
# proxy. Pairs with agentVaultSeed below — without the stub credential
# in Vault, the proxy 403s every request.
upstreamStub:
  enabled: true

# The optional evaluation execution gateway has a separate, unpublished image
# lifecycle and is therefore excluded from the public bundled quickstart.
# Operators building that image from source may opt in with an exact digest
# through a private values overlay; the advertised public install never names
# an inaccessible image.
exec:
  enabled: false

# Seed Vault with a stub api_key for the auto-mint starter cert's
# CN (`agent-001`). Required for the proxy to accept agent traffic
# in the lab evaluation flow.
agentVaultSeed:
  enabled: true

# Bare-name DNS alias from `proxy` to <release>-proxy so in-cluster
# agents can dial `https://proxy:8443/mcp` and the TLS SNI matches
# the auto-mint server cert SAN. Required for the lab Claude Code
# pod (and the simulator under chart deployments) to handshake
# without a per-release manifest tweak.
proxyAlias:
  enabled: true

# Renewed workload-SVID authority certificates use the stable DNS:identity
# name, independent of the Helm release name.
identityAlias:
  enabled: true
