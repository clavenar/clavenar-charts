{{/*
PodDisruptionBudget — only emitted when services.<name>.replicas > 1.
SQLite-pinned services and the staged single-replica PostgreSQL Ledger
topology skip naturally. Other multi-replica services receive
minAvailable = ceil(replicas / 2).

Disable the whole feature via .Values.podDisruptionBudget.enabled=false.
*/}}
{{- if .Values.podDisruptionBudget.enabled }}
{{- range $name, $cfg := .Values.services }}
{{- if and $cfg.enabled (gt (int $cfg.replicas) 1) }}
{{- $minAvailable := div (add (int $cfg.replicas) 1) 2 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "clavenar.serviceFullname" (dict "ctx" $ "service" $name) }}
  labels:
    {{- include "clavenar.labels" (dict "ctx" $ "service" $name) | nindent 4 }}
spec:
  minAvailable: {{ $minAvailable }}
  selector:
    matchLabels:
      {{- include "clavenar.selectorLabels" (dict "ctx" $ "service" $name) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
