{{- if ne .Values.exec.scratchSizeLimit "64Mi" }}
{{- fail "exec.scratchSizeLimit must remain 64Mi for structured execution v1" }}
{{- end }}
{{- if and .Values.tlsBundle.autoMint (not (has "exec" (include "clavenar.bundleServices" . | splitList " "))) }}
{{- fail "exec.enabled=true with tlsBundle.autoMint=true requires the exec workload identity" }}
{{- end }}
{{- end }}
{{- $brain := .Values.services.brain }}
{{- if ne (int $brain.port) 8081 }}
{{- fail "services.brain.port is governed and must remain 8081" }}
{{- end }}
{{- if ne (int $brain.healthPort) 9081 }}
{{- fail "services.brain.healthPort is governed and must remain 9081" }}
{{- end }}
{{- if ne .Values.tlsBundle.spiffeTrustDomain "clavenar.local" }}
{{- fail "tlsBundle.spiffeTrustDomain must remain clavenar.local for the canonical exact Brain auxiliary callers" }}
{{- end }}
{{- $bundleServices := include "clavenar.bundleServices" . | splitList " " }}
{{- $additionalDns := .Values.tlsBundle.additionalDnsNames }}
{{- range $contractName, $dnsNames := dict "proxyServer" $additionalDns.proxyServer "console" $additionalDns.console "identity" $additionalDns.identity }}
{{- range $dnsName := $dnsNames }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$" $dnsName) }}
{{- fail (printf "tlsBundle.additionalDnsNames.%s contains a noncanonical DNS name" $contractName) }}
{{- end }}
{{- end }}
{{- if ne (len $dnsNames) (len (uniq $dnsNames)) }}
{{- fail (printf "tlsBundle.additionalDnsNames.%s contains duplicate DNS names" $contractName) }}
{{- end }}
{{- end }}
{{- if and (not (empty $additionalDns.console)) (not (has "console" $bundleServices)) }}
{{- fail "tlsBundle.additionalDnsNames.console requires console in the TLS bundle" }}
{{- end }}
{{- if and (not (empty $additionalDns.identity)) (not (has "identity" $bundleServices)) }}
{{- fail "tlsBundle.additionalDnsNames.identity requires identity in the TLS bundle" }}
{{- end }}
{{- $tlsRotation := .Values.tlsBundle.rotation }}
{{- if and .Values.tlsBundle.autoMint (empty .Values.tlsBundle.secretName) }}
{{- fail "tlsBundle.autoMint=true requires a non-empty tlsBundle.secretName" }}
{{- end }}
{{- if and (eq $tlsRotation.operation "reconcile") (ne $tlsRotation.reason "none") }}
{{- fail "tlsBundle.rotation.operation=reconcile requires reason=none" }}
{{- end }}
{{- if and (eq $tlsRotation.operation "rotate") (not (has $tlsRotation.reason (list "membership" "expiry" "dns" "profile"))) }}
{{- fail "tlsBundle.rotation.operation=rotate requires reason=membership, expiry, dns, or profile" }}
{{- end }}
{{- if and (eq $tlsRotation.operation "rotate") (not .Values.tlsBundle.autoMint) }}
{{- fail "tlsBundle.rotation.operation=rotate requires tlsBundle.autoMint=true" }}
{{- end }}
{{- if le (int $tlsRotation.overlapSeconds) (int $tlsRotation.rolloutTimeoutSeconds) }}
{{- fail "tlsBundle.rotation.overlapSeconds must exceed rolloutTimeoutSeconds" }}
{{- end }}
{{- if .Values.tlsBundle.autoMint }}
{{- range $name, $cfg := .Values.services }}
{{- if and $cfg.enabled (not (has ($name | kebabcase) $bundleServices)) }}
{{- fail (printf "tlsBundle.autoMint=true requires enabled service %s in tlsBundle.bundleServices" ($name | kebabcase)) }}
{{- end }}
{{- end }}
{{- end }}
{{- if ne $brain.explainCallerSpiffe "spiffe://clavenar.local/service/policy-engine" }}
{{- fail "services.brain.explainCallerSpiffe must be the one canonical exact URI spiffe://clavenar.local/service/policy-engine" }}
{{- end }}
{{- if ne $brain.narrateCallerSpiffe "spiffe://clavenar.local/service/console" }}
{{- fail "services.brain.narrateCallerSpiffe must be the one canonical exact URI spiffe://clavenar.local/service/console" }}
{{- end }}
{{- if lt (int $brain.explainRateLimitPerMinute) 1 }}
{{- fail "services.brain.explainRateLimitPerMinute must be a positive integer" }}
{{- end }}
{{- if lt (int $brain.narrateRateLimitPerMinute) 1 }}
{{- fail "services.brain.narrateRateLimitPerMinute must be a positive integer" }}
{{- end }}
{{- if lt (int $brain.auxSpendBudgetMicroUsdPerHour) 1 }}
{{- fail "services.brain.auxSpendBudgetMicroUsdPerHour must be a positive integer" }}
{{- end }}
{{- if or (lt (int $brain.auxTimeoutMillis) 1) (gt (int $brain.auxTimeoutMillis) 30000) }}
{{- fail "services.brain.auxTimeoutMillis must be between 1 and 30000" }}
{{- end }}
{{- if or (lt (int $brain.auxBodyLimitBytes) 1) (gt (int $brain.auxBodyLimitBytes) 1048576) }}
{{- fail "services.brain.auxBodyLimitBytes must be between 1 and 1048576" }}
