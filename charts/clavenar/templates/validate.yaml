{{- else if or (not (empty .Values.evaluationPublicTrust.bootstrapApprovalSecretName)) (not (empty .Values.evaluationPublicTrust.bootstrapApprovalKey)) }}
{{- fail "evaluationPublicTrust bootstrap approval requires enabled=true" }}
