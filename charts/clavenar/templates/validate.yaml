{{/* Reject chart-controlled externally reachable Service types. */}}
{{- range $name, $cfg := .Values.services }}
{{- if and $cfg.enabled (ne (default "ClusterIP" $cfg.serviceType) "ClusterIP") }}
{{- fail (printf "services.%s.serviceType must be ClusterIP; use an operator-controlled Ingress or Gateway for external publication" $name) }}
{{- end }}
{{- end }}
{{- $deploymentProfile := default "evaluation" .Values.deploymentProfile }}
{{- if not (has $deploymentProfile (list "evaluation" "production")) }}
{{- fail "deploymentProfile must be exactly evaluation or production" }}
{{- end }}
{{- $brain := .Values.services.brain }}
{{- if ne (int $brain.port) 8081 }}
{{- fail "services.brain.port is governed and must remain 8081" }}
{{- end }}
{{- if ne (int $brain.healthPort) 9081 }}
{{- fail "services.brain.healthPort is governed and must remain 9081" }}
{{- end }}
{{- if ne .Values.tlsBundle.spiffeTrustDomain "clavenar.local" }}
{{- fail "tlsBundle.spiffeTrustDomain must remain clavenar.local for the canonical exact Brain auxiliary callers" }}
{{- end }}
{{- if ne $brain.explainCallerSpiffe "spiffe://clavenar.local/service/policy-engine" }}
{{- fail "services.brain.explainCallerSpiffe must be the one canonical exact URI spiffe://clavenar.local/service/policy-engine" }}
{{- end }}
{{- if ne $brain.narrateCallerSpiffe "spiffe://clavenar.local/service/console" }}
{{- fail "services.brain.narrateCallerSpiffe must be the one canonical exact URI spiffe://clavenar.local/service/console" }}
{{- end }}
{{- if lt (int $brain.explainRateLimitPerMinute) 1 }}
{{- fail "services.brain.explainRateLimitPerMinute must be a positive integer" }}
{{- end }}
{{- if lt (int $brain.narrateRateLimitPerMinute) 1 }}
{{- fail "services.brain.narrateRateLimitPerMinute must be a positive integer" }}
{{- end }}
{{- if lt (int $brain.auxSpendBudgetMicroUsdPerHour) 1 }}
{{- fail "services.brain.auxSpendBudgetMicroUsdPerHour must be a positive integer" }}
{{- end }}
{{- if or (lt (int $brain.auxTimeoutMillis) 1) (gt (int $brain.auxTimeoutMillis) 30000) }}
{{- fail "services.brain.auxTimeoutMillis must be between 1 and 30000" }}
{{- end }}
{{- if or (lt (int $brain.auxBodyLimitBytes) 1) (gt (int $brain.auxBodyLimitBytes) 1048576) }}
{{- fail "services.brain.auxBodyLimitBytes must be between 1 and 1048576" }}
{{- end }}
{{- $console := .Values.services.console }}
{{- $operatorMtls := $console.operatorMtls.enabled }}
{{- $operatorTrust := trim $console.operatorMtls.publicTrustSecretName }}
{{- $ledger := .Values.services.ledger }}
{{- $trustedProxySpiffe := trim $ledger.trustedProxySpiffe }}
{{- $requireTrustedProxy := $ledger.requireTrustedProxy }}
{{- $trustedProxyPeers := .Values.networkPolicy.ledger.trustedProxy.allowedPeers }}
{{- $canonicalTrustedProxy := "spiffe://clavenar.local/service/website" }}
{{- if ne (int $ledger.port) 8083 }}
{{- fail "services.ledger.port is governed and must remain 8083" }}
{{- end }}
{{- if ne (int $ledger.mtlsPort) 8183 }}
{{- fail "services.ledger.mtlsPort is governed and must remain 8183" }}
{{- end }}
{{- if and $trustedProxySpiffe (ne $trustedProxySpiffe $canonicalTrustedProxy) }}
{{- fail "services.ledger.trustedProxySpiffe must be empty or the canonical exact URI spiffe://clavenar.local/service/website" }}
{{- end }}
{{- if and $trustedProxySpiffe (not $requireTrustedProxy) }}
{{- fail "services.ledger.trustedProxySpiffe requires services.ledger.requireTrustedProxy=true" }}
{{- end }}
{{- if and $requireTrustedProxy (empty $trustedProxySpiffe) }}
{{- fail "services.ledger.requireTrustedProxy=true requires the canonical services.ledger.trustedProxySpiffe" }}
{{- end }}
{{- if and $requireTrustedProxy (empty .Values.tlsBundle.secretName) }}
{{- fail "services.ledger.requireTrustedProxy=true requires external workload TLS through tlsBundle.secretName" }}
{{- end }}
{{- if and (not (empty $trustedProxyPeers)) (not $requireTrustedProxy) }}
{{- fail "networkPolicy.ledger.trustedProxy.allowedPeers requires services.ledger.requireTrustedProxy=true" }}
{{- end }}
{{- if and $requireTrustedProxy (ne (len $trustedProxyPeers) 1) }}
{{- fail "services.ledger.requireTrustedProxy=true requires exactly one networkPolicy.ledger.trustedProxy.allowedPeers selector" }}
{{- end }}
{{- if eq $deploymentProfile "production" }}
{{- if empty .Values.authSecrets.existingSecretName }}
{{- fail "deploymentProfile=production requires authSecrets.existingSecretName from an operator-managed secret store" }}
{{- end }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "deploymentProfile=production requires networkPolicy.enabled=true" }}
{{- end }}
{{- if empty .Values.tlsBundle.secretName }}
{{- fail "deploymentProfile=production requires an externally managed tlsBundle.secretName" }}
{{- end }}
{{- if .Values.tlsBundle.autoMint }}
{{- fail "deploymentProfile=production requires tlsBundle.autoMint=false" }}
{{- end }}
{{- if not $console.enabled }}
{{- fail "deploymentProfile=production requires services.console.enabled=true" }}
{{- end }}
{{- if not $operatorMtls }}
{{- fail "deploymentProfile=production requires services.console.operatorMtls.enabled=true" }}
{{- end }}
{{- if empty $operatorTrust }}
{{- fail "deploymentProfile=production requires services.console.operatorMtls.publicTrustSecretName" }}
{{- end }}
{{- if eq $operatorTrust .Values.tlsBundle.secretName }}
{{- fail "deploymentProfile=production requires separate workload and public operator trust Secrets" }}
{{- end }}
{{- if not $ledger.enabled }}
{{- fail "deploymentProfile=production requires services.ledger.enabled=true" }}
{{- end }}
{{- if not $requireTrustedProxy }}
{{- fail "deploymentProfile=production requires services.ledger.requireTrustedProxy=true" }}
{{- end }}
{{- if ne $trustedProxySpiffe $canonicalTrustedProxy }}
{{- fail "deploymentProfile=production requires services.ledger.trustedProxySpiffe=spiffe://clavenar.local/service/website" }}
{{- end }}
{{- if ne (len $trustedProxyPeers) 1 }}
{{- fail "deploymentProfile=production requires exactly one positive website selector in networkPolicy.ledger.trustedProxy.allowedPeers" }}
{{- end }}
{{- end }}
{{- if and (not $console.enabled) (or $operatorMtls $console.demo.enabled) }}
{{- fail "services.console.operatorMtls.enabled and services.console.demo.enabled require services.console.enabled=true" }}
{{- end }}
{{- if ne (int $console.port) 8085 }}
{{- fail "services.console.port is governed and must remain 8085" }}
{{- end }}
{{- if ne (int $console.demoPort) 9085 }}
{{- fail "services.console.demoPort is governed and must remain 9085" }}
{{- end }}
{{- if ne (int $console.diagnosticsPort) 9185 }}
{{- fail "services.console.diagnosticsPort is governed and must remain 9185" }}
{{- end }}
{{- if and $console.demo.enabled (not $operatorMtls) }}
{{- fail "services.console.demo.enabled=true requires services.console.operatorMtls.enabled=true; demo-only mode already serves the curated demo router on port 8085" }}
{{- end }}
{{- if $operatorMtls }}
{{- if empty $operatorTrust }}
{{- fail "services.console.operatorMtls.enabled=true requires services.console.operatorMtls.publicTrustSecretName (Secret keys: ca.crt and operators.json)" }}
{{- end }}
{{- if empty .Values.tlsBundle.secretName }}
{{- fail "services.console.operatorMtls.enabled=true requires tlsBundle.secretName with ca.crt and service-console.{crt,key}" }}
{{- end }}
{{- if ne .Values.tlsBundle.mountPath "/certs" }}
{{- fail "services.console.operatorMtls.enabled=true requires tlsBundle.mountPath=/certs so the governed operator TLS paths cannot drift" }}
{{- end }}
{{- if eq $operatorTrust .Values.tlsBundle.secretName }}
{{- fail "services.console.operatorMtls.publicTrustSecretName must differ from tlsBundle.secretName; operator and workload trust are separate authorities" }}
{{- end }}
{{- if and .Values.tlsBundle.autoMint (not (has "console" .Values.tlsBundle.bundleServices)) }}
{{- fail "services.console.operatorMtls.enabled=true with tlsBundle.autoMint=true requires console in tlsBundle.bundleServices" }}
{{- end }}
{{- if and .Values.services.assurance.enabled (empty $console.mutationOrigins) }}
{{- fail "services.console.operatorMtls.enabled=true with services.assurance.enabled=true requires at least one exact services.console.mutationOrigins entry" }}
{{- end }}
{{- else if not (empty $operatorTrust) }}
{{- fail "services.console.operatorMtls.publicTrustSecretName is set while operatorMtls.enabled=false; set both values together" }}
{{- end }}
{{- range $index, $origin := $console.mutationOrigins }}
{{- if not (regexMatch "^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$" $origin) }}
{{- fail (printf "services.console.mutationOrigins[%d] must be an exact HTTPS origin without path, query, fragment, wildcard, or credentials" $index) }}
{{- end }}
{{- end }}
{{- if ne (len $console.mutationOrigins) (len (uniq $console.mutationOrigins)) }}
{{- fail "services.console.mutationOrigins must not contain duplicates" }}
{{- end }}
{{- $assurance := .Values.services.assurance }}
{{- if ne (int $assurance.port) 8088 }}
{{- fail "services.assurance.port is governed and must remain 8088" }}
{{- end }}
{{- if ne (int $assurance.healthPort) 9088 }}
{{- fail "services.assurance.healthPort is governed and must remain 9088" }}
{{- end }}
{{- if or (ne $assurance.probes.type "httpGet") (ne $assurance.probes.health "/health") (ne $assurance.probes.ready "/readyz") (ne (int $assurance.probes.port) 9088) }}
{{- fail "services.assurance probes are governed and must use plain diagnostics /health + /readyz on port 9088" }}
{{- end }}
{{- if $assurance.metrics.enabled }}
{{- fail "services.assurance.metrics.enabled must remain false until the diagnostics router exposes a governed /metrics route" }}
{{- end }}
{{- if and .Values.services.assurance.enabled .Values.tlsBundle.autoMint (not (has "assurance" .Values.tlsBundle.bundleServices)) }}
{{- fail "services.assurance.enabled=true with tlsBundle.autoMint=true requires assurance in tlsBundle.bundleServices" }}
{{- end }}
{{- if not (regexMatch "^[^[:space:].*>]+([.][^[:space:].*>]+)*$" $assurance.forensicSubject) }}
{{- fail "services.assurance.forensicSubject must be a non-empty exact NATS subject without whitespace, wildcards, or empty tokens" }}
{{- end }}
{{- if not (regexMatch "^[A-Za-z0-9_-]+$" $assurance.forensicStream) }}
{{- fail "services.assurance.forensicStream must be a non-empty exact JetStream stream name using only letters, digits, '_' or '-'" }}
{{- end }}
{{- $requestTimeout := int $assurance.requestTimeoutSecs }}
{{- $runTimeout := int $assurance.runTimeoutSecs }}
{{- $publishTimeout := int $assurance.publishTimeoutSecs }}
{{- if or (lt $requestTimeout 1) (gt $requestTimeout 300) }}
{{- fail "services.assurance.requestTimeoutSecs must be between 1 and 300" }}
{{- end }}
{{- if or (lt $runTimeout 1) (gt $runTimeout 3600) }}
{{- fail "services.assurance.runTimeoutSecs must be between 1 and 3600" }}
{{- end }}
{{- if or (lt $publishTimeout 1) (gt $publishTimeout 60) }}
{{- fail "services.assurance.publishTimeoutSecs must be between 1 and 60" }}
{{- end }}
{{- if lt $runTimeout $requestTimeout }}
{{- fail "services.assurance.runTimeoutSecs must be at least services.assurance.requestTimeoutSecs" }}
{{- end }}
{{- if lt $runTimeout $publishTimeout }}
{{- fail "services.assurance.runTimeoutSecs must be at least services.assurance.publishTimeoutSecs" }}
{{- end }}
{{- $operatorPeers := .Values.networkPolicy.console.operatorMtls.allowedPeers }}
{{- $demoPeers := .Values.networkPolicy.console.demo.allowedPeers }}
{{- if and (not $operatorMtls) (not (empty $operatorPeers)) }}
{{- fail "networkPolicy.console.operatorMtls.allowedPeers is non-empty while operatorMtls.enabled=false" }}
{{- end }}
{{- if and $operatorMtls (not $console.demo.enabled) (not (empty $demoPeers)) }}
{{- fail "networkPolicy.console.demo.allowedPeers is non-empty while the operator profile's separate demo listener is disabled" }}
{{- end }}
{{- if and (not $console.enabled) (or (not (empty $operatorPeers)) (not (empty $demoPeers))) }}
{{- fail "console NetworkPolicy peers require services.console.enabled=true" }}
{{- end }}
{{- $consolePeerClasses := dict
      "operatorMtls" $operatorPeers
      "demo" $demoPeers -}}
{{- range $class, $peers := $consolePeerClasses }}
{{- range $index, $peer := $peers }}
{{- if hasKey $peer "ipBlock" }}
{{- fail (printf "networkPolicy.console.%s.allowedPeers[%d] must use an exact positive podSelector, not ipBlock" $class $index) }}
{{- end }}
{{- $podLabels := dig "podSelector" "matchLabels" (dict) $peer }}
{{- $podExpressions := dig "podSelector" "matchExpressions" (list) $peer }}
{{- $namespaceLabels := dig "namespaceSelector" "matchLabels" (dict) $peer }}
{{- $namespaceExpressions := dig "namespaceSelector" "matchExpressions" (list) $peer }}
{{- if empty $podLabels }}
{{- fail (printf "networkPolicy.console.%s.allowedPeers[%d] must contain non-empty podSelector.matchLabels for one explicit workload" $class $index) }}
{{- end }}
{{- if or (not (empty $podExpressions)) (not (empty $namespaceExpressions)) }}
{{- fail (printf "networkPolicy.console.%s.allowedPeers[%d] must not use matchExpressions; use exact positive matchLabels" $class $index) }}
{{- end }}
{{- if and (hasKey $peer "namespaceSelector") (empty $namespaceLabels) }}
{{- fail (printf "networkPolicy.console.%s.allowedPeers[%d].namespaceSelector must contain non-empty matchLabels when present" $class $index) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $index, $peer := $trustedProxyPeers }}
{{- if hasKey $peer "ipBlock" }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d] must use an exact positive podSelector, not ipBlock" $index) }}
{{- end }}
{{- $podLabels := dig "podSelector" "matchLabels" (dict) $peer }}
{{- $podExpressions := dig "podSelector" "matchExpressions" (list) $peer }}
{{- $namespaceLabels := dig "namespaceSelector" "matchLabels" (dict) $peer }}
{{- $namespaceExpressions := dig "namespaceSelector" "matchExpressions" (list) $peer }}
{{- if empty $podLabels }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d] must contain non-empty podSelector.matchLabels for the website workload" $index) }}
{{- end }}
{{- if or (not (empty $podExpressions)) (not (empty $namespaceExpressions)) }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d] must not use matchExpressions; use exact positive matchLabels" $index) }}
{{- end }}
{{- if and (hasKey $peer "namespaceSelector") (empty $namespaceLabels) }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d].namespaceSelector must contain non-empty matchLabels when present" $index) }}
{{- end }}
{{- if not (hasKey $peer "namespaceSelector") }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d] must explicitly select the external website namespace" $index) }}
{{- end }}
{{- $websiteNamespace := get $namespaceLabels "kubernetes.io/metadata.name" }}
{{- if empty $websiteNamespace }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d].namespaceSelector.matchLabels must include kubernetes.io/metadata.name" $index) }}
{{- end }}
{{- if eq $websiteNamespace $.Release.Namespace }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d] website namespace must differ from the Helm release namespace %s" $index $.Release.Namespace) }}
{{- end }}
{{- if eq $websiteNamespace $.Values.networkPolicy.prometheusNamespaceLabel }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d] website namespace must differ from networkPolicy.prometheusNamespaceLabel" $index) }}
{{- end }}
{{- if ne (get $podLabels "app.kubernetes.io/name") "clavenar-website" }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d].podSelector.matchLabels must include app.kubernetes.io/name=clavenar-website" $index) }}
{{- end }}
{{- end }}
{{- if .Values.vault.bundled.enabled }}
{{- $vaultType := dig "server" "service" "type" "ClusterIP" .Values.vault }}
{{- if ne (default "ClusterIP" $vaultType) "ClusterIP" }}
{{- fail "vault.server.service.type must be ClusterIP in bundled mode" }}
{{- end }}
{{- if and .Values.vault.ui.enabled (ne (default "ClusterIP" .Values.vault.ui.serviceType) "ClusterIP") }}
{{- fail "vault.ui.serviceType must be ClusterIP in bundled mode" }}
{{- end }}
{{- end }}
{{- if .Values.nats.bundled.enabled }}
{{- $natsType := dig "service" "merge" "spec" "type" "ClusterIP" .Values.nats }}
{{- if ne (default "ClusterIP" $natsType) "ClusterIP" }}
{{- fail "nats.service.merge.spec.type must be ClusterIP in bundled mode" }}
{{- end }}
{{- range $patch := .Values.nats.service.patch }}
{{- if and (eq (default "" $patch.path) "/spec/type") (ne (default "ClusterIP" $patch.value) "ClusterIP") }}
{{- fail "nats.service.patch must not set /spec/type to an externally reachable Service type" }}
{{- end }}
{{- end }}
{{- end }}
