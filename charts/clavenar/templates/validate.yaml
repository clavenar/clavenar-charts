{{- if le (int .Values.services.proxy.grantJwksMaxStalenessSeconds) (int .Values.services.proxy.grantJwksRefreshSeconds) }}
{{- fail "services.proxy.grantJwksMaxStalenessSeconds must exceed services.proxy.grantJwksRefreshSeconds" }}
