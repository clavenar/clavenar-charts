{{- end }}
{{- if and .Values.upstreamStub.enabled (or (empty .Values.upstreamStub.image.digest) (regexMatch "^sha256:0{64}$" .Values.upstreamStub.image.digest)) }}
{{- fail "deploymentProfile=production requires a non-zero upstreamStub.image.digest when the curated upstream is enabled" }}
