{{- if not (empty .Values.authSecrets.existingSecretName) }}
{{- fail "hilPayloadProtection.managedEvaluation=true requires chart-managed authSecrets so the upgrade-stable key can be created" }}
{{- end }}
{{- if ne .Values.hilPayloadProtection.key "hil-payload-key" }}
{{- fail "hilPayloadProtection.managedEvaluation=true requires key=hil-payload-key" }}
{{- end }}
{{- end }}
{{- if .Values.evaluationPublicTrust.enabled }}
{{- if ne $deploymentProfile "evaluation" }}
{{- fail "evaluationPublicTrust.enabled=true is evaluation-only; production requires operator-owned public trust" }}
{{- end }}
{{- if not (empty .Values.attestationTrustAnchors.secretName) }}
{{- fail "evaluationPublicTrust.enabled=true cannot be combined with attestationTrustAnchors.secretName" }}
{{- end }}
{{- if ne (empty .Values.evaluationPublicTrust.bootstrapApprovalSecretName) (empty .Values.evaluationPublicTrust.bootstrapApprovalKey) }}
{{- fail "evaluationPublicTrust bootstrap approval requires both bootstrapApprovalSecretName and bootstrapApprovalKey" }}
