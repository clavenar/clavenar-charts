{{- fail "services.identity.replayReplicas must be between 1 and 5" }}
{{- end }}
{{- range $name, $cfg := .Values.services }}
{{- if and $cfg.enabled (ne (default "ClusterIP" $cfg.serviceType) "ClusterIP") }}
{{- fail (printf "services.%s.serviceType must be ClusterIP; use an operator-controlled Ingress or Gateway for external publication" $name) }}
{{- end }}
{{- end }}
{{- $deploymentProfile := default "evaluation" .Values.deploymentProfile }}
{{- if not (has $deploymentProfile (list "evaluation" "production")) }}
{{- fail "deploymentProfile must be exactly evaluation or production" }}
{{- end }}
{{- if .Values.hilPayloadProtection.managedEvaluation }}
{{- if ne $deploymentProfile "evaluation" }}
{{- fail "hilPayloadProtection.managedEvaluation=true is evaluation-only; production requires an operator-owned dedicated Secret" }}
