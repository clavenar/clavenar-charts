{{- $operatorPeers := .Values.networkPolicy.console.operatorMtls.allowedPeers }}
{{- $demoPeers := .Values.networkPolicy.console.demo.allowedPeers }}
{{- if and (not $operatorMtls) (not (empty $operatorPeers)) }}
{{- fail "networkPolicy.console.operatorMtls.allowedPeers is non-empty while operatorMtls.enabled=false" }}
{{- end }}
{{- if and $operatorMtls (not $console.demo.enabled) (not (empty $demoPeers)) }}
{{- fail "networkPolicy.console.demo.allowedPeers is non-empty while the operator profile's separate demo listener is disabled" }}
{{- end }}
{{- if and (not $console.enabled) (or (not (empty $operatorPeers)) (not (empty $demoPeers))) }}
{{- fail "console NetworkPolicy peers require services.console.enabled=true" }}
{{- end }}
{{- $consolePeerClasses := dict
      "operatorMtls" $operatorPeers
      "demo" $demoPeers -}}
{{- range $class, $peers := $consolePeerClasses }}
{{- range $index, $peer := $peers }}
{{- if hasKey $peer "ipBlock" }}
{{- fail (printf "networkPolicy.console.%s.allowedPeers[%d] must use an exact positive podSelector, not ipBlock" $class $index) }}
{{- end }}
{{- $podLabels := dig "podSelector" "matchLabels" (dict) $peer }}
{{- $podExpressions := dig "podSelector" "matchExpressions" (list) $peer }}
{{- $namespaceLabels := dig "namespaceSelector" "matchLabels" (dict) $peer }}
{{- $namespaceExpressions := dig "namespaceSelector" "matchExpressions" (list) $peer }}
{{- if empty $podLabels }}
{{- fail (printf "networkPolicy.console.%s.allowedPeers[%d] must contain non-empty podSelector.matchLabels for one explicit workload" $class $index) }}
{{- end }}
{{- if or (not (empty $podExpressions)) (not (empty $namespaceExpressions)) }}
{{- fail (printf "networkPolicy.console.%s.allowedPeers[%d] must not use matchExpressions; use exact positive matchLabels" $class $index) }}
{{- end }}
{{- if and (hasKey $peer "namespaceSelector") (empty $namespaceLabels) }}
{{- fail (printf "networkPolicy.console.%s.allowedPeers[%d].namespaceSelector must contain non-empty matchLabels when present" $class $index) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $index, $peer := $trustedProxyPeers }}
{{- if hasKey $peer "ipBlock" }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d] must use an exact positive podSelector, not ipBlock" $index) }}
{{- end }}
{{- $podLabels := dig "podSelector" "matchLabels" (dict) $peer }}
{{- $podExpressions := dig "podSelector" "matchExpressions" (list) $peer }}
{{- $namespaceLabels := dig "namespaceSelector" "matchLabels" (dict) $peer }}
{{- $namespaceExpressions := dig "namespaceSelector" "matchExpressions" (list) $peer }}
{{- if empty $podLabels }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d] must contain non-empty podSelector.matchLabels for the website workload" $index) }}
{{- end }}
{{- if or (not (empty $podExpressions)) (not (empty $namespaceExpressions)) }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d] must not use matchExpressions; use exact positive matchLabels" $index) }}
{{- end }}
{{- if and (hasKey $peer "namespaceSelector") (empty $namespaceLabels) }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d].namespaceSelector must contain non-empty matchLabels when present" $index) }}
{{- end }}
{{- if not (hasKey $peer "namespaceSelector") }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d] must explicitly select the external website namespace" $index) }}
{{- end }}
{{- $websiteNamespace := get $namespaceLabels "kubernetes.io/metadata.name" }}
{{- if empty $websiteNamespace }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d].namespaceSelector.matchLabels must include kubernetes.io/metadata.name" $index) }}
{{- end }}
{{- if eq $websiteNamespace $.Release.Namespace }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d] website namespace must differ from the Helm release namespace %s" $index $.Release.Namespace) }}
{{- end }}
{{- if eq $websiteNamespace $.Values.networkPolicy.prometheusNamespaceLabel }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d] website namespace must differ from networkPolicy.prometheusNamespaceLabel" $index) }}
{{- end }}
{{- if ne (get $podLabels "app.kubernetes.io/name") "clavenar-website" }}
{{- fail (printf "networkPolicy.ledger.trustedProxy.allowedPeers[%d].podSelector.matchLabels must include app.kubernetes.io/name=clavenar-website" $index) }}
{{- end }}
{{- end }}
{{- if and (not (empty $natsDemoMintPeers)) (not .Values.networkPolicy.enabled) }}
{{- fail "networkPolicy.nats.demoMint.allowedPeers requires networkPolicy.enabled=true" }}
{{- end }}
{{- if and (not (empty $natsDemoMintPeers)) (not .Values.nats.bundled.enabled) }}
{{- fail "networkPolicy.nats.demoMint.allowedPeers is valid only when nats.bundled.enabled=true" }}
{{- end }}
{{- if gt (len $natsDemoMintPeers) 1 }}
{{- fail "networkPolicy.nats.demoMint.allowedPeers accepts at most one exact demo-mint selector" }}
{{- end }}
{{- range $index, $peer := $natsDemoMintPeers }}
{{- if hasKey $peer "ipBlock" }}
{{- fail (printf "networkPolicy.nats.demoMint.allowedPeers[%d] must use exact positive pod and namespace selectors, not ipBlock" $index) }}
{{- end }}
{{- $podLabels := dig "podSelector" "matchLabels" (dict) $peer }}
{{- $podExpressions := dig "podSelector" "matchExpressions" (list) $peer }}
{{- $namespaceLabels := dig "namespaceSelector" "matchLabels" (dict) $peer }}
{{- $namespaceExpressions := dig "namespaceSelector" "matchExpressions" (list) $peer }}
{{- if or (empty $podLabels) (empty $namespaceLabels) }}
{{- fail (printf "networkPolicy.nats.demoMint.allowedPeers[%d] requires non-empty podSelector.matchLabels and namespaceSelector.matchLabels" $index) }}
{{- end }}
{{- if or (not (empty $podExpressions)) (not (empty $namespaceExpressions)) }}
{{- fail (printf "networkPolicy.nats.demoMint.allowedPeers[%d] must not use matchExpressions; use exact positive matchLabels" $index) }}
{{- end }}
{{- if ne (get $podLabels "app.kubernetes.io/name") "clavenar-demo-mint" }}
{{- fail (printf "networkPolicy.nats.demoMint.allowedPeers[%d].podSelector.matchLabels must include app.kubernetes.io/name=clavenar-demo-mint" $index) }}
{{- end }}
{{- $demoMintNamespace := get $namespaceLabels "kubernetes.io/metadata.name" }}
{{- if empty $demoMintNamespace }}
{{- fail (printf "networkPolicy.nats.demoMint.allowedPeers[%d].namespaceSelector.matchLabels must include kubernetes.io/metadata.name" $index) }}
{{- end }}
{{- if eq $demoMintNamespace $.Release.Namespace }}
{{- fail (printf "networkPolicy.nats.demoMint.allowedPeers[%d] demo-mint namespace must differ from the Helm release namespace %s" $index $.Release.Namespace) }}
{{- end }}
{{- if eq $demoMintNamespace $.Values.networkPolicy.prometheusNamespaceLabel }}
{{- fail (printf "networkPolicy.nats.demoMint.allowedPeers[%d] demo-mint namespace must differ from networkPolicy.prometheusNamespaceLabel" $index) }}
{{- end }}
{{- end }}
{{- if .Values.vault.bundled.enabled }}
{{- $vaultType := dig "server" "service" "type" "ClusterIP" .Values.vault }}
{{- if ne (default "ClusterIP" $vaultType) "ClusterIP" }}
{{- fail "vault.server.service.type must be ClusterIP in bundled mode" }}
{{- end }}
{{- if and .Values.vault.ui.enabled (ne (default "ClusterIP" .Values.vault.ui.serviceType) "ClusterIP") }}
{{- fail "vault.ui.serviceType must be ClusterIP in bundled mode" }}
{{- end }}
{{- end }}
{{- if .Values.nats.bundled.enabled }}
{{- $natsType := dig "service" "merge" "spec" "type" "ClusterIP" .Values.nats }}
{{- if ne (default "ClusterIP" $natsType) "ClusterIP" }}
{{- fail "nats.service.merge.spec.type must be ClusterIP in bundled mode" }}
{{- end }}
{{- range $patch := .Values.nats.service.patch }}
{{- if and (eq (default "" $patch.path) "/spec/type") (ne (default "ClusterIP" $patch.value) "ClusterIP") }}
{{- fail "nats.service.patch must not set /spec/type to an externally reachable Service type" }}
{{- end }}
{{- end }}
{{- if empty .Values.tlsBundle.secretName }}
{{- fail "nats.bundled.enabled=true requires tlsBundle.secretName for exact certificate-mapped authorization" }}
{{- end }}
{{- if not .Values.nats.config.nats.tls.enabled }}
{{- fail "nats.bundled.enabled=true requires nats.config.nats.tls.enabled=true" }}
{{- end }}
{{- if ne .Values.nats.config.nats.tls.secretName .Values.tlsBundle.secretName }}
{{- fail "bundled NATS TLS must use the exact tlsBundle.secretName" }}
{{- end }}
{{- if or (ne .Values.nats.config.nats.tls.cert "service-nats.crt") (ne .Values.nats.config.nats.tls.key "service-nats.key") }}
{{- fail "bundled NATS TLS must project service-nats.crt and service-nats.key" }}
{{- end }}
{{- if not (dig "verify_and_map" false .Values.nats.config.nats.tls.merge) }}
{{- fail "bundled NATS TLS must enable verify_and_map for exact certificate-to-user mapping" }}
{{- end }}
{{- if dig "verify" false .Values.nats.config.nats.tls.merge }}
{{- fail "bundled NATS TLS must not use identity-blind verify" }}
{{- end }}
{{- if or (not .Values.nats.tlsCA.enabled) (ne .Values.nats.tlsCA.secretName .Values.tlsBundle.secretName) (ne .Values.nats.tlsCA.key "ca.crt") }}
{{- fail "bundled NATS must validate clients against ca.crt from the exact tlsBundle.secretName" }}
{{- end }}
{{- if or (not .Values.nats.config.jetstream.enabled) (not .Values.nats.config.jetstream.fileStore.enabled) (not .Values.nats.config.jetstream.fileStore.pvc.enabled) }}
{{- fail "bundled NATS requires JetStream on an enabled persistent file-store PVC" }}
{{- end }}
{{- $authorizationDigest := sha256sum (toRawJson .Values.nats.config.merge.authorization) }}
{{- if ne $authorizationDigest "56f26edade357e37d6e69be1763f7d959b289baf4f2cac3aa737cbda7d7221a6" }}
{{- fail "bundled NATS authorization must equal clavenar.nats-authorization/v1; operator overrides are forbidden" }}
{{- end }}
{{- else if eq $deploymentProfile "production" }}
{{- if empty .Values.nats.external.operator }}
{{- fail "external NATS in production requires nats.external.operator naming the owner" }}
{{- end }}
{{- if ne .Values.nats.external.authorizationContract "clavenar.nats-authorization/v1" }}
{{- fail "external NATS in production requires an operator declaration for clavenar.nats-authorization/v1" }}
{{- end }}
{{- if not .Values.nats.external.jetstreamPersistence }}
{{- fail "external NATS in production requires an operator declaration of durable JetStream persistence" }}
{{- end }}
{{- end }}
