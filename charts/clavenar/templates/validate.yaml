{{- if and (not (empty $demoResetPeers)) (not .Values.networkPolicy.enabled) }}
{{- fail "networkPolicy.demoReset.allowedPeers requires networkPolicy.enabled=true" }}
{{- end }}
{{- if eq $deploymentProfile "production" }}
{{- range $name, $cfg := .Values.services }}
