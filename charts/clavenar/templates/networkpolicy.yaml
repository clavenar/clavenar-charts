{{/* Default-deny, destination/port-specific ingress policy. */}}
{{- if .Values.networkPolicy.enabled }}
{{- $ctx := . }}
{{- $matrix := fromYaml (.Files.Get "listeners.yaml") }}
{{- $_ := unset $matrix "reviewedContractSha256" }}
{{- $matrixDigest := sha256sum (toJson $matrix) }}
{{- $ledgerTrustedProxyPeers := .Values.networkPolicy.ledger.trustedProxy.allowedPeers }}
{{- $natsDemoMintPeers := .Values.networkPolicy.nats.demoMint.allowedPeers }}
{{- $simulatorPeers := .Values.networkPolicy.simulator.allowedPeers }}
{{- $demoResetPeers := .Values.networkPolicy.demoReset.allowedPeers }}
{{- $callers := dict
      "policyEngine" (list "proxy" "console")
      "ledger" (list "console" "deepReview")
      "hil" (list "proxy" "console" "simulator")
      "assurance" (list "console") -}}
{{- $readinessCallers := dict
      "identity" (list "brain" "policyEngine" "ledger" "hil" "proxy" "console" "simulator")
      "brain" (list "proxy" "console")
      "policyEngine" (list "proxy" "console")
      "ledger" (list "proxy" "console")
      "hil" (list "proxy" "console" "simulator")
      "proxy" (list "assurance" "simulator")
      "assurance" (list "console") -}}
{{- range $name, $cfg := .Values.services }}
{{- if $cfg.enabled }}
{{- $rules := list -}}
{{- if eq $name "proxy" -}}
  {{- $rules = append $rules (dict "port" (int $cfg.port) "any" true) -}}
{{- else if eq $name "brain" -}}
  {{- /* One application port, three route-scoped identities: proxy may
        inspect, policy-engine may explain, and console may narrate/read the
        model snapshot. The plain health port never admits application pods. */ -}}
  {{- $rules = append $rules (dict "port" (int $cfg.port) "callers" (list "proxy" "policyEngine" "console")) -}}
{{- else if eq $name "identity" -}}
  {{- if $ctx.Values.tlsBundle.secretName -}}
    {{- $rules = append $rules (dict "port" (int $cfg.mtlsPort) "callers" (list "proxy" "brain" "policyEngine" "ledger" "hil" "identity" "console" "simulator")) -}}
  {{- else -}}
    {{- $rules = append $rules (dict "port" (int $cfg.port) "callers" (list "proxy" "console" "simulator")) -}}
  {{- end -}}
{{- else if hasKey $callers $name -}}
  {{- $rules = append $rules (dict "port" (int $cfg.port) "callers" (index $callers $name)) -}}
  {{- if and (eq $name "ledger") (not $ctx.Values.tlsBundle.secretName) -}}
    {{- $rules = append $rules (dict "port" (int $cfg.port) "callers" (list "proxy" "simulator")) -}}
  {{- end -}}
  {{- if and (eq $name "ledger") $ctx.Values.tlsBundle.secretName -}}
    {{- $rules = append $rules (dict "port" (int $cfg.mtlsPort) "callers" (list "proxy" "console" "deepReview" "simulator")) -}}
    {{- if not (empty $ledgerTrustedProxyPeers) -}}
      {{- /* The separately deployed website can reach only ledger's mTLS
            port. Its verified SPIFFE identity remains an independent
            application-layer requirement. */ -}}
      {{- $rules = append $rules (dict "port" (int $cfg.mtlsPort) "configuredPeers" $ledgerTrustedProxyPeers) -}}
    {{- end -}}
    {{- if not (empty $demoResetPeers) -}}
      {{- $rules = append $rules (dict "port" (int $cfg.mtlsPort) "configuredPeers" $demoResetPeers) -}}
    {{- end -}}
  {{- end -}}
  {{- if and (eq $name "hil") (not (empty $demoResetPeers)) -}}
    {{- $rules = append $rules (dict "port" (int $cfg.port) "configuredPeers" $demoResetPeers) -}}
  {{- end -}}
{{- end -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "clavenar.serviceFullname" (dict "ctx" $ctx "service" $name) }}
  annotations:
    clavenar.io/listener-matrix-sha256: {{ $matrixDigest | quote }}
  labels:
    {{- include "clavenar.labels" (dict "ctx" $ctx "service" $name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "clavenar.selectorLabels" (dict "ctx" $ctx "service" $name) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if and (eq $name "console") $cfg.operatorMtls.enabled (not (empty $ctx.Values.networkPolicy.console.operatorMtls.allowedPeers)) }}
    - from:
        {{- toYaml $ctx.Values.networkPolicy.console.operatorMtls.allowedPeers | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ $cfg.port }} }
    {{- end }}
    {{- if and (eq $name "console") (not $cfg.operatorMtls.enabled) (not (empty $ctx.Values.networkPolicy.console.demo.allowedPeers)) }}
    - from:
        {{- toYaml $ctx.Values.networkPolicy.console.demo.allowedPeers | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ $cfg.port }} }
    {{- end }}
    {{- if and (eq $name "console") $cfg.demo.enabled (not (empty $ctx.Values.networkPolicy.console.demo.allowedPeers)) }}
    - from:
        {{- toYaml $ctx.Values.networkPolicy.console.demo.allowedPeers | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ $cfg.demoPort }} }
    {{- end }}
    {{- range $rule := $rules }}
    - {{- if not $rule.any }}
      from:
        {{- if hasKey $rule "configuredPeers" }}
        {{- toYaml $rule.configuredPeers | nindent 8 }}
        {{- else }}
        {{- range $caller := $rule.callers }}
        {{- if and (eq ($caller | kebabcase) "simulator") (not (empty $simulatorPeers)) }}
        {{- toYaml $simulatorPeers | nindent 8 }}
        {{- else }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $ctx.Chart.Name }}
              app.kubernetes.io/instance: {{ $ctx.Release.Name }}
              app.kubernetes.io/component: {{ $caller | kebabcase }}
        {{- end }}
        {{- end }}
        {{- end }}
      {{- end }}
      ports:
        - { protocol: TCP, port: {{ $rule.port }} }
    {{- end }}
    {{- if hasKey $readinessCallers $name }}
    {{- $readinessPort := int $cfg.port }}
    {{- if $cfg.healthPort }}
      {{- $readinessPort = int $cfg.healthPort }}
    {{- end }}
    {{- if eq $name "proxy" }}
      {{- $readinessPort = int $cfg.healthPort }}
    {{- end }}
    {{- if eq $name "assurance" }}
      {{- $readinessPort = int $cfg.healthPort }}
    {{- end }}
    - from:
        {{- range $caller := index $readinessCallers $name }}
        {{- if and (eq ($caller | kebabcase) "simulator") (not (empty $simulatorPeers)) }}
        {{- toYaml $simulatorPeers | nindent 8 }}
        {{- else }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $ctx.Chart.Name }}
              app.kubernetes.io/instance: {{ $ctx.Release.Name }}
              app.kubernetes.io/component: {{ $caller | kebabcase }}
        {{- end }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ $readinessPort }} }
    {{- end }}
    {{- $metrics := default dict $cfg.metrics }}
    {{- if and $metrics.enabled $ctx.Values.networkPolicy.prometheusNamespaceLabel }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ctx.Values.networkPolicy.prometheusNamespaceLabel | quote }}
      ports:
        - { protocol: TCP, port: {{ include "clavenar.metricsPort" (dict "ctx" $ctx "svcCfg" $cfg) }} }
    {{- end }}
    {{- $hasOperatorRule := and (eq $name "console") $cfg.operatorMtls.enabled (not (empty $ctx.Values.networkPolicy.console.operatorMtls.allowedPeers)) -}}
    {{- $hasPrimaryDemoRule := and (eq $name "console") (not $cfg.operatorMtls.enabled) (not (empty $ctx.Values.networkPolicy.console.demo.allowedPeers)) -}}
    {{- $hasSecondaryDemoRule := and (eq $name "console") $cfg.demo.enabled (not (empty $ctx.Values.networkPolicy.console.demo.allowedPeers)) -}}
    {{- if and (empty $rules) (not $hasOperatorRule) (not $hasPrimaryDemoRule) (not $hasSecondaryDemoRule) (not (and $metrics.enabled $ctx.Values.networkPolicy.prometheusNamespaceLabel)) }} []{{- end }}
{{ end }}
{{- end }}

{{- if .Values.exec.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-exec
  annotations:
    clavenar.io/listener-matrix-sha256: {{ $matrixDigest | quote }}
  labels:
    {{- include "clavenar.labels" (dict "ctx" . "service" "exec") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "clavenar.selectorLabels" (dict "ctx" . "service" "exec") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "clavenar.selectorLabels" (dict "ctx" . "service" "proxy") | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.exec.port }} }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              {{- include "clavenar.selectorLabels" (dict "ctx" . "service" "upstream-stub") | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.upstreamStub.port }} }
{{ end }}

{{- if .Values.upstreamStub.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-upstream-stub
  annotations:
    clavenar.io/listener-matrix-sha256: {{ $matrixDigest | quote }}
  labels:
    {{- include "clavenar.labels" (dict "ctx" . "service" "upstream-stub") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "clavenar.selectorLabels" (dict "ctx" . "service" "upstream-stub") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "clavenar.selectorLabels" (dict "ctx" . "service" "proxy") | nindent 14 }}
      {{- if .Values.exec.enabled }}
        - podSelector:
            matchLabels:
              {{- include "clavenar.selectorLabels" (dict "ctx" . "service" "exec") | nindent 14 }}
      {{- end }}
        {{- if not (empty $simulatorPeers) }}
        {{- toYaml $simulatorPeers | nindent 8 }}
        {{- else }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Chart.Name }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: simulator
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.upstreamStub.port }} }
{{ end }}

{{- if .Values.nats.bundled.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-nats
  annotations:
    clavenar.io/listener-matrix-sha256: {{ $matrixDigest | quote }}
  labels:
    {{- include "clavenar.labels" (dict "ctx" . "service" "nats") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: nats
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $caller := list "proxy" "policy-engine" "ledger" "hil" "identity" "deep-review" "assurance" }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $.Chart.Name }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ $caller }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 4222 }
    {{- if not (empty $natsDemoMintPeers) }}
    - from:
        {{- toYaml $natsDemoMintPeers | nindent 8 }}
      ports:
        - { protocol: TCP, port: 4222 }
    {{- end }}
    - from:
        {{- range $caller := list "proxy" "policy-engine" "ledger" "hil" "identity" "deep-review" "assurance" }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $.Chart.Name }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ $caller }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 8222 }
    {{- if .Values.networkPolicy.prometheusNamespaceLabel }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespaceLabel | quote }}
      ports:
        - { protocol: TCP, port: 8222 }
    {{- end }}
{{ end }}

{{- if .Values.vault.bundled.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-vault
  annotations:
    clavenar.io/listener-matrix-sha256: {{ $matrixDigest | quote }}
  labels:
    {{- include "clavenar.labels" (dict "ctx" . "service" "vault") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
      app.kubernetes.io/instance: {{ .Release.Name }}
      component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $caller := list "proxy" "identity" "vault-bootstrap" "vault-agent-seed" }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $.Chart.Name }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ $caller }}
        {{- end }}
        - podSelector:
            matchLabels:
              clavenar.io/network-client: vault-server-test
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: DoesNotExist
              - key: component
                operator: DoesNotExist
      ports:
        - { protocol: TCP, port: 8200 }
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
              app.kubernetes.io/instance: {{ .Release.Name }}
              component: server
      ports:
        - { protocol: TCP, port: 8201 }
{{ end }}
{{- end }}
