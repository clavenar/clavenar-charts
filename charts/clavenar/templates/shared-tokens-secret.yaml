{{/*
Shared secrets that two or more clavenar services must agree on.
The Compose deployment uses environment-specific file projections for the
same HIL session and decision roles. The demo-session signing key is
deliberately operator-supplied because this chart does not bundle a demo-token
mint; see the chart README before enabling signed demo sessions.

Values are auto-minted on first install. On upgrade, `lookup` reads the
existing Secret and re-emits the same data while `authSecrets.rotationId`
is unchanged. Changing that public identifier explicitly mints a new
generation. This prevents ordinary upgrades from invalidating in-flight
sessions while still giving operators a coordinated rotation boundary.

Set `authSecrets.existingSecretName` to use a Secret managed outside this
release. In that mode this template emits nothing; Deployments refer directly
to the operator-managed Secret and the chart never copies its values.
*/}}
{{- if empty .Values.authSecrets.existingSecretName }}
{{- $secretName := printf "%s-shared-tokens" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $rotationId := required "authSecrets.rotationId is required" .Values.authSecrets.rotationId }}
{{- $existingRotationId := "" }}
{{- if $existing }}
{{- $existingRotationId = dig "metadata" "annotations" "clavenar.io/auth-rotation-id" "" $existing }}
{{- end }}
{{- $hilDecideToken := "" }}
{{- $hilSessionKey := "" }}
{{- $hilBootstrapToken := "" }}
{{- $brainCacheHmacKey := "" }}
{{- if and $existing (eq $existingRotationId $rotationId) }}
{{- $hilDecideToken = index $existing.data "hil-decide-token" | default "" }}
{{- $hilSessionKey = index $existing.data "hil-session-key" | default "" }}
{{- $hilBootstrapToken = index $existing.data "hil-bootstrap-token" | default "" }}
{{- $brainCacheHmacKey = index $existing.data "brain-cache-hmac-key" | default "" }}
{{- end }}
{{- if not $hilDecideToken }}
{{- $hilDecideToken = randAlphaNum 48 | b64enc }}
{{- end }}
{{- if not $hilSessionKey }}
{{/* HIL parses CLAVENAR_HIL_SESSION_KEY as 64-char hex (32 bytes).
     sha256sum of a random 32-char alphanum is exactly that. */}}
{{- $hilSessionKey = randAlphaNum 32 | sha256sum | b64enc }}
{{- end }}
{{- if not $hilBootstrapToken }}
{{- $hilBootstrapToken = randAlphaNum 48 | b64enc }}
{{- end }}
{{- if not $brainCacheHmacKey }}
{{/* Brain requires 64 lowercase hex characters (32 bytes) from a file-backed
     Secret projection. The public rotation ID deliberately rolls this value
     with the other chart-managed authentication material. */}}
{{- $brainCacheHmacKey = randAlphaNum 32 | sha256sum | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  annotations:
    clavenar.io/auth-rotation-id: {{ $rotationId | quote }}
  labels:
    {{- include "clavenar.labels" (dict "ctx" . "service" "shared-tokens") | nindent 4 }}
type: Opaque
data:
  hil-decide-token: {{ $hilDecideToken }}
  hil-session-key: {{ $hilSessionKey }}
  hil-bootstrap-token: {{ $hilBootstrapToken }}
  brain-cache-hmac-key: {{ $brainCacheHmacKey }}
{{- end }}
