{{/*
The pre-install/pre-upgrade transaction has three least-tool stages:
snapshot (kubectl + jq), mint/validate (openssl), then apply/rollout
(kubectl). Both shared emptyDirs are memory-backed so superseded signers never
land in a persistent volume. An ordinary reconcile validates and preserves the
existing Secret; only operation=rotate can stage a new generation.
*/}}
{{- if .Values.tlsBundle.autoMint }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-tls-automint
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "clavenar.labels" (dict "ctx" . "service" "tls-automint") | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "clavenar.selectorLabels" (dict "ctx" . "service" "tls-automint") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}-tls-automint
      restartPolicy: OnFailure
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: snapshot
          image: "{{ .Values.tlsBundle.applyImage.repository }}:{{ .Values.tlsBundle.applyImage.tag }}"
          imagePullPolicy: {{ .Values.tlsBundle.applyImage.pullPolicy }}
          command: ["/bin/sh", "/script/snapshot.sh"]
          env:
            - name: TLS_SECRET_NAME
              value: {{ .Values.tlsBundle.secretName | quote }}
            - name: POD_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: EXPECTED_SAN_SCHEME
              value: {{ include "clavenar.tlsSanScheme" . | quote }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          volumeMounts:
            - { name: script, mountPath: /script, readOnly: true }
            - { name: state, mountPath: /state }
        - name: mint
          image: "{{ .Values.tlsBundle.mintImage.repository }}:{{ .Values.tlsBundle.mintImage.tag }}"
          imagePullPolicy: {{ .Values.tlsBundle.mintImage.pullPolicy }}
          command: ["/bin/sh", "/script/mint.sh"]
          env:
            - name: SPIFFE_TRUST_DOMAIN
              value: {{ .Values.tlsBundle.spiffeTrustDomain | quote }}
            - name: BUNDLE_SERVICES
              value: {{ include "clavenar.bundleServices" . | quote }}
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: TLS_ROTATION_OPERATION
              value: {{ .Values.tlsBundle.rotation.operation | quote }}
            - name: TLS_ROTATION_GENERATION
              value: {{ .Values.tlsBundle.rotation.generation | quote }}
            - name: TLS_ROTATION_REASON
              value: {{ .Values.tlsBundle.rotation.reason | quote }}
            - name: EXPIRY_WINDOW_SECONDS
              value: {{ .Values.tlsBundle.rotation.expiryWindowSeconds | quote }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          volumeMounts:
            - { name: script, mountPath: /script, readOnly: true }
            - { name: state, mountPath: /state }
            - { name: work, mountPath: /work }
      containers:
        - name: apply
          image: "{{ .Values.tlsBundle.applyImage.repository }}:{{ .Values.tlsBundle.applyImage.tag }}"
          imagePullPolicy: {{ .Values.tlsBundle.applyImage.pullPolicy }}
          command: ["/bin/sh", "/script/apply.sh"]
          env:
            - name: TLS_SECRET_NAME
              value: {{ .Values.tlsBundle.secretName | quote }}
            - name: POD_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: EXPECTED_SAN_SCHEME
              value: {{ include "clavenar.tlsSanScheme" . | quote }}
            - name: BUNDLE_SERVICES
              value: {{ include "clavenar.bundleServices" . | quote }}
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: TLS_ROTATION_OPERATION
              value: {{ .Values.tlsBundle.rotation.operation | quote }}
            - name: TLS_ROTATION_GENERATION
              value: {{ .Values.tlsBundle.rotation.generation | quote }}
            - name: TLS_ROTATION_REASON
              value: {{ .Values.tlsBundle.rotation.reason | quote }}
            - name: OVERLAP_SECONDS
              value: {{ .Values.tlsBundle.rotation.overlapSeconds | quote }}
            - name: ROLLOUT_TIMEOUT_SECONDS
              value: {{ .Values.tlsBundle.rotation.rolloutTimeoutSeconds | quote }}
            - name: ROLLOUT_DEPLOYMENTS
              value: {{ include "clavenar.tlsRolloutDeployments" . | quote }}
            - name: ROLLOUT_STATEFULSETS
              value: {{ include "clavenar.tlsRolloutStatefulSets" . | quote }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          volumeMounts:
            - { name: script, mountPath: /script, readOnly: true }
            - { name: state, mountPath: /state, readOnly: true }
            - { name: work, mountPath: /work, readOnly: true }
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-tls-automint
            defaultMode: 0755
        - name: state
          emptyDir: { medium: Memory }
        - name: work
          emptyDir: { medium: Memory }
{{- end }}
