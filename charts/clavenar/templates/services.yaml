{{/*
Emit a Deployment + Service per enabled service, plus a PVC when
.Values.persistence.<service>.enabled. PVCs mount at /var/lib/clavenar,
which matches the CLAVENAR_*_DB defaults.

`$` is the root context — passed explicitly to helpers because `.`
inside the range is the iterated value.
*/}}
{{- range $name, $cfg := .Values.services }}
{{- if $cfg.enabled }}
{{- if ne (default "ClusterIP" $cfg.serviceType) "ClusterIP" }}
{{- fail (printf "services.%s.serviceType must be ClusterIP; externally reachable Services must be published by an operator-controlled Ingress or Gateway" $name) }}
{{- end }}
{{- $persist := index $.Values.persistence $name | default dict }}
{{- $operatorMtls := and (eq $name "console") (dig "operatorMtls" "enabled" false $cfg) }}
{{- $consoleDemo := and (eq $name "console") (dig "demo" "enabled" false $cfg) }}
{{- $mountsCapability := and (not (empty $.Values.tlsBundle.secretName)) (has $name (list "ledger" "policyEngine" "hil" "identity")) }}
{{- $extraVolumeMounts := default (list) $cfg.extraVolumeMounts }}
{{- $extraVolumes := default (list) $cfg.extraVolumes }}
{{- include "clavenar.validateAuthExtraEnv" (dict "service" $name "svcCfg" $cfg) }}
{{- include "clavenar.validateGovernedExtraEnv" (dict "ctx" $ "service" $name "svcCfg" $cfg) }}
{{- /* SQLite on a shared PVC corrupts under concurrent writers, so a
       persistence-enabled (SQLite-backed) service refuses replicas>1
       at template time instead of corrupting at runtime. Postgres-mode
       ledger deployments disable persistence and scale freely. */}}
{{- if and $persist.enabled (gt (int $cfg.replicas) 1) }}
{{- fail (printf "services.%s: replicas=%d with persistence.%s.enabled=true — SQLite-backed services must run replicas: 1 (see values.yaml)" $name (int $cfg.replicas) $name) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clavenar.serviceFullname" (dict "ctx" $ "service" $name) }}
  labels:
    {{- include "clavenar.labels" (dict "ctx" $ "service" $name) | nindent 4 }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      {{- include "clavenar.selectorLabels" (dict "ctx" $ "service" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clavenar.selectorLabels" (dict "ctx" $ "service" $name) | nindent 8 }}
      annotations:
        # Roll every credential consumer only when the operator advances the
        # public generation after updating the referenced Secret.
        clavenar.io/auth-rotation-id: {{ required "authSecrets.rotationId is required" $.Values.authSecrets.rotationId | quote }}
        {{- include "clavenar.metricsAnnotations" (dict "ctx" $ "svcCfg" $cfg) | trim | nindent 8 }}
        {{- if $.Values.tlsBundle.autoMint }}
        # Roll the pod when the auto-mint script changes — the SAN
        # scheme or extension shape might have shifted, which triggers
        # apply.sh to re-mint the Secret. Pods that mounted the old
        # bundle would otherwise keep using the stale cert/CA until
        # something else forced a restart.
        checksum/tls-automint-script: {{ include (print $.Template.BasePath "/tls-automint-script.yaml") $ | sha256sum }}
        {{- end }}
        {{- if $mountsCapability }}
        checksum/workload-capability-bundle: {{ $.Files.Get "files/workload-capability-bundle.json" | sha256sum }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ include "clavenar.terminationGrace" $ }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name | kebabcase }}
          image: {{ include "clavenar.imageRef" (dict "ctx" $ "svcCfg" $cfg) }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            {{- if eq $name "console" }}
            {{- if $operatorMtls }}
            - name: operator-mtls
              containerPort: {{ $cfg.port }}
              protocol: TCP
            {{- else }}
            - name: demo
              containerPort: {{ $cfg.port }}
              protocol: TCP
            {{- end }}
            {{- if $consoleDemo }}
            - name: demo
              containerPort: {{ $cfg.demoPort }}
              protocol: TCP
            {{- end }}
            - name: diagnostics
              containerPort: {{ $cfg.diagnosticsPort }}
              protocol: TCP
            {{- else if eq $name "assurance" }}
            - name: control-mtls
              containerPort: {{ $cfg.port }}
              protocol: TCP
            - name: diagnostics
              containerPort: {{ $cfg.healthPort }}
              protocol: TCP
            {{- else }}
            - name: http
              containerPort: {{ $cfg.port }}
              protocol: TCP
            {{- if and $cfg.healthPort (ne (int $cfg.healthPort) (int $cfg.port)) (or (eq $name "proxy") $.Values.tlsBundle.secretName) }}
            - name: health
              containerPort: {{ $cfg.healthPort }}
              protocol: TCP
            {{- end }}
            {{- if and $cfg.mtlsPort $.Values.tlsBundle.secretName }}
            - name: mtls
              containerPort: {{ $cfg.mtlsPort }}
              protocol: TCP
            {{- end }}
            {{- end }}
          env:
            {{- include "clavenar.commonEnv" (dict "ctx" $ "svcCfg" $cfg "service" $name) | nindent 12 }}
            {{- $vaultTokenSecret := include "clavenar.vaultTokenSecretName" $ }}
            {{- if and $vaultTokenSecret (or (eq $name "proxy") (eq $name "identity")) }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $vaultTokenSecret }}
                  key: token
            # VAULT_ADDR has to accompany VAULT_TOKEN — vaultrs falls
            # back to its compiled-in https://127.0.0.1:8200 default
            # without it, which the proxy can never reach inside a pod.
            # The ConfigMap carries the helper-computed URL (in-cluster
            # Service DNS under bundled mode, .Values.vault.addr under
            # BYO).
            - name: VAULT_ADDR
              valueFrom:
                configMapKeyRef:
                  name: {{ include "clavenar.fullname" $ }}-config
                  key: VAULT_ADDR
            {{- end }}
            {{- if or (eq $name "hil") (and (eq $name "console") $operatorMtls) }}
            # CLAVENAR_HIL_DECIDE_TOKEN: shared bearer for the
            # console → HIL /decide hop. HIL rejects /decide without
            # a matching bearer in operator-mTLS mode. The demo-only
            # console never receives this operator decision credential;
            # its scoped actions forward the signed demo cookie instead.
            - name: CLAVENAR_HIL_DECIDE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "clavenar.authSecretName" $ }}
                  key: hil-decide-token
            {{- end }}
            {{- if eq $name "hil" }}
            # CLAVENAR_HIL_SESSION_KEY: HIL session-cookie HMAC key
            # (64-char hex). HIL auto-mints an ephemeral key when unset,
            # which would invalidate every session on pod restart — pin
            # it to the chart-managed Secret so HIL is restart-safe.
            - name: CLAVENAR_HIL_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "clavenar.authSecretName" $ }}
                  key: hil-session-key
            {{- end }}
          livenessProbe:
            {{- include "clavenar.probe" (dict "ctx" $ "svcCfg" $cfg "kind" "liveness") | nindent 12 }}
          readinessProbe:
            {{- include "clavenar.probe" (dict "ctx" $ "svcCfg" $cfg "kind" "readiness") | nindent 12 }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          {{- $mountsCert := $.Values.tlsBundle.secretName }}
          {{- $mountsOperatorTrust := $operatorMtls }}
          {{- if or $persist.enabled $mountsCert $mountsOperatorTrust $mountsCapability (gt (len $extraVolumeMounts) 0) }}
          volumeMounts:
            {{- if $persist.enabled }}
            - name: data
              mountPath: /var/lib/clavenar
            {{- end }}
            {{- if $mountsCert }}
            - name: certs
              mountPath: {{ $.Values.tlsBundle.mountPath }}
              readOnly: true
            {{- end }}
            {{- if $mountsOperatorTrust }}
            - name: operator-trust
              mountPath: /operator-trust
              readOnly: true
            {{- end }}
            {{- if $mountsCapability }}
            - name: workload-capabilities
              mountPath: /etc/clavenar/workload-capability-bundle.json
              subPath: workload-capability-bundle.json
              readOnly: true
            {{- end }}
            {{- with $extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or $persist.enabled $mountsCert $mountsOperatorTrust $mountsCapability (gt (len $extraVolumes) 0) }}
      volumes:
        {{- if $persist.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "clavenar.serviceFullname" (dict "ctx" $ "service" $name) }}-data
        {{- end }}
        {{- if $mountsCert }}
        - name: certs
          secret:
            secretName: {{ $.Values.tlsBundle.secretName }}
            # 0644 on the key files — clavenar services run as nonroot
            # UID 65532, and `gen_certs.sh` chmods to the same mode on
            # the host. k8s Secret mounts default to 0644 anyway, but
            # pinning is explicit so a re-mode by a downstream patch
            # doesn't lock out the pod at next boot.
            defaultMode: 0644
            # Per-pod projection: each backend mounts only ca.crt +
            # its own service-<name>.{crt,key}, so a compromised pod
            # cannot read another service's private key. Proxy +
            # identity additionally mount server.{crt,key} (proxy's
            # agent-facing mTLS server cert) and client.{crt,key}
            # (legacy starter-agent client cert).
            #
            # `items:` is build with the helper to keep the projection
            # consistent with the per-service naming. A missing key
            # in the Secret silently omits the mount entry; the pod
            # then panics at boot per the recurring-gotcha note.
            items:
              - key: ca.crt
                path: ca.crt
              - key: service-{{ $name | kebabcase }}.crt
                path: service-{{ $name | kebabcase }}.crt
              - key: service-{{ $name | kebabcase }}.key
                path: service-{{ $name | kebabcase }}.key
              {{- if eq $name "proxy" }}
              - key: server.crt
                path: server.crt
              - key: server.key
                path: server.key
              - key: client.crt
                path: client.crt
              - key: client.key
                path: client.key
              {{- end }}
              {{- if eq $name "assurance" }}
              # The assurance runner reaches proxy/NATS as the generic
              # synthetic agent while service-assurance terminates its
              # exact-console control listener.
              - key: client.crt
                path: client.crt
              - key: client.key
                path: client.key
              {{- end }}
              {{- if eq $name "identity" }}
              # Identity roots the trust chain and reads ca.key to mint
              # SVIDs / delegation grants. Only identity's pod opts into
              # this projection — every other service's /certs omits
              # ca.key, so a compromised brain/policy/hil/ledger pod
              # cannot read the CA private key from disk.
              - key: ca.key
                path: ca.key
              {{- end }}
        {{- end }}
        {{- if $mountsOperatorTrust }}
        # Dedicated public operator trust. The Secret is projected by
        # key so an accidental extra entry (especially private authority
        # material) is never exposed to the console container.
        - name: operator-trust
          secret:
            secretName: {{ $cfg.operatorMtls.publicTrustSecretName }}
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
              - key: operators.json
                path: operators.json
        {{- end }}
        {{- if $mountsCapability }}
        - name: workload-capabilities
          configMap:
            name: {{ include "clavenar.fullname" $ }}-workload-capabilities
            items:
              - key: workload-capability-bundle.json
                path: workload-capability-bundle.json
        {{- end }}
        {{- with $extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clavenar.serviceFullname" (dict "ctx" $ "service" $name) }}
  labels:
    {{- include "clavenar.labels" (dict "ctx" $ "service" $name) | nindent 4 }}
spec:
  type: {{ $cfg.serviceType }}
  ports:
    {{- if eq $name "console" }}
    {{- if $operatorMtls }}
    - port: {{ $cfg.port }}
      targetPort: operator-mtls
      protocol: TCP
      appProtocol: https
      name: operator-mtls
    {{- else }}
    - port: {{ $cfg.port }}
      targetPort: demo
      protocol: TCP
      appProtocol: http
      name: demo
    {{- end }}
    {{- if $consoleDemo }}
    - port: {{ $cfg.demoPort }}
      targetPort: demo
      protocol: TCP
      appProtocol: http
      name: demo
    {{- end }}
    {{- else if eq $name "assurance" }}
    - port: {{ $cfg.port }}
      targetPort: control-mtls
      protocol: TCP
      appProtocol: https
      name: control-mtls
    {{- else }}
    - port: {{ $cfg.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if and $cfg.mtlsPort $.Values.tlsBundle.secretName }}
    # Dual-port surface: console / proxy / deep-review reach the
    # internal SPIFFE-gated subset here. Kept off when no TLS bundle
    # is mounted — the in-pod mTLS listener wouldn't be up to receive.
    - port: {{ $cfg.mtlsPort }}
      targetPort: mtls
      protocol: TCP
      name: mtls
    {{- end }}
    {{- end }}
  selector:
    {{- include "clavenar.selectorLabels" (dict "ctx" $ "service" $name) | nindent 4 }}
{{- if $persist.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "clavenar.serviceFullname" (dict "ctx" $ "service" $name) }}-data
  labels:
    {{- include "clavenar.labels" (dict "ctx" $ "service" $name) | nindent 4 }}
spec:
  accessModes:
    - {{ $persist.accessMode | default "ReadWriteOnce" }}
  {{- if $persist.storageClass }}
  storageClassName: {{ $persist.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $persist.size | default "1Gi" }}
{{- end }}
{{- end }}
{{- end }}
