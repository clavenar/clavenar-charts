{{/*
Emit a Deployment + Service per enabled service, plus a PVC when
.Values.persistence.<service>.enabled. Policy governance state mounts at its
explicit /var/lib/clavenar-policy-engine path; other service PVCs mount at
/var/lib/clavenar, matching their CLAVENAR_*_DB defaults.

`$` is the root context — passed explicitly to helpers because `.`
inside the range is the iterated value.
*/}}
{{- range $name, $cfg := .Values.services }}
{{- if $cfg.enabled }}
{{- if ne (default "ClusterIP" $cfg.serviceType) "ClusterIP" }}
{{- fail (printf "services.%s.serviceType must be ClusterIP; externally reachable Services must be published by an operator-controlled Ingress or Gateway" $name) }}
{{- end }}
{{- $persist := index $.Values.persistence $name | default dict }}
{{- $operatorMtls := and (eq $name "console") (dig "operatorMtls" "enabled" false $cfg) }}
{{- $consoleDemo := and (eq $name "console") (dig "demo" "enabled" false $cfg) }}
{{- $mountsCapability := and (not (empty $.Values.tlsBundle.secretName)) (has $name (list "ledger" "policyEngine" "hil" "identity")) }}
{{- $mountsAttestationContract := has $name (list "proxy" "policyEngine" "identity") }}
{{- $mountsFederatedIdentityContract := eq $name "console" }}
{{- $mountsControlState := eq $name "proxy" }}
{{- $mountsAttestationTrust := and (eq $name "identity") (not (empty $.Values.attestationTrustAnchors.secretName)) }}
{{- $mountsBrainCacheKey := eq $name "brain" }}
{{- $mountsHilPayloadKey := eq $name "hil" }}
{{- $mountsHilNotificationToken := and (eq $name "hil") (not (empty $cfg.notifications.webhook.tokenSecretName)) }}
{{- $vaultTokenSecret := include "clavenar.vaultTokenSecretName" $ }}
{{- $mountsVaultToken := and (not (empty $vaultTokenSecret)) (has $name (list "proxy" "identity")) }}
{{- $mountsTsaTrust := and (eq $name "ledger") (not (empty $.Values.tlsBundle.secretName)) $.Values.ledgerCryptographicVerification.enabled }}
{{- $vaultTokenKey := ternary $.Values.vault.proxyTokenKey $.Values.vault.identityTokenKey (eq $name "proxy") }}
{{- $mountsCert := $.Values.tlsBundle.secretName }}
{{- $managedWorkloadIdentity := and (not (empty $.Values.tlsBundle.secretName)) $.Values.workloadIdentity.enabled (has $name (list "proxy" "brain" "policyEngine" "ledger" "hil" "identity" "console")) }}
{{- $mountsOperatorTrust := $operatorMtls }}
{{- $extraVolumeMounts := default (list) $cfg.extraVolumeMounts }}
{{- $extraVolumes := default (list) $cfg.extraVolumes }}
{{- $readinessTargets := include "clavenar.readinessTargets" (dict "ctx" $ "service" $name) | trim }}
{{- $hasReadinessGate := not (empty $readinessTargets) }}
{{- include "clavenar.validateAuthExtraEnv" (dict "service" $name "svcCfg" $cfg) }}
{{- include "clavenar.validateGovernedExtraEnv" (dict "ctx" $ "service" $name "svcCfg" $cfg) }}
{{- /* SQLite on a shared PVC corrupts under concurrent writers, so a
       persistence-enabled (SQLite-backed) service refuses replicas>1
       at template time instead of corrupting at runtime. Postgres-mode
       ledger deployments disable persistence and scale freely. */}}
{{- if and $persist.enabled (gt (int $cfg.replicas) 1) }}
{{- fail (printf "services.%s: replicas=%d with persistence.%s.enabled=true — SQLite-backed services must run replicas: 1 (see values.yaml)" $name (int $cfg.replicas) $name) }}
{{- end }}
{{- if and $managedWorkloadIdentity (gt (int $cfg.replicas) 1) }}
{{- fail (printf "services.%s: replicas=%d with workloadIdentity.enabled=true — each exact-current workload identity requires a distinct persistent store; this Deployment supports replicas: 1" $name (int $cfg.replicas)) }}
{{- end }}
{{- if and (eq $name "hil") (not (empty $cfg.notifications.webhook.url)) (not $mountsHilNotificationToken) }}
{{- fail "services.hil.notifications.webhook.tokenSecretName is required when webhook.url is set" }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clavenar.serviceFullname" (dict "ctx" $ "service" $name) }}
  labels:
    {{- include "clavenar.labels" (dict "ctx" $ "service" $name) | nindent 4 }}
  {{- if $persist.enabled }}
  annotations:
    clavenar.io/stateful-upgrade-contract: {{ printf "sha256:%s" ($.Files.Get "files/stateful-upgrade-v1.fixture.json" | sha256sum) | quote }}
    clavenar.io/release-version: {{ $.Chart.Version | quote }}
  {{- end }}
spec:
  replicas: {{ $cfg.replicas }}
  {{- if $persist.enabled }}
  # SQLite writers require termination-before-start on every upgrade. A
  # replica count of one alone still permits the Deployment default's surge
  # writer, so persistence always owns an explicit Recreate strategy.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "clavenar.selectorLabels" (dict "ctx" $ "service" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clavenar.selectorLabels" (dict "ctx" $ "service" $name) | nindent 8 }}
      annotations:
        # Roll every credential consumer only when the operator advances the
        # public generation after updating the referenced Secret.
        clavenar.io/auth-rotation-id: {{ required "authSecrets.rotationId is required" $.Values.authSecrets.rotationId | quote }}
        checksum/dependency-readiness-schema: {{ $.Files.Get "files/dependency-readiness-v1.schema.json" | sha256sum }}
        checksum/dependency-readiness-fixture: {{ $.Files.Get "files/dependency-readiness-v1.fixture.json" | sha256sum }}
        {{- if $mountsFederatedIdentityContract }}
        checksum/production-federated-identity: {{ $.Files.Get "files/production-federated-identity-v1.fixture.json" | sha256sum }}
        {{- end }}
        {{- include "clavenar.metricsAnnotations" (dict "ctx" $ "svcCfg" $cfg) | trim | nindent 8 }}
        {{- if and $mountsCert $.Values.tlsBundle.autoMint }}
        # The rotation hook temporarily advances this annotation through
        # overlap phases and finishes at the rendered generation. Script-only
        # chart changes do not roll credential consumers.
        clavenar.io/tls-generation: {{ $.Values.tlsBundle.rotation.generation | quote }}
        {{- end }}
        {{- if $mountsCapability }}
        checksum/workload-capability-bundle: {{ $.Files.Get "files/workload-capability-bundle.json" | sha256sum }}
        {{- end }}
        {{- if eq $name "hil" }}
        checksum/hil-retention-schema: {{ $.Files.Get "files/hil-retention-v1.schema.json" | sha256sum }}
        checksum/hil-retention-fixture: {{ $.Files.Get "files/hil-retention-v1.fixture.json" | sha256sum }}
        checksum/hil-erasure-schema: {{ $.Files.Get "files/hil-erasure-v1.schema.json" | sha256sum }}
        checksum/hil-erasure-fixture: {{ $.Files.Get "files/hil-erasure-v1.fixture.json" | sha256sum }}
        checksum/hil-notification-lifecycle-schema: {{ $.Files.Get "files/hil-notification-lifecycle-v1.schema.json" | sha256sum }}
        checksum/hil-notification-lifecycle-fixture: {{ $.Files.Get "files/hil-notification-lifecycle-v1.fixture.json" | sha256sum }}
        {{- end }}
        {{- if eq $name "ledger" }}
        checksum/active-agent-meter-schema: {{ $.Files.Get "files/active-agent-meter-v1.schema.json" | sha256sum }}
        checksum/active-agent-meter-fixture: {{ $.Files.Get "files/active-agent-meter-v1.fixture.json" | sha256sum }}
        {{- end }}
        {{- if $mountsAttestationContract }}
        checksum/attestation-verifier-schema: {{ $.Files.Get "files/attestation-verifier-v1.schema.json" | sha256sum }}
        checksum/attestation-verifier-fixture: {{ $.Files.Get "files/attestation-verifier-v1.fixture.json" | sha256sum }}
        {{- end }}
        {{- if $mountsControlState }}
        checksum/distributed-control-state: {{ $.Files.Get "files/distributed-control-state-v1.fixture.json" | sha256sum }}
        checksum/tenant-state-migration: {{ $.Files.Get "files/tenant-state-migration-v1.fixture.json" | sha256sum }}
        checksum/state-namespace-isolation: {{ $.Files.Get "files/state-namespace-isolation-v1.fixture.json" | sha256sum }}
        checksum/tenant-route-authorization: {{ $.Files.Get "files/tenant-route-authorization-v1.fixture.json" | sha256sum }}
        checksum/tenant-lifecycle-saga: {{ $.Files.Get "files/tenant-lifecycle-saga-v1.fixture.json" | sha256sum }}
        checksum/distributed-control-resilience: {{ $.Files.Get "files/distributed-control-resilience-v1.fixture.json" | sha256sum }}
        {{- end }}
        {{- if $mountsTsaTrust }}
        checksum/tsa-ca: {{ $.Files.Get "files/tsa/freetsa-ca.pem" | sha256sum }}
        checksum/tsa-signer: {{ $.Files.Get "files/tsa/freetsa-tsa.crt" | sha256sum }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ include "clavenar.terminationGrace" $ }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $mountsCert $hasReadinessGate }}
      initContainers:
        {{- if $hasReadinessGate }}
        - name: dependency-readiness-gate
          image: "{{ $.Values.tlsBundle.projectorImage.repository }}:{{ $.Values.tlsBundle.projectorImage.tag }}"
          imagePullPolicy: {{ $.Values.tlsBundle.projectorImage.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              for target in{{ range $target := splitList "\n" $readinessTargets }} {{ $target | quote }}{{ end }}; do
                attempt=1
                until wget -q -T 2 -O /dev/null "$target"; do
                  if [ "$attempt" -ge 30 ]; then
                    echo "dependency readiness deadline exceeded" >&2
                    exit 1
                  fi
                  attempt=$((attempt + 1))
                  sleep 2
                done
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
        {{- end }}
        {{- if $mountsCert }}
        - name: workload-tls-projector
          image: "{{ $.Values.tlsBundle.projectorImage.repository }}:{{ $.Values.tlsBundle.projectorImage.tag }}"
          imagePullPolicy: {{ $.Values.tlsBundle.projectorImage.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              umask 077
              cp /tls-source/* /projected/
              chmod 0444 /projected/*.crt
              chmod 0600 /projected/*.key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: certs-source
              mountPath: /tls-source
              readOnly: true
            - name: certs
              mountPath: /projected
        {{- if $managedWorkloadIdentity }}
        - name: workload-svid-state-initializer
          image: "{{ $.Values.tlsBundle.projectorImage.repository }}:{{ $.Values.tlsBundle.projectorImage.tag }}"
          imagePullPolicy: {{ $.Values.tlsBundle.projectorImage.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              state=/state-root/current
              if [ -e "$state" ]; then
                [ -d "$state" ] && [ ! -L "$state" ]
                [ "$(stat -c '%a:%u' "$state")" = "700:{{ $.Values.podSecurityContext.runAsUser }}" ]
              else
                mkdir "$state"
                chmod 0700 "$state"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: workload-svid-state
              mountPath: /state-root
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name | kebabcase }}
          image: {{ include "clavenar.imageRef" (dict "ctx" $ "svcCfg" $cfg) }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            {{- if eq $name "console" }}
            {{- if $operatorMtls }}
            - name: operator-mtls
              containerPort: {{ $cfg.port }}
              protocol: TCP
            {{- else }}
            - name: demo
              containerPort: {{ $cfg.port }}
              protocol: TCP
            {{- end }}
            {{- if $consoleDemo }}
            - name: demo
              containerPort: {{ $cfg.demoPort }}
              protocol: TCP
            {{- end }}
            - name: diagnostics
              containerPort: {{ $cfg.diagnosticsPort }}
              protocol: TCP
            {{- else if eq $name "assurance" }}
            - name: control-mtls
              containerPort: {{ $cfg.port }}
              protocol: TCP
            - name: diagnostics
              containerPort: {{ $cfg.healthPort }}
              protocol: TCP
            {{- else }}
            - name: http
              containerPort: {{ $cfg.port }}
              protocol: TCP
            {{- if and $cfg.healthPort (ne (int $cfg.healthPort) (int $cfg.port)) }}
            - name: health
              containerPort: {{ $cfg.healthPort }}
              protocol: TCP
            {{- end }}
            {{- if and $cfg.mtlsPort $.Values.tlsBundle.secretName }}
            - name: mtls
              containerPort: {{ $cfg.mtlsPort }}
              protocol: TCP
            {{- end }}
            {{- end }}
          env:
            {{- include "clavenar.commonEnv" (dict "ctx" $ "svcCfg" $cfg "service" $name) | nindent 12 }}
            {{- if $mountsVaultToken }}
            - name: VAULT_TOKEN_FILE
              value: /run/secrets/vault-token
            # VAULT_ADDR has to accompany VAULT_TOKEN_FILE — vaultrs falls
            # back to its compiled-in https://127.0.0.1:8200 default
            # without it, which the proxy can never reach inside a pod.
            # The ConfigMap carries the helper-computed URL (in-cluster
            # Service DNS under bundled mode, .Values.vault.addr under
            # BYO).
            - name: VAULT_ADDR
              valueFrom:
                configMapKeyRef:
                  name: {{ include "clavenar.fullname" $ }}-config
                  key: VAULT_ADDR
            {{- end }}
            {{- if or (eq $name "hil") (and (eq $name "console") $operatorMtls) }}
            # CLAVENAR_HIL_DECIDE_TOKEN: shared bearer for the
            # console → HIL /decide hop. HIL rejects /decide without
            # a matching bearer in operator-mTLS mode. The demo-only
            # console never receives this operator decision credential;
            # its scoped actions forward the signed demo cookie instead.
            - name: CLAVENAR_HIL_DECIDE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "clavenar.authSecretName" $ }}
                  key: hil-decide-token
            {{- end }}
            {{- if $mountsBrainCacheKey }}
            # Exact cache identity is a domain-separated tenant-HMAC digest.
            # The key is projected as a file, never an environment value, and
            # Brain refuses listener bind if it is absent or unsafe.
            - name: CLAVENAR_BRAIN_CACHE_HMAC_KEY_FILE
              value: /run/secrets/brain-cache-hmac-key
            - name: CLAVENAR_BRAIN_REQUIRE_CACHE_HMAC_KEY
              value: "true"
            {{- end }}
            {{- if eq $name "hil" }}
            - name: CLAVENAR_HIL_PAYLOAD_KEY_FILE
              value: {{ include "clavenar.hilPayloadKeyFile" $ | quote }}
            # CLAVENAR_HIL_SESSION_KEY: HIL session-cookie HMAC key
            # (64-char hex). HIL auto-mints an ephemeral key when unset,
            # which would invalidate every session on pod restart — pin
            # it to the chart-managed Secret so HIL is restart-safe.
            - name: CLAVENAR_HIL_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "clavenar.authSecretName" $ }}
                  key: hil-session-key
            # Separate one-use first-enrollment authority. HIL persists only
            # its digest and permanently refuses another bootstrap after the
            # deployment-scoped authority reaches a terminal state.
            - name: CLAVENAR_HIL_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "clavenar.authSecretName" $ }}
                  key: hil-bootstrap-token
            - name: CLAVENAR_HIL_DEPLOYMENT_ID
              value: {{ include "clavenar.fullname" $ | quote }}
            - name: CLAVENAR_HIL_SIMULATOR_TENANT
              value: {{ $cfg.simulatorTenant | quote }}
            # Durable WebAuthn ceremony bounds. Keep the four dimensions
            # explicit in the rendered workload so production posture does
            # not depend on binary-only defaults.
            - name: CLAVENAR_HIL_WEBAUTHN_TTL_SECS
              value: {{ $cfg.webauthnCeremony.ttlSeconds | quote }}
            - name: CLAVENAR_HIL_WEBAUTHN_ATTEMPT_LIMIT
              value: {{ $cfg.webauthnCeremony.attemptLimit | quote }}
            - name: CLAVENAR_HIL_WEBAUTHN_RATE_WINDOW_SECS
              value: {{ $cfg.webauthnCeremony.rateWindowSeconds | quote }}
            - name: CLAVENAR_HIL_WEBAUTHN_SUBJECT_START_LIMIT
              value: {{ $cfg.webauthnCeremony.startLimits.subject | quote }}
            - name: CLAVENAR_HIL_WEBAUTHN_TENANT_START_LIMIT
              value: {{ $cfg.webauthnCeremony.startLimits.tenant | quote }}
            - name: CLAVENAR_HIL_WEBAUTHN_SOURCE_START_LIMIT
              value: {{ $cfg.webauthnCeremony.startLimits.source | quote }}
            - name: CLAVENAR_HIL_WEBAUTHN_DEPLOYMENT_START_LIMIT
              value: {{ $cfg.webauthnCeremony.startLimits.deployment | quote }}
            - name: CLAVENAR_HIL_WEBAUTHN_SUBJECT_PENDING_LIMIT
              value: {{ $cfg.webauthnCeremony.pendingLimits.subject | quote }}
            - name: CLAVENAR_HIL_WEBAUTHN_TENANT_PENDING_LIMIT
              value: {{ $cfg.webauthnCeremony.pendingLimits.tenant | quote }}
            - name: CLAVENAR_HIL_WEBAUTHN_SOURCE_PENDING_LIMIT
              value: {{ $cfg.webauthnCeremony.pendingLimits.source | quote }}
            - name: CLAVENAR_HIL_WEBAUTHN_DEPLOYMENT_PENDING_LIMIT
              value: {{ $cfg.webauthnCeremony.pendingLimits.deployment | quote }}
            - name: CLAVENAR_HIL_NOTIFICATION_MODE
              value: {{ $cfg.notifications.mode | quote }}
            - name: CLAVENAR_HIL_NOTIFICATION_TIMEOUT_SECS
              value: {{ $cfg.notifications.timeoutSeconds | quote }}
            {{- if not (empty $cfg.notifications.webhook.url) }}
            - name: CLAVENAR_HIL_WEBHOOK_URL
              value: {{ $cfg.notifications.webhook.url | quote }}
            - name: CLAVENAR_HIL_WEBHOOK_BEARER_TOKEN_FILE
              value: /run/secrets/hil-notification-delivery-token
            {{- end }}
            {{- end }}
            {{- if $mountsAttestationTrust }}
            - name: CLAVENAR_ATTESTATION_TRUST_ANCHORS_FILE
              value: /etc/clavenar/attestation/k8s-trust-anchors.json
            {{- end }}
          livenessProbe:
            {{- include "clavenar.probe" (dict "ctx" $ "svcCfg" $cfg "kind" "liveness") | nindent 12 }}
          readinessProbe:
            {{- include "clavenar.probe" (dict "ctx" $ "svcCfg" $cfg "kind" "readiness") | nindent 12 }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          {{- if or $persist.enabled $mountsCert $managedWorkloadIdentity $mountsOperatorTrust $mountsCapability $mountsAttestationContract $mountsFederatedIdentityContract $mountsControlState $mountsAttestationTrust $mountsBrainCacheKey $mountsHilPayloadKey $mountsHilNotificationToken $mountsVaultToken $mountsTsaTrust (gt (len $extraVolumeMounts) 0) }}
          volumeMounts:
            {{- if $persist.enabled }}
            - name: data
              mountPath: {{ ternary "/var/lib/clavenar-policy-engine" "/var/lib/clavenar" (eq $name "policyEngine") }}
            {{- end }}
            {{- if $mountsCert }}
            - name: certs
              mountPath: {{ $.Values.tlsBundle.mountPath }}
              readOnly: true
            {{- end }}
            {{- if $managedWorkloadIdentity }}
            - name: workload-svid-state
              mountPath: /var/lib/clavenar-workload-identity
              subPath: current
            {{- end }}
            {{- if $mountsOperatorTrust }}
            - name: operator-trust
              mountPath: /operator-trust
              readOnly: true
            {{- end }}
            {{- if $mountsCapability }}
            - name: workload-capabilities
              mountPath: /etc/clavenar/workload-capability-bundle.json
              subPath: workload-capability-bundle.json
              readOnly: true
            {{- end }}
            {{- if $mountsAttestationContract }}
            - name: attestation-verifier-contract
              mountPath: /etc/clavenar/attestation
              readOnly: true
            {{- end }}
            {{- if $mountsFederatedIdentityContract }}
            - name: federated-identity-contract
              mountPath: /etc/clavenar/federated-identity
              readOnly: true
            {{- end }}
            {{- if $mountsControlState }}
            - name: distributed-control-state
              mountPath: /etc/clavenar/control-state
              readOnly: true
            {{- end }}
            {{- if $mountsAttestationTrust }}
            - name: attestation-trust-anchors
              mountPath: /etc/clavenar/attestation/k8s-trust-anchors.json
              subPath: k8s-trust-anchors.json
              readOnly: true
            {{- end }}
            {{- if $mountsBrainCacheKey }}
            - name: brain-cache-hmac-key
              mountPath: /run/secrets/brain-cache-hmac-key
              subPath: brain-cache-hmac-key
              readOnly: true
            {{- end }}
            {{- if $mountsHilPayloadKey }}
            - name: {{ include "clavenar.hilPayloadKeyVolume" $ }}
              mountPath: {{ include "clavenar.hilPayloadKeyFile" $ }}
              subPath: hil-payload-key
              readOnly: true
            {{- end }}
            {{- if $mountsHilNotificationToken }}
            - name: hil-notification-delivery-token
              mountPath: /run/secrets/hil-notification-delivery-token
              subPath: hil-notification-delivery-token
              readOnly: true
            {{- end }}
            {{- if $mountsVaultToken }}
            - name: vault-token
              mountPath: /run/secrets/vault-token
              subPath: vault-token
              readOnly: true
            {{- end }}
            {{- if $mountsTsaTrust }}
            - name: tsa-trust
              mountPath: /etc/clavenar/tsa
              readOnly: true
            {{- end }}
            {{- with $extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or $persist.enabled $mountsCert $managedWorkloadIdentity $mountsOperatorTrust $mountsCapability $mountsAttestationContract $mountsControlState $mountsAttestationTrust $mountsBrainCacheKey $mountsHilPayloadKey $mountsHilNotificationToken $mountsVaultToken $mountsTsaTrust (gt (len $extraVolumes) 0) }}
      volumes:
        {{- if $persist.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "clavenar.serviceFullname" (dict "ctx" $ "service" $name))) $persist.existingClaim }}
        {{- end }}
        {{- if $mountsCert }}
        - name: certs-source
          secret:
            secretName: {{ $.Values.tlsBundle.secretName }}
            # The source is exact-key projected and group-readable only by the
            # pod fsGroup. A nonroot init container copies it into a private
            # memory-backed directory owned by runtime UID 65532, setting
            # certificates 0444 and every private key 0600. The application
            # container mounts only that owner-bound result.
            defaultMode: 0440
            # Per-pod source projection: each backend receives ca.crt + its
            # own service-<name>.{crt,key}. Proxy additionally receives only
            # its agent-facing server identity; Identity alone receives the
            # CA signer key. Generic and peer private keys remain absent.
            #
            # `items:` is build with the helper to keep the projection
            # consistent with the per-service naming. A missing key
            # in the Secret silently omits the mount entry; the pod
            # then panics at boot per the recurring-gotcha note.
            items:
              - key: ca.crt
                path: ca.crt
              - key: service-{{ $name | kebabcase }}.crt
                path: service-{{ $name | kebabcase }}.crt
              - key: service-{{ $name | kebabcase }}.key
                path: service-{{ $name | kebabcase }}.key
              {{- if eq $name "proxy" }}
              - key: server.crt
                path: server.crt
              - key: server.key
                path: server.key
              {{- end }}
              {{- if eq $name "identity" }}
              # Identity roots the trust chain and reads ca.key to mint
              # SVIDs / delegation grants. Only identity's pod opts into
              # this projection — every other service's /certs omits
              # ca.key, so a compromised brain/policy/hil/ledger pod
              # cannot read the CA private key from disk.
              - key: ca.key
                path: ca.key
              {{- end }}
        - name: certs
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
        {{- if $managedWorkloadIdentity }}
        - name: workload-svid-state
          persistentVolumeClaim:
            claimName: {{ include "clavenar.serviceFullname" (dict "ctx" $ "service" $name) }}-workload-svid
        {{- end }}
        {{- if $mountsOperatorTrust }}
        # Dedicated public operator trust. The Secret is projected by
        # key so an accidental extra entry (especially private authority
        # material) is never exposed to the console container.
        - name: operator-trust
          secret:
            secretName: {{ $cfg.operatorMtls.publicTrustSecretName }}
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
              - key: operators.json
                path: operators.json
        {{- end }}
        {{- if $mountsCapability }}
        - name: workload-capabilities
          configMap:
            name: {{ include "clavenar.fullname" $ }}-workload-capabilities
            items:
              - key: workload-capability-bundle.json
                path: workload-capability-bundle.json
        {{- end }}
        {{- if $mountsAttestationContract }}
        - name: attestation-verifier-contract
          configMap:
            name: {{ include "clavenar.fullname" $ }}-attestation-verifier-contract
            items:
              - key: attestation-verifier-v1.schema.json
                path: attestation-verifier-v1.schema.json
              - key: attestation-verifier-v1.fixture.json
                path: attestation-verifier-v1.fixture.json
        {{- end }}
        {{- if $mountsFederatedIdentityContract }}
        - name: federated-identity-contract
          configMap:
            name: {{ include "clavenar.fullname" $ }}-federated-identity-contract
            items:
              - key: production-federated-identity-v1.schema.json
                path: production-federated-identity-v1.schema.json
              - key: production-federated-identity-v1.fixture.json
                path: production-federated-identity-v1.fixture.json
        {{- end }}
        {{- if $mountsControlState }}
        - name: distributed-control-state
          configMap:
            name: {{ include "clavenar.fullname" $ }}-distributed-control-state
            items:
              - key: distributed-control-state-v1.schema.json
                path: distributed-control-state-v1.schema.json
              - key: distributed-control-state-v1.fixture.json
                path: distributed-control-state-v1.fixture.json
              - key: tenant-state-migration-v1.schema.json
                path: tenant-state-migration-v1.schema.json
              - key: tenant-state-migration-v1.fixture.json
                path: tenant-state-migration-v1.fixture.json
              - key: state-namespace-isolation-v1.schema.json
                path: state-namespace-isolation-v1.schema.json
              - key: state-namespace-isolation-v1.fixture.json
                path: state-namespace-isolation-v1.fixture.json
              - key: tenant-route-authorization-v1.schema.json
                path: tenant-route-authorization-v1.schema.json
              - key: tenant-route-authorization-v1.fixture.json
                path: tenant-route-authorization-v1.fixture.json
              - key: tenant-lifecycle-saga-v1.schema.json
                path: tenant-lifecycle-saga-v1.schema.json
              - key: tenant-lifecycle-saga-v1.fixture.json
                path: tenant-lifecycle-saga-v1.fixture.json
              - key: distributed-control-resilience-v1.schema.json
                path: distributed-control-resilience-v1.schema.json
              - key: distributed-control-resilience-v1.fixture.json
                path: distributed-control-resilience-v1.fixture.json
        {{- end }}
        {{- if $mountsAttestationTrust }}
        - name: attestation-trust-anchors
          secret:
            secretName: {{ $.Values.attestationTrustAnchors.secretName }}
            defaultMode: 0444
            items:
              - key: {{ $.Values.attestationTrustAnchors.key }}
                path: k8s-trust-anchors.json
        {{- end }}
        {{- if $mountsBrainCacheKey }}
        - name: brain-cache-hmac-key
          secret:
            secretName: {{ include "clavenar.authSecretName" $ }}
            defaultMode: 0440
            items:
              - key: brain-cache-hmac-key
                path: brain-cache-hmac-key
        {{- end }}
        {{- if $mountsHilPayloadKey }}
        - name: {{ include "clavenar.hilPayloadKeyVolume" $ }}
          secret:
            secretName: {{ required "hilPayloadProtection.secretName is required" $.Values.hilPayloadProtection.secretName }}
            defaultMode: 0440
            items:
              - key: {{ required "hilPayloadProtection.key is required" $.Values.hilPayloadProtection.key }}
                path: hil-payload-key
        {{- end }}
        {{- if $mountsHilNotificationToken }}
        - name: hil-notification-delivery-token
          secret:
            secretName: {{ $cfg.notifications.webhook.tokenSecretName }}
            defaultMode: 0440
            items:
              - key: {{ $cfg.notifications.webhook.tokenSecretKey }}
                path: hil-notification-delivery-token
        {{- end }}
        {{- if $mountsVaultToken }}
        - name: vault-token
          secret:
            secretName: {{ $vaultTokenSecret }}
            defaultMode: 0440
            items:
              - key: {{ $vaultTokenKey }}
                path: vault-token
        {{- end }}
        {{- if $mountsTsaTrust }}
        - name: tsa-trust
          configMap:
            name: {{ include "clavenar.fullname" $ }}-tsa-trust
            items:
              - key: freetsa-ca.pem
                path: freetsa-ca.pem
              - key: freetsa-tsa.crt
                path: freetsa-tsa.crt
        {{- end }}
        {{- with $extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clavenar.serviceFullname" (dict "ctx" $ "service" $name) }}
  labels:
    {{- include "clavenar.labels" (dict "ctx" $ "service" $name) | nindent 4 }}
spec:
  type: {{ $cfg.serviceType }}
  {{- if and $managedWorkloadIdentity (eq $name "identity") }}
  # Identity must receive its own initial bootstrap enrollment while its
  # workload credential readiness check is intentionally false.
  publishNotReadyAddresses: true
  {{- end }}
  ports:
    {{- if eq $name "console" }}
    {{- if $operatorMtls }}
    - port: {{ $cfg.port }}
      targetPort: operator-mtls
      protocol: TCP
      appProtocol: https
      name: operator-mtls
    {{- else }}
    - port: {{ $cfg.port }}
      targetPort: demo
      protocol: TCP
      appProtocol: http
      name: demo
    {{- end }}
    {{- if $consoleDemo }}
    - port: {{ $cfg.demoPort }}
      targetPort: demo
      protocol: TCP
      appProtocol: http
      name: demo
    {{- end }}
    - port: {{ $cfg.diagnosticsPort }}
      targetPort: diagnostics
      protocol: TCP
      appProtocol: http
      name: diagnostics
    {{- else if eq $name "assurance" }}
    - port: {{ $cfg.port }}
      targetPort: control-mtls
      protocol: TCP
      appProtocol: https
      name: control-mtls
    - port: {{ $cfg.healthPort }}
      targetPort: diagnostics
      protocol: TCP
      appProtocol: http
      name: diagnostics
    {{- else }}
    - port: {{ $cfg.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if and $cfg.healthPort (ne (int $cfg.healthPort) (int $cfg.port)) }}
    - port: {{ $cfg.healthPort }}
      targetPort: health
      protocol: TCP
      appProtocol: http
      name: health
    {{- end }}
    {{- if and $cfg.mtlsPort $.Values.tlsBundle.secretName }}
    # Dual-port surface: console / proxy / deep-review reach the
    # internal SPIFFE-gated subset here. Kept off when no TLS bundle
    # is mounted — the in-pod mTLS listener wouldn't be up to receive.
    - port: {{ $cfg.mtlsPort }}
      targetPort: mtls
      protocol: TCP
      name: mtls
    {{- end }}
    {{- end }}
  selector:
    {{- include "clavenar.selectorLabels" (dict "ctx" $ "service" $name) | nindent 4 }}
{{- if and $persist.enabled (empty $persist.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "clavenar.serviceFullname" (dict "ctx" $ "service" $name) }}-data
  labels:
    {{- include "clavenar.labels" (dict "ctx" $ "service" $name) | nindent 4 }}
  {{- if eq $name "policyEngine" }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - {{ $persist.accessMode | default "ReadWriteOnce" }}
  {{- if $persist.storageClass }}
  storageClassName: {{ $persist.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $persist.size | default "1Gi" }}
{{- end }}
{{- if $managedWorkloadIdentity }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "clavenar.serviceFullname" (dict "ctx" $ "service" $name) }}-workload-svid
  labels:
    {{- include "clavenar.labels" (dict "ctx" $ "service" $name) | nindent 4 }}
spec:
  accessModes:
    - {{ $.Values.workloadIdentity.accessMode | default "ReadWriteOnce" }}
  {{- if $.Values.workloadIdentity.storageClass }}
  storageClassName: {{ $.Values.workloadIdentity.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $.Values.workloadIdentity.size | default "64Mi" }}
{{- end }}
{{- end }}
{{- end }}
