{{/*
clavenar-exec — evaluation-only execution-gateway MCP server. Sits between
the proxy and the upstream MCP (the bundled stub or a real backend), exposing
seven governed tools. Process execution uses the immutable structured-command
policy and never a shell string. Gated on `exec.enabled`. Single replica
because the workspace PVC is shared
RW with the lab agent pod; multi-replica would race writes.

Composition:
  proxy CLAVENAR_UPSTREAM_URL → clavenar-exec  (this template)
                              ├─ exec tools? run locally inside sandbox
                              └─ everything else (initialize,
                                 resources/*, prompts/*, non-exec
                                 tools/call) forward to
                                 CLAVENAR_EXEC_FALLBACK_URL =
                                 upstream-stub

`upstreamStub.enabled` typically stays true alongside this so the
fallback target exists; `exec.enabled` without `upstreamStub.enabled`
leaves the agent without an `initialize` upstream and most clients
will refuse to handshake.
*/}}
{{- if .Values.exec.enabled }}
{{- $name := "exec" }}
{{- $fullname := printf "%s-%s" .Release.Name $name }}
{{- $stubFullname := printf "%s-upstream-stub" .Release.Name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "clavenar.labels" (dict "ctx" . "service" $name) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "clavenar.selectorLabels" (dict "ctx" . "service" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clavenar.selectorLabels" (dict "ctx" . "service" $name) | nindent 8 }}
      annotations:
        clavenar.io/structured-execution-sha256: {{ .Files.Get "files/structured-execution-v1.fixture.json" | sha256sum | quote }}
        clavenar.io/execution-ceilings-sha256: {{ .Files.Get "files/execution-ceilings-v1.fixture.json" | sha256sum | quote }}
        clavenar.io/rooted-path-target-validation-sha256: {{ .Files.Get "files/rooted-path-target-validation-v1.fixture.json" | sha256sum | quote }}
      {{- if .Values.tlsBundle.autoMint }}
        clavenar.io/tls-generation: {{ .Values.tlsBundle.rotation.generation | quote }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ include "clavenar.terminationGrace" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: workload-tls-projector
          image: "{{ .Values.tlsBundle.projectorImage.repository }}:{{ .Values.tlsBundle.projectorImage.tag }}"
          imagePullPolicy: {{ .Values.tlsBundle.projectorImage.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              umask 077
              cp /tls-source/* /projected/
              chmod 0444 /projected/*.crt
              chmod 0600 /projected/*.key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: certs-source
              mountPath: /tls-source
              readOnly: true
            - name: certs
              mountPath: /projected
      containers:
        - name: {{ $name }}
          image: "{{ .Values.exec.image.repository }}@{{ .Values.exec.image.digest }}"
          imagePullPolicy: {{ .Values.exec.image.pullPolicy }}
          ports:
            - name: mtls
              containerPort: {{ .Values.exec.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.exec.healthPort }}
              protocol: TCP
          env:
            - name: CLAVENAR_EXEC_PORT
              value: {{ .Values.exec.port | quote }}
            - name: CLAVENAR_EXEC_HEALTH_ADDR
              value: "0.0.0.0:{{ .Values.exec.healthPort }}"
            - name: CLAVENAR_EXEC_TLS_DIR
              value: /certs
            - name: CLAVENAR_EXEC_WORKSPACE
              value: /workspace
            - name: CLAVENAR_EXEC_STRUCTURED_POLICY_FILE
              value: /etc/clavenar/structured-execution/structured-execution-v1.fixture.json
            - name: TMPDIR
              value: /scratch
            {{- if .Values.upstreamStub.enabled }}
            - name: CLAVENAR_EXEC_FALLBACK_URL
              value: "http://{{ $stubFullname }}:{{ .Values.upstreamStub.port }}/mcp"
            {{- end }}
            {{- with .Values.exec.fetchAllowlist }}
            - name: CLAVENAR_EXEC_NETPOLICY_ALLOWLIST
              value: {{ join "," . | quote }}
            {{- end }}
          # readOnlyRootFilesystem keeps every writable surface explicit;
          # workspace + bounded memory scratch ride dedicated mounts.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.exec.healthPort }}
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.exec.healthPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.exec.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: scratch
              mountPath: /scratch
            - name: structured-execution
              mountPath: /etc/clavenar/structured-execution
              readOnly: true
            - name: execution-ceilings
              mountPath: /etc/clavenar/execution-ceilings
              readOnly: true
            - name: rooted-path-target-validation
              mountPath: /etc/clavenar/rooted-path-target-validation
              readOnly: true
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ $fullname }}-workspace
        - name: scratch
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.exec.scratchSizeLimit }}
        - name: structured-execution
          configMap:
            name: {{ include "clavenar.fullname" . }}-structured-execution
            items:
              - key: structured-execution-v1.fixture.json
                path: structured-execution-v1.fixture.json
        - name: execution-ceilings
          configMap:
            name: {{ include "clavenar.fullname" . }}-execution-ceilings
            items:
              - key: execution-ceilings-v1.fixture.json
                path: execution-ceilings-v1.fixture.json
        - name: rooted-path-target-validation
          configMap:
            name: {{ include "clavenar.fullname" . }}-rooted-path-target-validation
            items:
              - key: rooted-path-target-validation-v1.fixture.json
                path: rooted-path-target-validation-v1.fixture.json
        - name: certs
          emptyDir:
            medium: Memory
        - name: certs-source
          secret:
            secretName: {{ .Values.tlsBundle.secretName }}
            items:
              - key: ca.crt
                path: ca.crt
              - key: service-exec.crt
                path: service-exec.crt
              - key: service-exec.key
                path: service-exec.key
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "clavenar.labels" (dict "ctx" . "service" $name) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.exec.port }}
      targetPort: mtls
      protocol: TCP
      name: mtls
  selector:
    {{- include "clavenar.selectorLabels" (dict "ctx" . "service" $name) | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-workspace
  labels:
    {{- include "clavenar.labels" (dict "ctx" . "service" $name) | nindent 4 }}
spec:
  accessModes:
    # ReadWriteOnce works for v1 because clavenar-exec + the lab agent
    # pod schedule onto the same node in single-node clusters (kind,
    # k3s, lab). Multi-node clusters that want both pods mounting
    # this PVC must flip to RWX and supply a storageClass that
    # supports it.
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.exec.workspaceSize }}
{{- end }}
