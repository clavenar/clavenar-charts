{{/*
Bundled-mode evaluation Secret. Emitted only when vault.bundled.enabled
is true. The upstream hashicorp/vault subchart runs in dev mode; proxy and
identity receive separately projected keys through this Secret (resolved by the
clavenar.vaultTokenSecretName helper). BYO Vault deployments override
vault.tokenSecretName and skip this template entirely.

Dev mode is in-memory — the revisioned ordinary vault-bootstrap Job
re-creates the transit key on every chart upgrade. Production deployments should disable
bundled and supply their own token through an externally-managed
Secret.
*/}}
{{- if .Values.vault.bundled.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-vault-token
  labels:
    {{- include "clavenar.labels" (dict "ctx" . "service" "vault-token") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.vault.identityTokenKey }}: {{ .Values.vault.bundled.devToken | quote }}
  {{ .Values.vault.proxyTokenKey }}: {{ .Values.vault.bundled.devToken | quote }}
  bootstrap-token: {{ .Values.vault.bundled.devToken | quote }}
{{- end }}
