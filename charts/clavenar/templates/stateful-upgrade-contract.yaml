{{- $schema := .Files.Get "files/stateful-upgrade-v1.schema.json" -}}
{{- $fixture := .Files.Get "files/stateful-upgrade-v1.fixture.json" -}}
{{- $contentDigest := sha256sum (printf "%s\n%s" $schema $fixture) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-stateful-upgrade-contract-%s" (include "clavenar.fullname" . | trunc 23 | trimSuffix "-") (trunc 12 $contentDigest) }}
  labels:
    {{- include "clavenar.labels" (dict "ctx" . "service" "stateful-upgrade-contract") | nindent 4 }}
immutable: true
data:
  stateful-upgrade-v1.schema.json: |
{{ $schema | trimSuffix "\n" | indent 4 }}
  stateful-upgrade-v1.fixture.json: |
{{ $fixture | trimSuffix "\n" | indent 4 }}
