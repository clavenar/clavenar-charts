{{/* Governed TLS snapshot, mint, and transactional apply scripts. */}}
{{- if .Values.tlsBundle.autoMint }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-tls-automint
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-15"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
  labels:
    {{- include "clavenar.labels" (dict "ctx" . "service" "tls-automint") | nindent 4 }}
data:
  snapshot.sh: |
{{ .Files.Get "files/tls-rotation/snapshot.sh" | nindent 4 }}
  mint.sh: |
{{ .Files.Get "files/tls-rotation/mint.sh" | nindent 4 }}
  apply.sh: |
{{ .Files.Get "files/tls-rotation/apply.sh" | nindent 4 }}
{{- end }}
