upstreamStub:
  enabled: true
exec:
  enabled: true
  image:
    digest: sha256:6bcabdcf6f211299a38a786e7f3e11eede1b92ccb31dfb38f0323fe35b0592ff
proxyAlias:
  enabled: true
tlsBundle:
  secretName: optional-workload-tls
services:
  console:
    mutationOrigins:
      - https://console.example.test
    operatorMtls:
      enabled: true
      publicTrustSecretName: optional-operator-trust
    demo:
      enabled: true
networkPolicy:
  console:
    operatorMtls:
      allowedPeers:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: operator-access
          podSelector:
            matchLabels:
              app.kubernetes.io/name: operator-tls-passthrough
    demo:
      allowedPeers:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
