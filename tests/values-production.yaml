# Canonical fail-closed production render. Referenced Secrets and the external
# website workload must already exist in the explicitly selected external
# namespace; the chart never mints production trust. Keep that namespace
# distinct from both the Helm release and Prometheus namespaces.
deploymentProfile: production
proxyAlias:
  enabled: true
identityAlias:
  enabled: true
exec:
  enabled: false

alertmanager:
  enabled: true
  configLabels:
    alertmanagerConfig: clavenar
  receiver:
    urlSecretName: clavenar-alert-routing
    urlSecretKey: webhook-url
    bearerSecretName: clavenar-alert-routing
    bearerSecretKey: bearer-token

scheduledBackup:
  enabled: true
  operator: platform-backup-controller
  schedule: "0 8 * * 0"
  maximumAgeSeconds: 612000
  repositorySecretName: clavenar-backup-repository
  receiptSecretName: clavenar-backup-receipt
  encryptionFormat: restic-repository-v2
  offsiteClass: content-addressed-or-versioned

ledgerCryptographicVerification:
  enabled: true
  tsaRequired: true

authSecrets:
  existingSecretName: clavenar-runtime-auth
  rotationId: prod-20260715-01

hilPayloadProtection:
  managedEvaluation: false
  secretName: clavenar-hil-payload
  key: hil-payload-key

attestationTrustAnchors:
  secretName: clavenar-attestation-trust

evaluationPublicTrust:
  enabled: false

vault:
  addr: https://vault.internal:8200
  tokenSecretName: clavenar-vault-token
  identityTokenKey: identity-token
  proxyTokenKey: proxy-token

# The chart does not configure an external broker. These fields are the
# operator-owned declaration that the endpoint below enforces the public v1
# authorization contract and durable JetStream storage.
nats:
  external:
    operator: platform-security
    authorizationContract: clavenar.nats-authorization/v1
    jetstreamPersistence: true

tlsBundle:
  secretName: clavenar-workload-tls
  autoMint: false

services:
  proxy:
    image: { digest: "sha256:1111111111111111111111111111111111111111111111111111111111111111" }
  brain:
    image: { digest: "sha256:2222222222222222222222222222222222222222222222222222222222222222" }
  policyEngine:
    image: { digest: "sha256:3333333333333333333333333333333333333333333333333333333333333333" }
  ledger:
    image: { digest: "sha256:4444444444444444444444444444444444444444444444444444444444444444" }
    requireTrustedProxy: true
    trustedProxySpiffe: spiffe://clavenar.local/service/website
  hil:
    image: { digest: "sha256:5555555555555555555555555555555555555555555555555555555555555555" }
  identity:
    image: { digest: "sha256:6666666666666666666666666666666666666666666666666666666666666666" }
  deepReview:
    image: { digest: "sha256:7777777777777777777777777777777777777777777777777777777777777777" }
  assurance:
    image: { digest: "sha256:8888888888888888888888888888888888888888888888888888888888888888" }
  console:
    image: { digest: "sha256:9999999999999999999999999999999999999999999999999999999999999999" }
    mutationOrigins:
      - https://console.example.test
    operatorMtls:
      enabled: true
      publicTrustSecretName: clavenar-operator-public-trust
    demo:
      enabled: true

networkPolicy:
  enabled: true
  ledger:
    trustedProxy:
      allowedPeers:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: clavenar-edge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: clavenar-website
  console:
    operatorMtls:
      allowedPeers:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: operator-access
          podSelector:
            matchLabels:
              app.kubernetes.io/name: operator-tls-passthrough
    demo:
      allowedPeers:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
