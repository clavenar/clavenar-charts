rule_files:
  - ../charts/clavenar/alerts/clavenar-alerts.yaml

evaluation_interval: 1m

tests:
  - name: forensic delivery alerts use bounded owner labels
    interval: 1m
    input_series:
      - series: 'clavenar_forensic_missing_stages{job="identity",instance="identity-1",family="identity",stage="credential.released"}'
        values: '1+0x8'
      - series: 'clavenar_forensic_outbox_oldest_age_seconds{job="hil",instance="hil-1"}'
        values: '360+0x8'
      - series: 'clavenar_forensic_outbox_depth{job="hil",instance="hil-1",state="ready"}'
        values: '2+0x8'
      - series: 'clavenar_forensic_outbox_depth{job="hil",instance="hil-1",state="retry"}'
        values: '0+0x8'
    alert_rule_test:
      - eval_time: 6m
        alertname: ForensicStageMissing
        exp_alerts:
          - exp_labels:
              component: forensic-delivery
              family: identity
              instance: identity-1
              job: identity
              severity: critical
              stage: credential.released
            exp_annotations:
              summary: Required forensic terminal stage is missing
              description: |
                A reconciliation-contract intent is more than five minutes old
                without its required terminal stage (family=identity,
                stage=credential.released). Inspect the owner outbox and retained
                reconciliation state. Never replay the governed effect to repair
                evidence.
      - eval_time: 6m
        alertname: ForensicOutboxStalled
        exp_alerts:
          - exp_labels:
              component: forensic-delivery
              instance: hil-1
              job: hil
              severity: warning
            exp_annotations:
              summary: Forensic outbox has not drained within five minutes
              description: |
                The oldest undelivered forensic row has exceeded the reconciliation
                grace while ready or retry rows remain. Inspect retry counters,
                NATS JetStream health, and the Ledger consumer before backlog age
                approaches retention limits.

  - name: console operator Service exposure matches the rendered Service name
    interval: 1m
    input_series:
      - series: 'kube_service_spec_type{service="smoke-console",type="NodePort"}'
        values: '1+0x3'
      - series: 'kube_service_spec_type{service="production-console",type="LoadBalancer"}'
        values: '1+0x3'
      - series: 'kube_service_spec_type{service="safe-console",type="ClusterIP"}'
        values: '1+0x3'
      - series: 'kube_service_spec_type{service="unrelated-api",type="NodePort"}'
        values: '1+0x3'
      - series: 'kube_service_spec_type{service="legacy-console-operator",type="NodePort"}'
        values: '1+0x3'
    alert_rule_test:
      - eval_time: 2m
        alertname: ConsoleOperatorServiceExposed
        exp_alerts:
          - exp_labels:
              component: console
              service: smoke-console
              severity: critical
              type: NodePort
            exp_annotations:
              summary: Console operator Service is externally exposed
              description: |
                The console Service carrying the operator-mTLS listener changed
                from ClusterIP to NodePort or LoadBalancer. Revert the Service and
                verify TLS passthrough plus the exact operator NetworkPolicy before
                restoring access.
          - exp_labels:
              component: console
              service: production-console
              severity: critical
              type: LoadBalancer
            exp_annotations:
              summary: Console operator Service is externally exposed
              description: |
                The console Service carrying the operator-mTLS listener changed
                from ClusterIP to NodePort or LoadBalancer. Revert the Service and
                verify TLS passthrough plus the exact operator NetworkPolicy before
                restoring access.

  - name: brain fallback alerts retain bounded route labels
    interval: 1m
    input_series:
      - series: 'clavenar_brain_provider_fallback_total{workload="narrate_decision",provider="ollama-local",model="llama3.2:1b",outcome="attempted",reason="connect"}'
        values: '0+1x5'
      - series: 'clavenar_brain_provider_fallback_total{workload="classifier.fast",provider="openai-alternate",model="gpt-4o-mini",outcome="exhausted",reason="rate_limited"}'
        values: '0 1+0x4'
    alert_rule_test:
      - eval_time: 4m
        alertname: BrainProviderFallbackActive
        exp_alerts:
          - exp_labels:
              component: brain
              model: llama3.2:1b
              outcome: attempted
              provider: ollama-local
              reason: connect
              severity: warning
              workload: narrate_decision
            exp_annotations:
              summary: Brain provider fallback is active
              description: |
                A logical workload selected or completed a fallback at least three
                times in fifteen minutes. The route is serving traffic, but the
                primary target is not healthy; inspect its bounded reason label.
      - eval_time: 4m
        alertname: BrainProviderFallbackStopped
        exp_alerts:
          - exp_labels:
              component: brain
              model: gpt-4o-mini
              outcome: exhausted
              provider: openai-alternate
              reason: rate_limited
              severity: critical
              workload: classifier.fast
            exp_annotations:
              summary: Brain provider fallback stopped fail-closed
              description: |
                A configured fallback route was blocked, exhausted, or stopped on
                a non-replay-safe failure. Security detectors remain fail-closed.
                Restore the prior Secret/routing revision or repair the named
                provider target before retrying.
