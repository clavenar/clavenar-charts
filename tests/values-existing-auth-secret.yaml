# The Secret is provisioned out-of-band. This values file contains references
# only; no authentication value belongs in chart values or rendered Deployment
# env literals.
authSecrets:
  existingSecretName: clavenar-runtime-auth
  rotationId: test-rotation-02

services:
  console:
    extraEnv:
      - name: CLAVENAR_CONSOLE_DEMO_SESSION_HS256
        valueFrom:
          secretKeyRef:
            name: clavenar-runtime-auth
            key: demo-session-hs256
  ledger:
    extraEnv:
      - name: CLAVENAR_LEDGER_DEMO_SESSION_HS256
        valueFrom:
          secretKeyRef:
            name: clavenar-runtime-auth
            key: demo-session-hs256
  hil:
    extraEnv:
      - name: CLAVENAR_HIL_DB
        value: /var/lib/clavenar/hil.db
      - name: CLAVENAR_HIL_DEMO_SESSION_HS256
        valueFrom:
          secretKeyRef:
            name: clavenar-runtime-auth
            key: demo-session-hs256
  identity:
    extraEnv:
      - name: CLAVENAR_IDENTITY_DB
        value: /var/lib/clavenar/identity.db
      - name: CLAVENAR_IDENTITY_OIDC_TENANT_ACME_ISSUER
        value: https://idp.example.com/
      - name: CLAVENAR_IDENTITY_OIDC_TENANT_ACME_AUDIENCE
        value: clavenar-identity
      - name: CLAVENAR_IDENTITY_OIDC_TENANT_ACME_RS256_JWKS_FILE
        value: /var/run/clavenar-oidc/acme-jwks.json
      - name: CLAVENAR_IDENTITY_REQUIRE_ASYMMETRIC_OIDC
        value: "true"
    extraVolumeMounts:
      - name: oidc-jwks
        mountPath: /var/run/clavenar-oidc
        readOnly: true
    extraVolumes:
      - name: oidc-jwks
        secret:
          secretName: clavenar-runtime-auth
          items:
            - key: oidc-jwks.json
              path: acme-jwks.json
